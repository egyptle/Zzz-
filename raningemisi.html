                bFang.position.set(bx, 1.8, bz);
                bFang.rotation.x = -0.28;
                apophisLowerJaw.add(bFang);
            }

            // 4. APOPHIS'İN BAŞINDAN GEMİYE SALDIRAN 10 KIVRIMLI KARANLIK KAOS DOKUNACI (Tendrils)
            apophisTendrils = [];
            for (let td = 0; td < 10; td++) {
                const ang = (td / 10) * Math.PI * 2;
                const tGroup = new THREE.Group();
                tGroup.position.set(Math.cos(ang) * 22.0, Math.sin(ang) * 18.0, -6.0);
                tGroup.rotation.z = ang;
                apophisHeadGroup.add(tGroup);

                const segs = [];
                let parentNode = tGroup;
                for (let s = 0; s < 5; s++) {
                    const pivot = new THREE.Group();
                    pivot.position.set(0, s === 0 ? 0 : 7.2, 0);
                    parentNode.add(pivot);

                    const rBot = THREE.MathUtils.lerp(2.4, 0.3, s / 5);
                    const rTop = THREE.MathUtils.lerp(1.8, 0.08, s / 5);
                    const segMesh = new THREE.Mesh(
                        new THREE.CylinderGeometry(rTop, rBot, 7.6, 7),
                        s % 2 === 0 ? voidArmorMat : apophisSkinMat
                    );
                    segMesh.position.y = 3.8;
                    pivot.add(segMesh);
                    segs.push(pivot);
                    parentNode = pivot;
                }
                apophisTendrils.push({ segs, phase: td * 0.7 });
            }

            // 5. TEK PARÇA KESİNTİSİZ KIVRILAN VE BOYUNDA KOBRA KALKANI GİBİ GENİŞLEYEN YILAN GÖVDESİ
            // (Ayrı Dikdörtgen Kutu Yok! Gövdenin Kendisi Boyunda Organik Kobra Başlığı Gibi Genişler!)
            const numRings = 56;
            const radialSegs = 28;
            const serpentGeo = new THREE.BufferGeometry();
            const vertices = new Float32Array((numRings + 1) * (radialSegs + 1) * 3);
            const uvs = new Float32Array((numRings + 1) * (radialSegs + 1) * 2);
            const indices = [];

            apophisTubeRingCenters = [];
            for (let r = 0; r <= numRings; r++) {
                const t = r / numRings;
                // Boyun bölgesinde (t = 0.03 .. 0.18) gerçek kobra başlığı (Cobra Hood) gibi yatay genişleme
                const hoodFlare = Math.sin(Math.min(1.0, t / 0.20) * Math.PI) * 12.5;
                const baseRadius = THREE.MathUtils.lerp(21.0, 2.5, Math.pow(t, 0.85));
                const baseZ = -152.0 - t * 270.0;
                apophisTubeRingCenters.push({ t, baseRadius, hoodFlare, baseZ });

                for (let s = 0; s <= radialSegs; s++) {
                    const u = s / radialSegs;
                    const vIdx = (r * (radialSegs + 1) + s);
                    uvs[vIdx * 2] = u;
                    uvs[vIdx * 2 + 1] = t;
                }
            }

            for (let r = 0; r < numRings; r++) {
                for (let s = 0; s < radialSegs; s++) {
                    const a = r * (radialSegs + 1) + s;
                    const b = (r + 1) * (radialSegs + 1) + s;
                    const c = (r + 1) * (radialSegs + 1) + (s + 1);
                    const d = r * (radialSegs + 1) + (s + 1);
                    indices.push(a, b, d, b, c, d);
                }
            }

            serpentGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            serpentGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
            serpentGeo.setIndex(indices);

            apophisTubeMesh = new THREE.Mesh(serpentGeo, apophisSkinMat);
            worldGroup.add(apophisTubeMesh);

            apophisSpineMeshes = [];
            apophisSmokeSprites = [];
            for (let r = 1; r < numRings; r += 2) {
                const rc = apophisTubeRingCenters[r];
                const spine = new THREE.Mesh(
                    new THREE.ConeGeometry(rc.baseRadius * 0.26, rc.baseRadius * 1.05, 5),
                    voidArmorMat
                );
                worldGroup.add(spine);
                apophisSpineMeshes.push({ mesh: spine, ringIndex: r });

                const smokeSprite = new THREE.Sprite(
                    new THREE.SpriteMaterial({
                        map: window.textures.smokeTex,
                        transparent: true,
                        opacity: 0.76,
                        depthWrite: false
                    })
                );
                const smScale = (rc.baseRadius + rc.hoodFlare * 0.5) * 4.8;
                smokeSprite.scale.set(smScale, smScale, 1);
                worldGroup.add(smokeSprite);
                apophisSmokeSprites.push({ sprite: smokeSprite, ringIndex: r, phase: r * 0.4 });
            }

            // ------------------------------------------------------------------------
            // F. 3.200 KUSURSUZ DAİRESEL KOZMİK YILDIZ VE GÜNEŞ KIVILCIMI
            // ------------------------------------------------------------------------
            const pCount = 3200;
            const pGeo = new THREE.BufferGeometry();
            const pPositions = new Float32Array(pCount * 3);
            const pColors = new Float32Array(pCount * 3);
            cosmicParticleSpeeds = [];

            for (let i = 0; i < pCount; i++) {
                pPositions[i * 3] = (Math.random() - 0.5) * 360;
                pPositions[i * 3 + 1] = (Math.random() - 0.5) * 210;
                pPositions[i * 3 + 2] = (Math.random() - 0.5) * 440;
                cosmicParticleSpeeds.push(4.0 + Math.random() * 10.0);

                const isSolar = i % 3 !== 0;
                pColors[i * 3] = isSolar ? 1.0 : 0.95;
                pColors[i * 3 + 1] = isSolar ? 0.84 : 0.22;
                pColors[i * 3 + 2] = isSolar ? 0.32 : 0.40;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
            pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

            cosmicParticles = new THREE.Points(pGeo, createCircularPointsMaterial(1.65, 0.88));
            worldGroup.add(cosmicParticles);

            const standGeo = new THREE.CylinderGeometry(0.32, 0.52, 1.8, 6);
            standGeo.translate(0, 0.9, 0);
            const flameGeo = new THREE.OctahedronGeometry(0.52, 1);
            const standInst = new THREE.InstancedMesh(standGeo, goldMat, deckFlameData.length);
            deckFlameInst = new THREE.InstancedMesh(flameGeo, solarPlasmaMat, deckFlameData.length);

            deckFlameData.forEach((f, i) => {
                dummy.position.set(f.x, f.y, f.z);
                dummy.scale.setScalar(f.scale);
                dummy.updateMatrix();
                standInst.setMatrixAt(i, dummy.matrix);

                dummy.position.set(f.x, f.y + 2.0 * f.scale, f.z);
                dummy.updateMatrix();
                deckFlameInst.setMatrixAt(i, dummy.matrix);
            });
            shipGroup.add(standInst, deckFlameInst);
        }

        // ============================================================================
        // 4. SAHNE KURULUMU, PÜRÜZSÜZ GLSL DERİN UZAY NEBULASI VE GÜVERTE MÜRETTEBATI
        // ============================================================================
        function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.08;
            document.body.appendChild(renderer.domElement);

            window.textures = buildSpaceWorldTextures(renderer);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020308);
            scene.environment = window.textures.envMap;

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.3, 1800);
            clock = new THREE.Clock();

            const skyShaderMat = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vWorldPos;
                    void main() {
                        vWorldPos = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vWorldPos;
                    void main() {
                        vec3 d = normalize(vWorldPos);
                        float band = exp(-abs(d.y - d.x * 0.28) * 4.5);
                        float glow = sin(d.x * 5.0) * cos(d.z * 5.0) * 0.5 + 0.5;
                        vec3 col = vec3(0.008, 0.012, 0.03);
                        col += vec3(0.06, 0.02, 0.10) * band * glow;
                        col += vec3(0.08, 0.04, 0.01) * pow(band, 2.0);
                        gl_FragColor = vec4(col, 1.0);
                    }
                `,
                side: THREE.BackSide,
                depthWrite: false
            });
            const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1450, 32, 24), skyShaderMat);
            scene.add(skyDome);

            const starCount = 3500;
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(starCount * 3);
            const starCol = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 1150 + Math.random() * 150;
                starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                starPos[i * 3 + 2] = r * Math.cos(phi);

                const tint = Math.random();
                starCol[i * 3] = tint > 0.3 ? 1.0 : 0.78;
                starCol[i * 3 + 1] = tint > 0.3 ? 0.94 : 0.88;
                starCol[i * 3 + 2] = tint > 0.6 ? 0.72 : 1.0;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
            const farStars = new THREE.Points(starGeo, createCircularPointsMaterial(6.5, 0.92));
            scene.add(farStars);

            const hemiLight = new THREE.HemisphereLight(0xfde68a, 0x090d1a, 0.88);
            scene.add(hemiLight);

            const sunDirLight = new THREE.DirectionalLight(0xfffbeb, 1.65);
            sunDirLight.position.set(-68, 65, 130);
            sunDirLight.castShadow = true;
            sunDirLight.shadow.mapSize.set(2048, 2048);
            const d = 75;
            sunDirLight.shadow.camera.left = -d;
            sunDirLight.shadow.camera.right = d;
            sunDirLight.shadow.camera.top = d;
            sunDirLight.shadow.camera.bottom = -d;
            sunDirLight.shadow.camera.far = 260;
            sunDirLight.shadow.bias = -0.0005;
            scene.add(sunDirLight);

            const clashPointLight = new THREE.PointLight(0xf59e0b, 3.6, 180);
            clashPointLight.position.set(0, 12, -98);
            scene.add(clashPointLight);

            buildGodsOfEgyptSpaceWorld();

            // Oyuncunun Kontrol Ettiği Karakter (karaktertanrilar.html'den Entegre Gerçek 3B PBR Modeller)
            window.updatePlayerModelScale = () => {
                player = window.spawnPlayerCharacter(scene, renderer, new THREE.Vector3(0, 0, -14), Math.PI);
            };
            window.updatePlayerModelScale();

            for (let i = 0; i < 12; i++) {
                const priest = createCharacter(0.98, 'priest', false);
                const ang = (i / 12) * Math.PI * 2;
                priest.root.position.set(Math.cos(ang) * 3.6, 0.85, 2.0 + Math.sin(ang) * 4.4);
                priest.root.rotation.y = Math.PI;
                scene.add(priest.root);
                deckCrew.push(priest);
            }

            for (let i = 0; i < 16; i++) {
                const guard = createCharacter(1.25, 'solar_guard', false);
                const side = i % 2 === 0 ? -1 : 1;
                const gz = -34 + Math.floor(i / 2) * 9.5;
                const zn = Math.abs(gz) / 43.0;
                const taper = Math.max(0.38, 1.0 - Math.pow(zn, 2.2) * 0.58);
                const sheerY = Math.pow(zn, 2.4) * 1.6;
                guard.root.position.set(side * 6.4 * taper, sheerY, gz);
                guard.root.rotation.y = Math.PI;
                scene.add(guard.root);
                deckCrew.push(guard);
            }

            // 3D Çıkış Portalı (Nil Dünyasına Dönüş)
            const exitGroup = new THREE.Group();
            exitGroup.position.set(0, 0.45, 24.0);
            const ringGeo = new THREE.RingGeometry(2.0, 2.8, 32);
            ringGeo.rotateX(-Math.PI / 2);
            const ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide }));
            exitGroup.add(ringMesh);

            const cylGeo = new THREE.CylinderGeometry(2.4, 2.4, 3.8, 16, 1, true);
            const cylMesh = new THREE.Mesh(cylGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
            cylMesh.position.y = 1.9;
            exitGroup.add(cylMesh);
            scene.add(exitGroup);
            window.spaceExitPortal = { group: exitGroup, cyl: cylMesh };

            // Oyuncu Rolü ve Tanrı Boyutu
            window.updatePlayerModelScale = function() {
                if (!player) return;
                const state = window.GameState ? window.GameState.state : null;
                const role = state ? state.player.role : 'mortal';
                const scale = (role === 'god_horus' || role === 'god_set') ? 2.5 : 1.0;
                player.root.scale.setScalar(scale);
            };
            window.updatePlayerModelScale();

            window.scene = scene;
            window.camera = camera;
            window.renderer = renderer;

            if (window.EgyptCollisionEngine) {
                window.EgyptCollisionEngine.clearColliders();
                // Geminin Güneş Sunağı ve Direk Engelleri
                window.EgyptCollisionEngine.addCylinderCollider(0, 2.0, 3.2); // Sun Altar
                window.EgyptCollisionEngine.addCylinderCollider(0, -38.0, 1.8); // Bow Mast
            }

            if (window.EgyptCombatEngine) {
                window.EgyptCombatEngine.clearTargets();
                if (window.apophisHead) {
                    window.EgyptCombatEngine.registerTarget(window.apophisHead, 2000, 2000, 6.0, 'Kaos Canavarı Apophis', (dmg, remHp) => {
                        if (window.GameHUD) window.GameHUD.showToast(`🌑 APOPHIS YARALANDI! Kalan: ${remHp}`, 'danger');
                    });
                }
            }

            bindSpaceControls();
            window.addEventListener('resize', onResize);
            animate();
        }

        // ============================================================================
        // 5. MOBİL DOKUNMATİK KONTROLLER (JOYSTICK, 360° KAMERA VE KUŞBAKIŞI UZAKLAŞTIRMA)
        // ============================================================================
        function bindSpaceControls() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const maxR = 40;

            function updateJoy(cx, cy) {
                const rect = zone.getBoundingClientRect();
                let dx = cx - (rect.left + rect.width / 2);
                let dy = cy - (rect.top + rect.height / 2);
                const dist = Math.hypot(dx, dy);
                if (dist > maxR) {
                    dx = (dx / dist) * maxR;
                    dy = (dy / dist) * maxR;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyVec.x = dx / maxR;
                joyVec.y = dy / maxR;
            }

            zone.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                joyActive = true;
                joyPointerId = e.pointerId;
                updateJoy(e.clientX, e.clientY);
            });

            const canvas = renderer.domElement;
            canvas.style.touchAction = 'none';
            canvas.addEventListener('pointerdown', (e) => {
                canvas.setPointerCapture(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (joyActive && e.pointerId === joyPointerId) {
                    updateJoy(e.clientX, e.clientY);
                    return;
                }
                if (!activePointers.has(e.pointerId)) return;

                const prev = activePointers.get(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 1) {
                    camYaw -= (e.clientX - prev.x) * 0.008;
                    const isFpv = window.EgyptCameraSystem && window.EgyptCameraSystem.isFirstPerson;
                    if (isFpv) {
                        camPitch = Math.max(-1.42, Math.min(1.42, camPitch - (e.clientY - prev.y) * 0.0075));
                    } else {
                        camPitch = Math.max(-0.35, Math.min(1.42, camPitch + (e.clientY - prev.y) * 0.0065));
                    }
                } else if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinchDist > 0) {
                        desiredDist = Math.max(2.5, Math.min(380.0, desiredDist + (lastPinchDist - dist) * 0.22));
                    }
                    lastPinchDist = dist;
                }
            });

            function endPointer(e) {
                if (joyActive && e.pointerId === joyPointerId) {
                    joyActive = false;
                    joyPointerId = null;
                    joyVec.x = 0;
                    joyVec.y = 0;
                    knob.style.transform = 'translate(0px, 0px)';
                }
                activePointers.delete(e.pointerId);
                if (activePointers.size < 2) lastPinchDist = 0;
            }

            window.addEventListener('pointerup', endPointer);
            window.addEventListener('pointercancel', endPointer);

            window.addEventListener('wheel', (e) => {
                desiredDist = Math.max(2.5, Math.min(380.0, desiredDist + e.deltaY * 0.09));
            });

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (k === 's' || e.key === 'ArrowDown') keys.s = true;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (k === 's' || e.key === 'ArrowDown') keys.s = false;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================================================
        // 6. CANLI RA vs. APOPHIS SAVAŞI VE KESİNTİSİZ EJDERHA-YILAN ANİMASYONU (60 FPS)
        // ============================================================================
        const animDummy = new THREE.Object3D();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            if (earthShaderUniforms) earthShaderUniforms.uTime.value = elapsed;
            if (sunShaderUniforms) sunShaderUniforms.uTime.value = elapsed;
            if (coronaShaderUniforms) coronaShaderUniforms.uTime.value = elapsed;
            if (vortexShaderUniforms) vortexShaderUniforms.uTime.value = elapsed;

            let ix = joyVec.x;
            let iy = joyVec.y;
            if (keys.w) iy = -1;
            if (keys.s) iy = 1;
            if (keys.a) ix = -1;
            if (keys.d) ix = 1;

            const mag = Math.min(1, Math.hypot(ix, iy));
            const moving = mag > 0.05;

            if (moving && player) {
                const fwdX = -Math.sin(camYaw);
                const fwdZ = -Math.cos(camYaw);
                const rightX = Math.cos(camYaw);
                const rightZ = -Math.sin(camYaw);

                const dirX = rightX * ix + fwdX * (-iy);
                const dirZ = rightZ * ix + fwdZ * (-iy);

                const walkSpeed = 8.4 * mag;
                let nextZ = Math.max(-40.0, Math.min(39.0, player.root.position.z + dirZ * walkSpeed * delta));
                const zn = Math.abs(nextZ) / 43.0;
                let candX = Math.max(-maxDeckX, Math.min(maxDeckX, player.root.position.x + dirX * walkSpeed * delta));
                const sheerY = Math.pow(zn, 2.4) * 1.6;

                // Güverte Direkleri ve Sunağa Çarpışma Kontrolü
                if (window.EgyptCollisionEngine) {
                    const resolved = window.EgyptCollisionEngine.resolvePosition(
                        player.root.position,
                        { x: candX, z: nextZ },
                        (player.scale || 1) * 0.45,
                        player.root.position.y
                    );
                    player.root.position.x = resolved.x;
                    player.root.position.z = resolved.z;
                } else {
                    player.root.position.x = candX;
                    player.root.position.z = nextZ;
                }

                let groundY = sheerY;
                if (player.root.position.z < -37.5) groundY = 1.95;
                else if (Math.abs(player.root.position.x) < 5.3 && player.root.position.z > -5.5 && player.root.position.z < 9.5) groundY = 0.85;

                if (window.EgyptCollisionEngine) {
                    window.EgyptCollisionEngine.setGroundElevation(() => groundY);
                } else {
                    player.root.position.y = groundY;
                }

                const targetRot = Math.atan2(dirX, dirZ);
                let diff = targetRot - player.root.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                player.root.rotation.y += diff * 0.18;
            }

            // Yerçekimi, Zıplama ve Manyetik Eşya Çekimini Güncelle
            if (player && window.EgyptCollisionEngine) {
                window.EgyptCollisionEngine.updatePhysics(player, delta);
                window.EgyptCollisionEngine.updateMagneticDrops(player.root.position, delta, elapsed);
            }

            // Savaş Efektleri & Hasar Yazılarını Güncelle
            if (window.EgyptCombatEngine) {
                window.EgyptCombatEngine.update(delta, camera);
            }

            if (player) {
                if (window.EgyptCharacterEngine && window.EgyptCharacterEngine.animateEgyptCharacter) {
                    window.EgyptCharacterEngine.animateEgyptCharacter(player, moving, mag, delta, elapsed);
                } else {
                    animateCharacter(player, moving, mag, delta, elapsed);
                }
            }

            for (let i = 0; i < deckCrew.length; i++) {
                animateCharacter(deckCrew[i], false, 0, delta, elapsed);
            }

            // 1. Dünya'daki Nil Deltası'ndan (94, -18, 155) Gemideki Sunağa (0, 4.5, 2) Yükselen Altın Dua Bulutsusu
            if (earthGlobe) {
                earthGlobe.rotation.y = Math.sin(elapsed * 0.06) * 0.025;
            }
            if (prayerStreamPoints) {
                const pArr = prayerStreamPoints.geometry.attributes.position.array;
                for (let i = 0; i < prayerParticleData.length; i++) {
                    const pd = prayerParticleData[i];
                    const t = (pd.baseT + elapsed * pd.speed) % 1.0;
                    const env = Math.sin(t * Math.PI);
                    const r = pd.spreadR * (0.35 + env * 0.85);
                    const ang = pd.spreadAng + t * 4.5 + elapsed * 1.2;

                    pArr[i * 3] = THREE.MathUtils.lerp(94, 0, t) + Math.cos(ang) * r;
                    pArr[i * 3 + 1] = THREE.MathUtils.lerp(-18, 4.5, t) + Math.sin(t * Math.PI) * 16.0 + Math.sin(ang) * r;
                    pArr[i * 3 + 2] = THREE.MathUtils.lerp(155, 2.0, t);
                }
                prayerStreamPoints.geometry.attributes.position.needsUpdate = true;
            }

            // 2. Geminin Yelpaze Altın Şahin Kanatları, Usturlap Halkaları ve Ra'nın Merkezi Kilitli Sarmal Işını
            for (let i = 0; i < solarWingSets.length; i++) {
                const sw = solarWingSets[i];
                sw.pivot.rotation.z = Math.sin(elapsed * 1.8 + sw.phase) * 0.16 * sw.side;
                sw.pivot.rotation.y = Math.cos(elapsed * 1.8 + sw.phase) * 0.08 * sw.side;
            }
            for (let i = 0; i < sanctumAstrolabeRings.length; i++) {
                const ar = sanctumAstrolabeRings[i];
                ar.mesh.rotation.x += ar.speedX * delta;
                ar.mesh.rotation.y += ar.speedY * delta;
            }
            if (raWings.left && raWings.right) {
                const wingBeat = Math.sin(elapsed * 2.4) * 0.12;
                raWings.left.rotation.y = wingBeat;
                raWings.right.rotation.y = -wingBeat;
            }
            if (solarBeamCore && solarBeamHelix1 && solarBeamHelix2 && clashImpactCore) {
                const pulse = 1.0 + Math.sin(elapsed * 22.0) * 0.18;
                solarBeamCore.scale.set(pulse, 1.0, pulse);
                solarBeamHelix1.rotation.z = elapsed * 7.5;
                solarBeamHelix2.rotation.z = -elapsed * 6.5;
                clashImpactCore.scale.setScalar(0.92 + Math.sin(elapsed * 18.0) * 0.24);
                for (let l = 0; l < clashLightningArcs.length; l++) {
                    clashLightningArcs[l].rotation.z += delta * (l % 2 === 0 ? 5.0 : -5.0);
                    clashLightningArcs[l].scale.y = 0.7 + Math.sin(elapsed * 25.0 + l) * 0.45;
                }
            }

            // 3. Apophis'in Zırhlı Ejderha Çeneleri, 10 Kaos Dokunacı ve Kobra Başlıklı Tek Parça Yılan Gövdesi
            const headWaveX = Math.sin(elapsed * 1.4) * 4.2;
            const headWaveY = 8.6 + Math.cos(elapsed * 1.7) * 3.0;
            if (apophisHeadGroup) {
                apophisHeadGroup.position.set(headWaveX, headWaveY, -144.0);
                apophisHeadGroup.rotation.z = Math.sin(elapsed * 1.1) * 0.10;
            }
            if (apophisUpperJaw && apophisLowerJaw) {
                const roar = 0.28 + Math.sin(elapsed * 3.2) * 0.14;
                apophisUpperJaw.rotation.x = -roar * 0.75;
                apophisLowerJaw.rotation.x = roar * 1.15;
            }
            for (let i = 0; i < apophisInnerMawRings.length; i++) {
                apophisInnerMawRings[i].group.rotation.z = elapsed * apophisInnerMawRings[i].speed;
            }
            for (let i = 0; i < apophisTendrils.length; i++) {
                const td = apophisTendrils[i];
                for (let s = 0; s < td.segs.length; s++) {
                    td.segs[s].rotation.x = 0.22 + Math.sin(elapsed * 3.4 + td.phase - s * 0.6) * 0.26;
                    td.segs[s].rotation.z = Math.cos(elapsed * 2.7 + td.phase - s * 0.5) * 0.22;
                }
            }

            if (apophisTubeMesh) {
                const posAttr = apophisTubeMesh.geometry.attributes.position;
                const radialSegs = 28;
                const numRings = apophisTubeRingCenters.length - 1;

                for (let r = 0; r <= numRings; r++) {
                    const rc = apophisTubeRingCenters[r];
                    const t = rc.t;
                    const env = Math.min(1.0, t * 3.5);
                    const cx = THREE.MathUtils.lerp(headWaveX, Math.sin(elapsed * 1.8 - t * 11.0) * (15.0 + t * 38.0), env);
                    const cy = THREE.MathUtils.lerp(headWaveY, 8.6 + Math.cos(elapsed * 1.5 - t * 9.5) * (9.5 + t * 26.0), env);
                    const cz = rc.baseZ;
                    rc.currX = cx;
                    rc.currY = cy;
                    rc.currZ = cz;

                    for (let s = 0; s <= radialSegs; s++) {
                        const ang = (s / radialSegs) * Math.PI * 2;
                        const vIdx = r * (radialSegs + 1) + s;
                        // Boyunda Kobra Kalkanı (Cobra Hood) Yatay Genişlemesi ve Sırt Zırh Çıkıntısı
                        const rx = rc.baseRadius + rc.hoodFlare * Math.pow(Math.abs(Math.cos(ang)), 1.5);
                        const ry = rc.baseRadius * 0.88 + (Math.sin(ang) > 0.6 ? rc.baseRadius * 0.18 : 0.0);
                        posAttr.setXYZ(
                            vIdx,
                            cx + Math.cos(ang) * rx,
                            cy + Math.sin(ang) * ry,
                            cz
                        );
                    }
                }
                posAttr.needsUpdate = true;
                apophisTubeMesh.geometry.computeVertexNormals();

                for (let i = 0; i < apophisSpineMeshes.length; i++) {
                    const sp = apophisSpineMeshes[i];
                    const rc = apophisTubeRingCenters[sp.ringIndex];
                    sp.mesh.position.set(rc.currX, rc.currY + rc.baseRadius * 1.02, rc.currZ);
                }
                for (let i = 0; i < apophisSmokeSprites.length; i++) {
                    const sm = apophisSmokeSprites[i];
                    const rc = apophisTubeRingCenters[sm.ringIndex];
                    sm.sprite.position.set(
                        rc.currX + Math.sin(elapsed * 1.2 + sm.phase) * 4.5,
                        rc.currY + Math.cos(elapsed * 1.1 + sm.phase) * 4.5,
                        rc.currZ
                    );
                }
            }

            // 4. Uzay Parçacıkları ve Güverte Güneş Meşaleleri
            if (cosmicParticles) {
                const posArr = cosmicParticles.geometry.attributes.position.array;
                for (let i = 0; i < cosmicParticleSpeeds.length; i++) {
                    posArr[i * 3 + 2] += cosmicParticleSpeeds[i] * delta;
                    if (posArr[i * 3 + 2] > 220) {
                        posArr[i * 3 + 2] = -220;
                    }
                }
                cosmicParticles.geometry.attributes.position.needsUpdate = true;
            }
            if (deckFlameInst) {
                for (let i = 0; i < deckFlameData.length; i++) {
                    const f = deckFlameData[i];
                    const s = f.scale * (0.85 + Math.sin(elapsed * 11.0 + f.phase) * 0.18);
                    animDummy.position.set(f.x, f.y + 2.0 * f.scale, f.z);
                    animDummy.rotation.set(0, elapsed * 3.5 + f.phase, 0);
                    animDummy.scale.set(s, s * 1.4, s);
                    animDummy.updateMatrix();
                    deckFlameInst.setMatrixAt(i, animDummy.matrix);
                }
                deckFlameInst.instanceMatrix.needsUpdate = true;
            }

            // 3D Çıkış Portalı ve Dönüş Kontrolü
            if (window.spaceExitPortal) {
                window.spaceExitPortal.cyl.rotation.y += delta * 1.2;
                if (player) {
                    const dist = Math.hypot(player.root.position.x, player.root.position.z - 24.0);
                    if (dist < 2.8) {
                        if (!window.teleportingActive) {
                            window.teleportingActive = true;
                            if (window.GameHUD) window.GameHUD.showToast('Güneş Gemisinden Ayrılınıyor... Nil Dünyasına Işınlanılıyor!', 'gold');
                            setTimeout(() => {
                                window.GameState.teleportTo('mısır.html');
                            }, 600);
                        }
                    }
                }
            }

            // MMORPG Hasat, Madencilik ve Otomatik Görev Motoru
            if (window.EgyptGatheringEngine && player) {
                window.EgyptGatheringEngine.update(player, delta, elapsed);
            }

            // 5. 1. Şahıs / 3. Şahıs Evrensel Kamera Motoru
            if (window.EgyptCameraSystem && player) {
                window.EgyptCameraSystem.camYaw = camYaw;
                window.EgyptCameraSystem.camPitch = camPitch;
                window.EgyptCameraSystem.camDist = camDist;
                window.EgyptCameraSystem.desiredDist = desiredDist;
                window.EgyptCameraSystem.updateCamera(camera, player, moving, mag, delta, elapsed);
            } else if (player) {
                camDist = THREE.MathUtils.lerp(camDist, desiredDist, 0.12);
                const focusX = player.root.position.x;
                const focusY = player.root.position.y + 1.35;
                const focusZ = player.root.position.z;

                const cx = focusX + Math.sin(camYaw) * Math.cos(camPitch) * camDist;
                const cz = focusZ + Math.cos(camYaw) * Math.cos(camPitch) * camDist;
                const cy = focusY + Math.sin(camPitch) * camDist;

                camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.22);
                camera.lookAt(focusX, focusY, focusZ);
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
