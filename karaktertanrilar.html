                const blade = new THREE.Mesh(bladeGeom, goldMat);
                blade.rotation.x = Math.PI / 2;
                blade.rotation.y = Math.PI / 2;
                blade.position.set(0.003, 0, 0.08);
                wGroup.add(blade);
            } else if (role === 'villager') {
                const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c3416, roughness: 0.85 });
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.014, 0.22, 10), woodMat);
                handle.rotation.x = Math.PI / 2;
                handle.position.z = 0.04;
                wGroup.add(handle);

                const sickle = new THREE.Mesh(
                    new THREE.TorusGeometry(0.085, 0.010, 8, 18, Math.PI * 1.1),
                    darkGoldMat
                );
                sickle.rotation.y = Math.PI / 2;
                sickle.scale.set(1.0, 0.75, 0.35);
                sickle.position.set(0, -0.02, 0.20);
                wGroup.add(sickle);
            } else if (role === 'horus_human' || role === 'horus_god') {
                const spearHolder = new THREE.Group();
                spearHolder.rotation.x = 0.14;
                spearHolder.rotation.z = -0.04;
                wGroup.add(spearHolder);

                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.015, 1.75, 14), goldMat);
                shaft.position.y = 0.25;
                spearHolder.add(shaft);

                const wingsGuard = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.026, 0.036), lapisMat);
                wingsGuard.position.y = 1.12;
                spearHolder.add(wingsGuard);

                const spearTip = new THREE.Mesh(new THREE.ConeGeometry(0.036, 0.30, 4), goldMat);
                spearTip.rotation.y = Math.PI / 4;
                spearTip.scale.set(0.45, 1.0, 1.0);
                spearTip.position.y = 1.28;
                spearHolder.add(spearTip);

                const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.024, 1), glowBlueMat);
                core.position.y = 1.13;
                spearHolder.add(core);
            } else if (role === 'set_god') {
                const staffHolder = new THREE.Group();
                staffHolder.rotation.x = 0.14;
                staffHolder.rotation.z = -0.04;
                wGroup.add(staffHolder);

                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.017, 1.85, 14), obsidianMat);
                shaft.position.y = 0.28;
                staffHolder.add(shaft);

                for (let k = 0; k < 4; k++) {
                    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.005, 8, 16), goldMat);
                    ring.rotation.x = Math.PI / 2;
                    ring.position.y = -0.1 + k * 0.34;
                    staffHolder.add(ring);
                }

                const headFork = new THREE.Mesh(new THREE.ConeGeometry(0.058, 0.34, 4), goldMat);
                headFork.rotation.y = Math.PI / 4;
                headFork.scale.set(0.45, 1.0, 1.1);
                headFork.position.y = 1.35;
                staffHolder.add(headFork);

                const chaosOrb = new THREE.Mesh(new THREE.OctahedronGeometry(0.034, 1), glowRedMat);
                chaosOrb.position.y = 1.18;
                staffHolder.add(chaosOrb);
            }

            return wGroup;
        }

        // ==========================================
        // 7. TAM KARAKTER ANATOMİSİ VE 2016 FİLMİ TANRI ZIRHLARI
        // ==========================================
        function createCharacter(config) {
            const { name, role = 'bek', scale = 1.0 } = config;

            const root = new THREE.Group();
            root.scale.set(scale, scale, scale);

            const isHorusGod = role === 'horus_god';
            const isSetGod = role === 'set_god';
            const isHorusHuman = role === 'horus_human';
            const isArmoredGod = isHorusGod || isSetGod;
            const isDivine = isHorusGod || isSetGod || isHorusHuman;

            // 1. PBR MATERYALLER
            const goldMat = new THREE.MeshStandardMaterial({
                map: window.textures.goldTex,
                envMap: window.textures.envMap,
                envMapIntensity: 1.85,
                color: 0xffc72c,
                emissive: 0x241200,
                emissiveIntensity: 0.12,
                metalness: 0.86,
                roughness: 0.22
            });

            const darkGoldMat = new THREE.MeshStandardMaterial({
                map: window.textures.goldTex,
                envMap: window.textures.envMap,
                envMapIntensity: 1.65,
                color: 0xc27815,
                emissive: 0x1a0b00,
                emissiveIntensity: 0.10,
                metalness: 0.88,
                roughness: 0.28
            });

            const lapisMat = new THREE.MeshStandardMaterial({
                envMap: window.textures.envMap,
                envMapIntensity: 1.4,
                color: 0x1d4ed8,
                emissive: 0x071330,
                emissiveIntensity: 0.15,
                metalness: 0.55,
                roughness: 0.26
            });

            const obsidianMat = new THREE.MeshStandardMaterial({
                envMap: window.textures.envMap,
                envMapIntensity: 1.75,
                color: 0x26232b,
                emissive: 0x0c080a,
                emissiveIntensity: 0.10,
                metalness: 0.84,
                roughness: 0.24
            });

            const crimsonMat = new THREE.MeshStandardMaterial({
                color: 0x7f1d1d,
                roughness: 0.68,
                metalness: 0.12
            });

            const glowBlueMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc });
            const glowRedMat = new THREE.MeshBasicMaterial({ color: 0xf97316 });

            const torsoTex = role === 'villager' ? window.textures.torsoVillager : (isHorusHuman ? window.textures.torsoHorus : window.textures.torsoBek);
            const faceTex = role === 'villager' ? window.textures.faceVillager : (isHorusHuman ? window.textures.faceHorus : window.textures.faceBek);
            const baseSkinColor = role === 'villager' ? 0xb4704a : (isHorusHuman ? 0xd29066 : 0xc6825a);

            const torsoMat = isHorusGod ? darkGoldMat : (isSetGod ? obsidianMat : new THREE.MeshStandardMaterial({
                map: torsoTex,
                bumpMap: torsoTex,
                bumpScale: 0.004,
                color: 0xffffff,
                roughness: isHorusHuman ? 0.44 : 0.54,
                metalness: isHorusHuman ? 0.05 : 0.02,
                envMap: window.textures.envMap,
                envMapIntensity: 0.26
            }));

            // Yüz materyalinde bumpMap kullanmıyoruz; böylece sakal/ağız gölgesi yüzde çöküntü yapmaz!
            const faceMat = isHorusGod ? goldMat : (isSetGod ? obsidianMat : new THREE.MeshStandardMaterial({
                map: faceTex,
                color: 0xffffff,
                roughness: 0.46,
                metalness: 0.02,
                envMap: window.textures.envMap,
                envMapIntensity: 0.24
            }));

            const limbSkinMat = isHorusGod ? goldMat : (isSetGod ? obsidianMat : new THREE.MeshStandardMaterial({
                color: baseSkinColor,
                roughness: isHorusHuman ? 0.44 : 0.54,
                metalness: isHorusHuman ? 0.05 : 0.02,
                envMap: window.textures.envMap,
                envMapIntensity: 0.26
            }));

            const linenMat = new THREE.MeshStandardMaterial({
                map: window.textures.linenTex,
                bumpMap: window.textures.linenTex,
                bumpScale: 0.004,
                color: role === 'villager' ? 0xe2d3ba : 0xffffff,
                roughness: 0.80
            });

            const leatherMat = new THREE.MeshStandardMaterial({
                color: 0x4a2811,
                roughness: 0.62,
                metalness: 0.10
            });

            const muscleScale = isArmoredGod ? 1.14 : (isHorusHuman ? 1.07 : 1.0);

            // 2. PELVIS (BELE SIFIR OTURAN SHENDYT ETEK VE ZIRHLI KRALİYET KEMERİ)
            const pelvis = new THREE.Group();
            pelvis.position.y = 0.94;
            root.add(pelvis);

            // Etek üst çapı (0.136) bel çapıyla birebir eşleştirildi -> Yukarıdan bakınca asla simit boşluğu görünmez!
            const kiltGeom = new THREE.CylinderGeometry(0.136 * muscleScale, 0.188 * muscleScale, 0.34, 48, 8, false);
            const kPos = kiltGeom.attributes.position;
            for (let i = 0; i < kPos.count; i++) {
                let kx = kPos.getX(i), ky = kPos.getY(i), kz = kPos.getZ(i);
                const angle = Math.atan2(kx, kz);
                const pleat = 1.0 + Math.sin(angle * 28) * 0.015;
                kx *= 1.04 * pleat;
                kz *= 0.78 * pleat;
                kPos.setXYZ(i, kx, ky, kz);
            }
            kiltGeom.computeVertexNormals();

            const kiltMat = isHorusGod ? darkGoldMat : (isSetGod ? obsidianMat : linenMat);
            const kilt = new THREE.Mesh(kiltGeom, kiltMat);
            kilt.position.y = -0.11;
            kilt.castShadow = true;
            kilt.receiveShadow = true;
            pelvis.add(kilt);

            // Gövdeye sıfır oturan Kraliyet Kemeri
            const belt = new THREE.Mesh(
                new THREE.CylinderGeometry(0.139 * muscleScale, 0.143 * muscleScale, 0.056, 40),
                isDivine ? goldMat : leatherMat
            );
            belt.scale.set(1.04, 1.0, 0.79);
            belt.position.y = 0.036;
            pelvis.add(belt);

            if (role !== 'villager') {
                const sashShape = new THREE.Shape();
                sashShape.moveTo(-0.044, 0);
                sashShape.lineTo(0.044, 0);
                sashShape.lineTo(0.034, -0.31);
                sashShape.lineTo(0, -0.36);
                sashShape.lineTo(-0.034, -0.31);
                sashShape.closePath();

                const sashGeom = new THREE.ExtrudeGeometry(sashShape, { depth: 0.012, bevelEnabled: true, bevelSize: 0.003, bevelThickness: 0.003 });
                const sash = new THREE.Mesh(sashGeom, isDivine ? goldMat : leatherMat);
                sash.position.set(0, 0.04, 0.108 * muscleScale);
                sash.rotation.x = 0.09;
                pelvis.add(sash);

                const buckleGem = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.024, 1),
                    isSetGod ? glowRedMat : glowBlueMat
                );
                buckleGem.position.set(0, 0.038, 0.120 * muscleScale);
                pelvis.add(buckleGem);
            }

            // Tanrılar İçin Eteğe Tam Oturan Katmanlı Savaş Eteği Plakaları (Tassets)
            if (isDivine) {
                const bladeShape = new THREE.Shape();
                bladeShape.moveTo(-0.036, 0);
                bladeShape.lineTo(0.036, 0);
                bladeShape.lineTo(0.025, -0.27);
                bladeShape.lineTo(0, -0.32);
                bladeShape.lineTo(-0.025, -0.27);
                bladeShape.closePath();
                const bladeGeom = new THREE.ExtrudeGeometry(bladeShape, { depth: 0.009, bevelEnabled: true, bevelSize: 0.002, bevelThickness: 0.002 });

                [-1, 1].forEach(dir => {
                    for (let p = 0; p < 5; p++) {
                        const angle = dir * (0.34 + p * 0.38);
                        const plate = new THREE.Mesh(
                            bladeGeom,
                            p % 2 === 0 ? goldMat : (isSetGod ? obsidianMat : lapisMat)
                        );
                        plate.position.set(
                            Math.sin(angle) * 0.146 * muscleScale,
                            0.025,
                            Math.cos(angle) * 0.114 * muscleScale
                        );
                        plate.rotation.y = angle;
                        plate.rotation.x = 0.14;
                        pelvis.add(plate);
                    }
                });
            }

            // 3. OMURGA, ANATOMİK GÖVDE VE GÖĞSE OTURAN MISIR YAKALIĞI / ZIRHI
            const spine = new THREE.Group();
            spine.position.y = 0.03;
            pelvis.add(spine);

            const anatomicalTorso = createAnatomicalTorso(muscleScale, torsoMat);
            spine.add(anatomicalTorso);

            // Omuz ve Göğüs Üstüne Doğal Oturan Usekh Kraliyet Yakalığı (Havada duran düz tepsi yerine omuzları saran kavisli yaka!)
            if (isHorusHuman || isArmoredGod) {
                const collarRings = isArmoredGod ? 4 : 3;
                for (let c = 0; c < collarRings; c++) {
                    const rScale = 1.0 + c * 0.16;
                    const collarRing = new THREE.Mesh(
                        new THREE.TorusGeometry(0.082 * rScale * muscleScale, 0.012, 12, 36),
                        c % 2 === 0 ? goldMat : (isSetGod ? obsidianMat : lapisMat)
                    );
                    collarRing.rotation.x = Math.PI / 2 + 0.24;
                    collarRing.scale.set(1.12, 0.78, 1.0);
                    collarRing.position.set(0, 0.605 - c * 0.022, 0.010 + c * 0.005);
                    spine.add(collarRing);
                }

                if (isHorusHuman || isSetGod) {
                    const cape = new THREE.Mesh(new THREE.BoxGeometry(0.42 * muscleScale, 0.86, 0.012), crimsonMat);
                    cape.position.set(0, 0.18, -0.118 * muscleScale);
                    cape.rotation.x = 0.09;
                    spine.add(cape);
                }
            }

            // HORUS ZIRH & SET ZIRH: VÜCUDA YAPIŞIK BİYOMEKANİK GÖĞÜS VE KARIN ZIRHI
            if (isArmoredGod) {
                const chevronShape = new THREE.Shape();
                chevronShape.moveTo(0, 0.048);
                chevronShape.lineTo(0.135 * muscleScale, 0.082);
                chevronShape.lineTo(0.118 * muscleScale, -0.022);
                chevronShape.lineTo(0, -0.055);
                chevronShape.closePath();
                const chevronGeom = new THREE.ExtrudeGeometry(chevronShape, {
                    depth: 0.018,
                    bevelEnabled: true,
                    bevelSize: 0.004,
                    bevelThickness: 0.004
                });

                [-1, 1].forEach(dir => {
                    const pecArmor = new THREE.Mesh(chevronGeom, goldMat);
                    pecArmor.scale.x = dir;
                    pecArmor.position.set(dir * 0.010, 0.445, 0.104 * muscleScale);
                    pecArmor.rotation.y = dir * 0.30;
                    pecArmor.rotation.x = -0.08;
                    spine.add(pecArmor);

                    for (let r = 0; r < 4; r++) {
                        const scaleW = 0.94 - r * 0.12;
                        const ribChevron = new THREE.Mesh(
                            chevronGeom,
                            r % 2 === 0 ? (isSetGod ? obsidianMat : lapisMat) : darkGoldMat
                        );
                        ribChevron.scale.set(dir * scaleW * 0.78, 0.48, 0.70);
                        ribChevron.position.set(
                            dir * 0.008,
                            0.348 - r * 0.062,
                            (0.098 - r * 0.004) * muscleScale
                        );
                        ribChevron.rotation.y = dir * 0.26;
                        spine.add(ribChevron);
                    }
                });

                const sternumSpine = new THREE.Mesh(new THREE.BoxGeometry(0.036, 0.32, 0.024), goldMat);
                sternumSpine.position.set(0, 0.315, 0.106 * muscleScale);
                spine.add(sternumSpine);

                const chestFrame = new THREE.Mesh(new THREE.OctahedronGeometry(0.048, 1), goldMat);
                chestFrame.scale.set(1.15, 1.15, 0.42);
                chestFrame.position.set(0, 0.455, 0.122 * muscleScale);
                spine.add(chestFrame);

                const chestCore = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.030, 1),
                    isSetGod ? glowRedMat : glowBlueMat
                );
                chestCore.position.set(0, 0.455, 0.130 * muscleScale);
                spine.add(chestCore);
            }

            // 4. KAFA / MİĞFER
            const head = createHeadAndHelmet(
                role,
                faceMat,
                limbSkinMat,
                goldMat,
                darkGoldMat,
                lapisMat,
                obsidianMat,
                crimsonMat,
                glowBlueMat,
                glowRedMat
            );
            head.position.y = 0.77;
            spine.add(head);

            // 5. GÖVDEYLE PÜRÜZSÜZ BİRLEŞEN OMUZLAR, KOLLAR VE GERÇEKÇİ ELLER
            const arms = {};
            const armProfile = [
                [0.00, 0.064 * muscleScale, 0.060 * muscleScale, 0.00],
                [0.18, 0.058 * muscleScale, 0.056 * muscleScale, 0.00],
                [0.36, 0.048 * muscleScale, 0.054 * muscleScale, 0.005],
                [0.52, 0.042 * muscleScale, 0.040 * muscleScale, 0.00],
                [0.66, 0.045 * muscleScale, 0.043 * muscleScale, 0.004],
                [0.92, 0.034, 0.030, 0.00],
                [1.00, 0.032, 0.028, 0.00]
            ];

            const pauldronShape = new THREE.Shape();
            pauldronShape.moveTo(0, 0.042);
            pauldronShape.quadraticCurveTo(0.080, 0.060, 0.125, 0.012);
            pauldronShape.lineTo(0.098, -0.042);
            pauldronShape.quadraticCurveTo(0.042, -0.022, 0, -0.032);
            pauldronShape.closePath();
            const pauldronGeom = new THREE.ExtrudeGeometry(pauldronShape, {
                depth: 0.110 * muscleScale,
                bevelEnabled: true,
                bevelSize: 0.005,
                bevelThickness: 0.005
            });
            pauldronGeom.center();

            ['left', 'right'].forEach(side => {
                const dir = side === 'left' ? -1 : 1;
                const shoulder = new THREE.Group();
                // Omuz kökü gövdeye biraz daha yakınlaştırılarak koltuk altı keskinliği tamamen giderildi
                shoulder.position.set(dir * (0.152 * muscleScale), 0.555, 0);
                spine.add(shoulder);

                // Omuz Kası (Deltoid) Yumuşak Geçiş Kubbesi
                const deltoidCap = new THREE.Mesh(
                    new THREE.SphereGeometry(0.062 * muscleScale, 18, 14),
                    limbSkinMat
                );
                deltoidCap.scale.set(1.05, 0.92, 0.95);
                deltoidCap.position.set(-dir * 0.012, -0.015, 0);
                shoulder.add(deltoidCap);

                const continuousArm = createContinuousSkinnedLimb(0.54, 0.52, armProfile, limbSkinMat, true);
                shoulder.add(continuousArm.mesh);

                if (isDivine) {
                    const pauldronGroup = new THREE.Group();
                    shoulder.add(pauldronGroup);

                    const tiers = isArmoredGod ? 3 : 2;
                    for (let p = 0; p < tiers; p++) {
                        const wingPlate = new THREE.Mesh(
                            pauldronGeom,
                            p % 2 === 0 ? goldMat : (isSetGod ? obsidianMat : lapisMat)
                        );
                        wingPlate.scale.set(dir * (1.0 - p * 0.12), 1.0 - p * 0.10, 1.0 - p * 0.08);
                        wingPlate.position.set(dir * (0.024 + p * 0.010), 0.014 - p * 0.026, 0);
                        wingPlate.rotation.z = -dir * (0.18 + p * 0.14);
                        pauldronGroup.add(wingPlate);
                    }
                }

                if (role !== 'villager') {
                    const bracer = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.044 * muscleScale, 0.035, 0.135, 18),
                        isDivine ? goldMat : leatherMat
                    );
                    bracer.position.y = -0.15;
                    continuousArm.lowerGroup.add(bracer);
                }

                // Doğal Oranlı El, Avuç İçi, Başparmak ve Kıvrımlı Parmaklar
                const hand = continuousArm.endGroup;
                const handMat = isArmoredGod ? goldMat : limbSkinMat;

                const palm = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.052, 0.044), handMat);
                palm.position.set(0, -0.026, 0.002);
                hand.add(palm);

                const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.006, 0.034, 8), handMat);
                thumb.position.set(-dir * 0.014, -0.024, 0.022);
                thumb.rotation.x = 0.45;
                thumb.rotation.z = dir * 0.35;
                hand.add(thumb);

                for (let f = 0; f < 4; f++) {
                    const finger = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.0062, 0.0052, 0.038, 8),
                        isArmoredGod ? darkGoldMat : limbSkinMat
                    );
                    finger.position.set(0, -0.058, -0.014 + f * 0.010);
                    finger.rotation.z = dir * 0.18;
                    hand.add(finger);
                }

                if (side === 'right') {
                    const weapon = createCharacterWeapon(role, goldMat, darkGoldMat, obsidianMat, lapisMat, glowBlueMat, glowRedMat);
                    weapon.position.set(0, -0.040, 0.012);
                    hand.add(weapon);
                }

                arms[side] = { shoulder, continuousArm };
            });

            // 6. KESİNTİSİZ BACAKLAR, DİZLİKLER VE SANDALETLER
            const legs = {};
            const legProfile = [
                [0.00, 0.084 * muscleScale, 0.086 * muscleScale, 0.00],
                [0.26, 0.076 * muscleScale, 0.080 * muscleScale, 0.008],
                [0.48, 0.054 * muscleScale, 0.054 * muscleScale, 0.004],
                [0.64, 0.060 * muscleScale, 0.064 * muscleScale, -0.008],
                [0.92, 0.036, 0.038, 0.00],
                [1.00, 0.033, 0.034, 0.00]
            ];

            ['left', 'right'].forEach(side => {
                const dir = side === 'left' ? -1 : 1;
                const hip = new THREE.Group();
                hip.position.set(dir * 0.086 * muscleScale, -0.04, 0);
                pelvis.add(hip);

                const continuousLeg = createContinuousSkinnedLimb(0.84, 0.50, legProfile, limbSkinMat, false);
                hip.add(continuousLeg.mesh);

                if (isDivine || role === 'bek') {
                    const greave = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.061 * muscleScale, 0.038, 0.27, 18),
                        isDivine ? goldMat : leatherMat
                    );
                    greave.position.set(0, -0.20, 0.004);
                    continuousLeg.lowerGroup.add(greave);

                    if (isDivine) {
                        const kneeGuard = new THREE.Mesh(new THREE.OctahedronGeometry(0.046 * muscleScale, 1), darkGoldMat);
                        kneeGuard.scale.set(0.78, 1.38, 0.52);
                        kneeGuard.position.set(0, -0.02, 0.052 * muscleScale);
                        continuousLeg.lowerGroup.add(kneeGuard);
                    }
                }

                const ankle = continuousLeg.endGroup;
                const foot = new THREE.Mesh(
                    new THREE.SphereGeometry(0.048, 14, 12),
                    isDivine ? goldMat : limbSkinMat
                );
                foot.scale.set(0.74, 0.45, 1.75);
                foot.position.set(0, -0.024, 0.038);
                foot.castShadow = true;
                ankle.add(foot);

                const sole = new THREE.Mesh(
                    new THREE.BoxGeometry(0.072, 0.012, 0.18),
                    isDivine ? darkGoldMat : leatherMat
                );
                sole.position.set(0, -0.046, 0.038);
                ankle.add(sole);

                legs[side] = { hip, continuousLeg, ankle };
            });

            // 7. YELPAZE KAVİSLİ BİYOMEKANİK ŞAHİN KANATLARI
            let wings = null;
            if (isArmoredGod) {
                wings = createBiomechanicalWings(
                    isSetGod,
                    goldMat,
                    darkGoldMat,
                    isSetGod ? obsidianMat : lapisMat,
                    isSetGod ? glowRedMat : glowBlueMat
                );
                spine.add(wings);
            }

            return {
                name,
                role,
                scale,
                root,
                pelvis,
                spine,
                head,
                arms,
                legs,
                wings,
                elbowL: -0.18,
                elbowR: -0.22,
                kneeL: 0.04,
                kneeR: 0.04,
                phase: Math.random() * Math.PI * 2,
                aiTarget: new THREE.Vector3(),
                aiTimer: Math.random() * 3
            };
        }

        // ==========================================
        // 8. DOĞAL YÜRÜME (GAIT), NEFES ALMA VE SAVAŞ/KANAT POZU ANİMASYONU
        // ==========================================
        function animateCharacter(char, isWalking, speedRatio, delta, elapsed, isSelected) {
            const { pelvis, spine, head, arms, legs, wings } = char;
            const poseBoost = isSelected && heroicPoseActive;

            if (isWalking) {
                char.phase += delta * 7.2 * Math.max(0.55, speedRatio);
                const p = char.phase;

                pelvis.position.y = 0.94 - Math.abs(Math.cos(p)) * 0.026;
                pelvis.rotation.z = Math.sin(p) * 0.04;
                pelvis.rotation.y = -Math.sin(p) * 0.08;

                spine.rotation.y = Math.sin(p) * 0.10;
                spine.rotation.x = 0.045 * speedRatio;
                spine.rotation.z = -Math.sin(p) * 0.028;

                head.rotation.y = -spine.rotation.y * 0.75;
                head.rotation.x = -0.02 + Math.cos(p * 2) * 0.015;

                const lHip = Math.sin(p) * 0.52 * speedRatio;
                const rHip = Math.sin(p + Math.PI) * 0.52 * speedRatio;
                legs.left.hip.rotation.x = lHip;
                legs.right.hip.rotation.x = rHip;

                char.kneeL = Math.max(0.03, -Math.cos(p - 0.3) * 0.78 * speedRatio + 0.05);
                char.kneeR = Math.max(0.03, -Math.cos(p + Math.PI - 0.3) * 0.78 * speedRatio + 0.05);
                legs.left.continuousLeg.updateBend(char.kneeL);
                legs.right.continuousLeg.updateBend(char.kneeR);

                const lArm = Math.sin(p + Math.PI) * 0.42 * speedRatio;
                const rArm = Math.sin(p) * 0.42 * speedRatio;

                arms.left.shoulder.rotation.x = lArm;
                arms.left.shoulder.rotation.z = -0.09;
                char.elbowL = -0.22 - Math.max(0, -lArm) * 0.42;
                arms.left.continuousArm.updateBend(char.elbowL);

                arms.right.shoulder.rotation.x = rArm;
                arms.right.shoulder.rotation.z = 0.09;
                char.elbowR = -0.26 - Math.max(0, -rArm) * 0.42;
                arms.right.continuousArm.updateBend(char.elbowR);
            } else {
                const breath = Math.sin(elapsed * 2.1 + char.phase);
                const sway = Math.sin(elapsed * 0.65 + char.phase);

                pelvis.position.y = THREE.MathUtils.lerp(pelvis.position.y, 0.94 + breath * 0.005, 0.12);
                pelvis.rotation.z = THREE.MathUtils.lerp(pelvis.rotation.z, sway * 0.016, 0.08);
                pelvis.rotation.y = THREE.MathUtils.lerp(pelvis.rotation.y, sway * 0.03, 0.08);

                spine.rotation.x = THREE.MathUtils.lerp(spine.rotation.x, (poseBoost ? -0.06 : 0) + breath * 0.02, 0.1);
                spine.rotation.y = THREE.MathUtils.lerp(spine.rotation.y, -sway * 0.035, 0.08);
                spine.rotation.z = THREE.MathUtils.lerp(spine.rotation.z, 0, 0.1);

                head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, sway * 0.10, 0.08);
                head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, -breath * 0.015, 0.08);

                legs.left.hip.rotation.x = THREE.MathUtils.lerp(legs.left.hip.rotation.x, -0.03, 0.12);
                legs.right.hip.rotation.x = THREE.MathUtils.lerp(legs.right.hip.rotation.x, 0.03, 0.12);

                char.kneeL = THREE.MathUtils.lerp(char.kneeL, 0.05, 0.12);
                char.kneeR = THREE.MathUtils.lerp(char.kneeR, 0.05, 0.12);
                legs.left.continuousLeg.updateBend(char.kneeL);
                legs.right.continuousLeg.updateBend(char.kneeR);

                const targetRightArmX = poseBoost ? -0.68 : -0.06;
                const targetRightArmZ = poseBoost ? 0.36 : 0.09 + breath * 0.015;
                const targetRightElbow = poseBoost ? -0.62 : -0.26;

                const targetLeftArmX = poseBoost ? -0.28 : 0.02;
                const targetLeftArmZ = poseBoost ? -0.32 : -0.09 - breath * 0.015;

                arms.left.shoulder.rotation.x = THREE.MathUtils.lerp(arms.left.shoulder.rotation.x, targetLeftArmX, 0.12);
                arms.left.shoulder.rotation.z = THREE.MathUtils.lerp(arms.left.shoulder.rotation.z, targetLeftArmZ, 0.12);
                char.elbowL = THREE.MathUtils.lerp(char.elbowL, -0.20, 0.12);
                arms.left.continuousArm.updateBend(char.elbowL);

                arms.right.shoulder.rotation.x = THREE.MathUtils.lerp(arms.right.shoulder.rotation.x, targetRightArmX, 0.12);
                arms.right.shoulder.rotation.z = THREE.MathUtils.lerp(arms.right.shoulder.rotation.z, targetRightArmZ, 0.12);
                char.elbowR = THREE.MathUtils.lerp(char.elbowR, targetRightElbow, 0.12);
                arms.right.continuousArm.updateBend(char.elbowR);
            }

            if (wings) {
                const flapSpeed = isWalking ? 3.8 : (poseBoost ? 2.8 : 1.5);
                const flap = Math.sin(elapsed * flapSpeed) * (poseBoost ? 0.22 : 0.09);
                const spreadZ = poseBoost ? 0.34 : 0.06;
                const outerSpreadZ = poseBoost ? 0.28 : -0.08;

                wings.leftInner.rotation.y = THREE.MathUtils.lerp(wings.leftInner.rotation.y, -0.16 - flap, 0.1);
                wings.rightInner.rotation.y = THREE.MathUtils.lerp(wings.rightInner.rotation.y, 0.16 + flap, 0.1);

                wings.leftInner.rotation.z = THREE.MathUtils.lerp(wings.leftInner.rotation.z, -spreadZ, 0.1);
                wings.rightInner.rotation.z = THREE.MathUtils.lerp(wings.rightInner.rotation.z, spreadZ, 0.1);

                wings.leftOuter.rotation.z = THREE.MathUtils.lerp(wings.leftOuter.rotation.z, -outerSpreadZ, 0.1);
                wings.rightOuter.rotation.z = THREE.MathUtils.lerp(wings.rightOuter.rotation.z, outerSpreadZ, 0.1);
            }
        }

        // ==========================================
        // 9. SAHNE, SİNEMATİK IŞIKLANDIRMA VE ALTIN PARÇACIKLAR
        // ==========================================
        function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.00;

            window.textures = buildTextures(renderer);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x241509);
            scene.environment = window.textures.envMap;
            scene.fog = new THREE.FogExp2(0x241509, 0.0035);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.15, 1400);
            clock = new THREE.Clock();

            const skyGeo = new THREE.SphereGeometry(900, 32, 24);
            const skyMat = new THREE.MeshBasicMaterial({
                map: (() => {

                    const ctx = c.getContext('2d');
                    const g = ctx.createLinearGradient(0, 0, 0, 256);
                    g.addColorStop(0.0, '#0f172a');
                    g.addColorStop(0.45, '#92400e');
                    g.addColorStop(0.75, '#d97706');
                    g.addColorStop(1.0, '#271104');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, 0, 512, 256);
                    return new THREE.CanvasTexture(c);
                })(),
                side: THREE.BackSide,
                depthWrite: false
            });
            scene.add(new THREE.Mesh(skyGeo, skyMat));

            const hemi = new THREE.HemisphereLight(0xffedd5, 0x451a03, 0.72);
            scene.add(hemi);

            const sun = new THREE.DirectionalLight(0xfff7ed, 1.42);
            sun.position.set(14, 28, 22);
            sun.castShadow = true;
            sun.shadow.mapSize.set(2048, 2048);
            const d = 22;
            sun.shadow.camera.left = -d;
            sun.shadow.camera.right = d;
            sun.shadow.camera.top = d;
            sun.shadow.camera.bottom = -d;
            sun.shadow.bias = -0.0005;
            scene.add(sun);

            const rimLight = new THREE.DirectionalLight(0xfbbf24, 1.0);
            rimLight.position.set(-16, 15, -18);
            scene.add(rimLight);

            frontKeyLight = new THREE.PointLight(0xffedd5, 0.50, 22);
            scene.add(frontKeyLight);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(240, 240),
                new THREE.MeshStandardMaterial({
                    map: window.textures.floorTex,
                    roughness: 0.72,
                    metalness: 0.08
                })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const partCount = 160;
            const partGeo = new THREE.BufferGeometry();
            const partPos = new Float32Array(partCount * 3);
            for (let i = 0; i < partCount; i++) {
                partPos[i * 3] = (Math.random() - 0.5) * 28;
                partPos[i * 3 + 1] = Math.random() * 8 + 0.3;
                partPos[i * 3 + 2] = (Math.random() - 0.5) * 28;
            }
            partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
            divineParticles = new THREE.Points(
                partGeo,
                new THREE.PointsMaterial({ color: 0xfde047, size: 0.09, transparent: true, opacity: 0.75 })
            );
            scene.add(divineParticles);

            const roster = [
                { name: 'Ölümlü Bek', role: 'bek', scale: 1.0, pos: [0, 0] },
                { name: 'Mısırlı Köylü', role: 'villager', scale: 0.97, pos: [-5.5, -2.5] },
                { name: 'İnsan Horus', role: 'horus_human', scale: 1.55, pos: [5.5, -2.5] },
                { name: 'Horus (Altın Şahin)', role: 'horus_god', scale: 1.95, pos: [-11.5, -6.0] },
                { name: 'Set (Kaos Zırhı)', role: 'set_god', scale: 2.02, pos: [11.5, -6.0] }
            ];

            roster.forEach(cfg => {
                const c = createCharacter(cfg);
                c.root.position.set(cfg.pos[0], 0, cfg.pos[1]);
                scene.add(c.root);
                characters.push(c);
            });

            for (let i = 0; i < 4; i++) {
                const ang = (i / 4) * Math.PI * 2 + 0.6;
                const rad = 16.5;
                const npc = createCharacter({
                    name: `Köylü #${i + 2}`,
                    role: 'villager',
                    scale: 0.96 + (i % 2) * 0.03
                });
                npc.root.position.set(Math.cos(ang) * rad, 0, Math.sin(ang) * rad);
                npc.aiTarget.set(Math.cos(ang + 1.3) * rad, 0, Math.sin(ang + 1.3) * rad);
                scene.add(npc.root);
                characters.push(npc);
            }

            bindInputEvents();
            window.addEventListener('resize', onResize);

            window.scene = scene;
            window.camera = camera;
            window.characters = characters;
            window.activeIndex = activeIndex;
            window.player = characters[activeIndex];

            if (window.EgyptFlightEngine) {
                window.EgyptFlightEngine.spawnRaSolarBarque(scene);
                window.EgyptFlightEngine.initTrailParticles(scene);
            }

            // Kayıtlı Karakter Rolünü Seç ve Aktif Yap
            if (window.GameState && window.GameState.state) {
                const curRole = window.GameState.state.player.role;
                if (curRole === 'god_set' || curRole === 'set_god' || curRole === 'set') selectCharacter(4);
                else if (curRole === 'god_horus' || curRole === 'horus_god' || curRole === 'horus') selectCharacter(3);
                else if (curRole === 'horus_human') selectCharacter(2);
                else if (curRole === 'villager') selectCharacter(1);
                else selectCharacter(0);
            }

            animate();
        }

        // ==========================================
        // 10. MOBİL JOYSTICK, 360° KAMERA VE POZ KONTROLLERİ
        // ==========================================
        function bindInputEvents() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const maxR = 40;

            function moveJoy(cx, cy) {
                const rect = zone.getBoundingClientRect();
                let dx = cx - (rect.left + rect.width / 2);
                let dy = cy - (rect.top + rect.height / 2);
                const d = Math.hypot(dx, dy);
                if (d > maxR) {
                    dx = (dx / d) * maxR;
                    dy = (dy / d) * maxR;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyVec.x = dx / maxR;
                joyVec.y = dy / maxR;
            }

            zone.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                joyActive = true;
                joyPointerId = e.pointerId;
                moveJoy(e.clientX, e.clientY);
            });

            const canvas = renderer.domElement;
            canvas.style.touchAction = 'none';
            canvas.addEventListener('pointerdown', (e) => {
                canvas.setPointerCapture(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (joyActive && e.pointerId === joyPointerId) {
                    moveJoy(e.clientX, e.clientY);
                    return;
                }
                if (!activePointers.has(e.pointerId)) return;

                const prev = activePointers.get(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 1) {
                    const dx = e.clientX - prev.x;
                    const dy = e.clientY - prev.y;
                    camYaw -= dx * 0.0085;
                    camPitch = Math.max(-1.35, Math.min(1.35, camPitch + dy * 0.0065));
                } else if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinchDist > 0) {
                        const diff = lastPinchDist - dist;
                        desiredDist = Math.max(1.1, Math.min(14.0, desiredDist + diff * 0.018));
                    }
                    lastPinchDist = dist;
                }
            });

            function clearPointer(e) {
                if (joyActive && e.pointerId === joyPointerId) {
                    joyActive = false;
                    joyPointerId = null;
                    joyVec.x = 0;
                    joyVec.y = 0;
                    knob.style.transform = 'translate(0px, 0px)';
                }
                activePointers.delete(e.pointerId);
                if (activePointers.size < 2) lastPinchDist = 0;
            }

            window.addEventListener('pointerup', clearPointer);
            window.addEventListener('pointercancel', clearPointer);

            window.addEventListener('wheel', (e) => {
                desiredDist = Math.max(1.1, Math.min(14.0, desiredDist + e.deltaY * 0.004));
            });

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (k === 's' || e.key === 'ArrowDown') keys.s = true;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (k === 's' || e.key === 'ArrowDown') keys.s = false;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
            });
        }

        function selectCharacter(idx) {
            activeIndex = idx;
            window.activeIndex = idx;
            if (characters[idx]) window.player = characters[idx];
            for (let i = 0; i < 5; i++) {
                const el = document.getElementById(`pill-${i}`);
                if (el) el.classList.toggle('active', i === idx);
            }
            if (window.GameState) {
                const roleMap = ['bek', 'villager', 'horus_human', 'horus_god', 'set_god'];
                window.GameState.setCharacterRole(roleMap[idx]);
                if (window.GameHUD && characters[idx]) {
                    window.GameHUD.showToast(`Form Seçildi: ${characters[idx].name}!`, 'gold');
                }
            }
            resetCameraView();
        }

        function toggleWingsPose() {
            heroicPoseActive = !heroicPoseActive;
            const btn = document.getElementById('btn-wings');
            if (btn) {
                btn.classList.toggle('bg-amber-500/30', heroicPoseActive);
                btn.classList.toggle('border-yellow-300', heroicPoseActive);
            }
        }

        function resetCameraView() {
            const c = characters[activeIndex];
            desiredTargetY = 1.05 * c.scale;
            desiredDist = 3.45 * c.scale;
            camPitch = 0.03;
        }

        function focusFace() {
            const c = characters[activeIndex];
            desiredTargetY = 1.62 * c.scale;
            desiredDist = 1.25 * c.scale;
            camYaw = c.root.rotation.y + 0.06;
            camPitch = 0.01;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // 11. ANA OYUN VE ANİMASYON DÖNGÜSÜ
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            const player = characters[activeIndex];

            let ix = joyVec.x;
            let iy = joyVec.y;
            if (keys.w) iy = -1;
            if (keys.s) iy = 1;
            if (keys.a) ix = -1;
            if (keys.d) ix = 1;

            const mag = Math.min(1, Math.hypot(ix, iy));
            const isFlying = window.EgyptFlightEngine && window.EgyptFlightEngine.isFlying;

            if (!isFlying) {
                if (moving) {
                    const fwdX = -Math.sin(camYaw);
                    const fwdZ = -Math.cos(camYaw);
                    const rightX = Math.cos(camYaw);
                    const rightZ = -Math.sin(camYaw);

                    const dirX = rightX * ix + fwdX * (-iy);
                    const dirZ = rightZ * ix + fwdZ * (-iy);

                    const speed = (2.4 + player.scale * 0.65) * mag;
                    player.root.position.x += dirX * speed * delta;
                    player.root.position.z += dirZ * speed * delta;

                    const targetRot = Math.atan2(dirX, dirZ);
                    let diff = targetRot - player.root.rotation.y;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    player.root.rotation.y += diff * 0.18;
                }

                animateCharacter(player, moving, mag, delta, elapsed, true);
            }

            characters.forEach((c, idx) => {
                if (idx === activeIndex) return;

                if (idx >= 5) {
                    if (c.aiTimer > 0) {
                        c.aiTimer -= delta;
                        animateCharacter(c, false, 0, delta, elapsed, false);
                    } else {
                        const dx = c.aiTarget.x - c.root.position.x;
                        const dz = c.aiTarget.z - c.root.position.z;
                        const dist = Math.hypot(dx, dz);

                        if (dist < 0.35) {
                            c.aiTimer = 2.5 + Math.random() * 3.5;
                            const a = Math.random() * Math.PI * 2;
                            const r = 14.0 + Math.random() * 5.0;
                            c.aiTarget.set(Math.cos(a) * r, 0, Math.sin(a) * r);
                            animateCharacter(c, false, 0, delta, elapsed, false);
                        } else {
                            const spd = 1.65;
                            c.root.position.x += (dx / dist) * spd * delta;
                            c.root.position.z += (dz / dist) * spd * delta;

                            const tRot = Math.atan2(dx, dz);
                            let dRot = tRot - c.root.rotation.y;
                            while (dRot > Math.PI) dRot -= Math.PI * 2;
                            while (dRot < -Math.PI) dRot += Math.PI * 2;
                            c.root.rotation.y += dRot * 0.12;

                            animateCharacter(c, true, 0.72, delta, elapsed, false);
                        }
                    }
                } else {
                    animateCharacter(c, false, 0, delta, elapsed, false);
                }
            });

            if (divineParticles) {
                divineParticles.rotation.y = elapsed * 0.05;
                divineParticles.position.y = Math.sin(elapsed * 0.8) * 0.25;
            }

            if (window.EgyptFlightEngine && player) {
                window.EgyptFlightEngine.update(player, delta, elapsed, camera);
            }

            if (window.EgyptCinematicStudio && window.EgyptCinematicStudio.isActive()) {
                window.EgyptCinematicStudio.update(camera, player, delta, elapsed);
            } else {
                camTargetY = THREE.MathUtils.lerp(camTargetY, desiredTargetY, 0.12);
                camDist = THREE.MathUtils.lerp(camDist, desiredDist, 0.12);

                const cx = player.root.position.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist;
                const cz = player.root.position.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist;
                const cy = player.root.position.y + camTargetY + Math.sin(camPitch) * camDist * 0.85;

                camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.24);
                camera.lookAt(player.root.position.x, player.root.position.y + camTargetY, player.root.position.z);
            }

            if (frontKeyLight) {
                frontKeyLight.position.set(camera.position.x, camera.position.y + 0.8, camera.position.z);
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
