        // ============================================================================
        // 5. MOBİL DOKUNMATİK KONTROLLER (JOYSTICK, 360° KAMERA VE KUŞBAKIŞI UZAKLAŞTIRMA)
        // ============================================================================
        function bindDuatControls() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const maxR = 40;

            function updateJoy(cx, cy) {
                const rect = zone.getBoundingClientRect();
                let dx = cx - (rect.left + rect.width / 2);
                let dy = cy - (rect.top + rect.height / 2);
                const dist = Math.hypot(dx, dy);
                if (dist > maxR) {
                    dx = (dx / dist) * maxR;
                    dy = (dy / dist) * maxR;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyVec.x = dx / maxR;
                joyVec.y = dy / maxR;
            }

            zone.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                joyActive = true;
                joyPointerId = e.pointerId;
                updateJoy(e.clientX, e.clientY);
            });

            const canvas = renderer.domElement;
            canvas.style.touchAction = 'none';
            canvas.addEventListener('pointerdown', (e) => {
                canvas.setPointerCapture(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (joyActive && e.pointerId === joyPointerId) {
                    updateJoy(e.clientX, e.clientY);
                    return;
                }
                if (!activePointers.has(e.pointerId)) return;

                const prev = activePointers.get(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 1) {
                    camYaw -= (e.clientX - prev.x) * 0.008;
                    const isFpv = window.EgyptCameraSystem && window.EgyptCameraSystem.isFirstPerson;
                    if (isFpv) {
                        camPitch = Math.max(-1.42, Math.min(1.42, camPitch - (e.clientY - prev.y) * 0.0075));
                    } else {
                        camPitch = Math.max(0.04, Math.min(1.38, camPitch + (e.clientY - prev.y) * 0.0065));
                    }
                } else if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinchDist > 0) {
                        desiredDist = Math.max(2.2, Math.min(280.0, desiredDist + (lastPinchDist - dist) * 0.18));
                    }
                    lastPinchDist = dist;
                }
            });

            function endPointer(e) {
                if (joyActive && e.pointerId === joyPointerId) {
                    joyActive = false;
                    joyPointerId = null;
                    joyVec.x = 0;
                    joyVec.y = 0;
                    knob.style.transform = 'translate(0px, 0px)';
                }
                activePointers.delete(e.pointerId);
                if (activePointers.size < 2) lastPinchDist = 0;
            }

            window.addEventListener('pointerup', endPointer);
            window.addEventListener('pointercancel', endPointer);

            window.addEventListener('wheel', (e) => {
                desiredDist = Math.max(2.2, Math.min(280.0, desiredDist + e.deltaY * 0.07));
            });

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (k === 's' || e.key === 'ArrowDown') keys.s = true;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (k === 's' || e.key === 'ArrowDown') keys.s = false;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================================================
        // 6. CANLI DUAT ANİMASYON DÖNGÜSÜ (60 FPS OPTİMİZASYONLU)
        // ============================================================================
        const animDummy = new THREE.Object3D();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            let ix = joyVec.x;
            let iy = joyVec.y;
            if (keys.w) iy = -1;
            if (keys.s) iy = 1;
            if (keys.a) ix = -1;
            if (keys.d) ix = 1;

            const mag = Math.min(1, Math.hypot(ix, iy));
            const moving = mag > 0.05;

            if (moving && player) {
                const fwdX = -Math.sin(camYaw);
                const fwdZ = -Math.cos(camYaw);
                const rightX = Math.cos(camYaw);
                const rightZ = -Math.sin(camYaw);

                const dirX = rightX * ix + fwdX * (-iy);
                const dirZ = rightZ * ix + fwdZ * (-iy);

                const walkSpeed = 8.4 * mag;
                let nextX = player.root.position.x + dirX * walkSpeed * delta;
                let nextZ = Math.max(-208, Math.min(175, player.root.position.z + dirZ * walkSpeed * delta));

                const inCourtZ = nextZ < -50 && nextZ > -140;
                const maxAllowedX = inCourtZ ? 44.0 : 9.8;
                // Hakikatler Salonu Sütunları ve Anubis Heykelleriyle Çarpışma
                if (window.EgyptCollisionEngine) {
                    const resolved = window.EgyptCollisionEngine.resolvePosition(
                        player.root.position,
                        { x: nextX, z: nextZ },
                        (player.scale || 1) * 0.45,
                        player.root.position.y
                    );
                    player.root.position.x = resolved.x;
                    player.root.position.z = resolved.z;
                } else {
                    player.root.position.x = nextX;
                    player.root.position.z = nextZ;
                }

                const targetRot = Math.atan2(dirX, dirZ);
                let diff = targetRot - player.root.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                player.root.rotation.y += diff * 0.18;
            }

            // Yerçekimi, Zıplama ve Manyetik Altın Eşyaları Güncelle
            if (player && window.EgyptCollisionEngine) {
                window.EgyptCollisionEngine.updatePhysics(player, delta);
                window.EgyptCollisionEngine.updateMagneticDrops(player.root.position, delta, elapsed);
            }

            // Savaş Efektleri & Hasar Yazılarını Güncelle
            if (window.EgyptCombatEngine) {
                window.EgyptCombatEngine.update(delta, camera);
            }

            if (player) {
                if (window.EgyptCharacterEngine && window.EgyptCharacterEngine.animateEgyptCharacter) {
                    window.EgyptCharacterEngine.animateEgyptCharacter(player, moving, mag, delta, elapsed);
                } else {
                    animateVillagerOrDuat(player, moving, mag, delta, elapsed);
                }
            }

            const pz = player ? player.root.position.z : 0;
            for (let i = 0; i < soulsAndGuards.length; i++) {
                const ch = soulsAndGuards[i];
                if (ch.role === 'soul') {
                    ch.root.position.z -= ch.speed * delta;
                    if (ch.root.position.z < -205) {
                        ch.root.position.z = 165;
                    }
                    if (Math.abs(ch.root.position.z - pz) < 95) {
                        animateCharacter(ch, true, 0.72, delta, elapsed);
                    }
                } else {
                    if (Math.abs(ch.root.position.z - pz) < 95) {
                        animateCharacter(ch, false, 0, delta, elapsed);
                    }
                }
            }

            if (scaleBeamGroup && leftPanGroup && rightPanGroup) {
                const tilt = Math.sin(elapsed * 1.15) * 0.14;
                scaleBeamGroup.rotation.z = tilt;
                leftPanGroup.rotation.z = -tilt;
                rightPanGroup.rotation.z = -tilt;
            }
            if (heartMesh) {
                const beat = 1.0 + Math.pow(Math.sin(elapsed * 4.2), 4) * 0.22;
                heartMesh.scale.set(beat, beat, beat);
            }
            if (featherGroup) {
                featherGroup.rotation.y = Math.sin(elapsed * 1.4) * 0.25;
            }

            if (ammitMonster && ammitMonster.userData) {
                const ud = ammitMonster.userData;
                ud.headPivot.rotation.y = Math.sin(elapsed * 1.3) * 0.20;
                ud.headPivot.rotation.x = Math.sin(elapsed * 2.1) * 0.08;
                ud.lowerJaw.rotation.x = Math.max(0, Math.sin(elapsed * 3.4) * 0.46);
                ud.tailPivot.rotation.y = Math.sin(elapsed * 2.8) * 0.30;
            }

            if (soulRiverTex) {
                soulRiverTex.offset.y = -elapsed * 0.10;
            }
            if (riverPosAttr) {
                for (let i = 0; i < riverPosAttr.count; i++) {
                    const wx = riverPosAttr.getX(i);
                    const wy = riverPosAttr.getY(i);
                    const waveZ = Math.sin(wx * 0.14 + elapsed * 1.8) * 0.32 + Math.cos(wy * 0.08 + elapsed * 1.5) * 0.25;
                    riverPosAttr.setZ(i, waveZ);
                }
                riverPosAttr.needsUpdate = true;
            }
            if (lavaPosAttr) {
                for (let i = 0; i < lavaPosAttr.count; i++) {
                    const lx = lavaPosAttr.getX(i);
                    const ly = lavaPosAttr.getY(i);
                    lavaPosAttr.setZ(i, Math.sin(lx * 0.8 + elapsed * 3.5) * Math.cos(ly * 0.8 + elapsed * 3.0) * 0.18);
                }
                lavaPosAttr.needsUpdate = true;
            }

            if (soulWispPoints && soulWispPositions) {
                const posArr = soulWispPoints.geometry.attributes.position.array;
                for (let i = 0; i < soulWispSpeeds.length; i++) {
                    posArr[i * 3 + 2] -= soulWispSpeeds[i] * delta;
                    posArr[i * 3 + 1] += Math.sin(elapsed * 2.0 + i) * 0.015;
                    if (posArr[i * 3 + 2] < -300) {
                        posArr[i * 3 + 2] = 220;
                    }
                }
                soulWispPoints.geometry.attributes.position.needsUpdate = true;
            }

            for (let i = 0; i < soulBarges.length; i++) {
                const b = soulBarges[i];
                let bz = ((b.baseZ - elapsed * b.speed + 260) % 480);
                if (bz < 0) bz += 480;
                b.group.position.z = bz - 260;
                b.group.position.y = -8.3 + Math.sin(elapsed * 2.0 + b.phase) * 0.18;
                b.group.rotation.z = Math.sin(elapsed * 1.5 + b.phase) * 0.04;
            }

            if (soulFlameInst) {
                for (let i = 0; i < soulFlameData.length; i++) {
                    const f = soulFlameData[i];
                    const s = f.scale * (0.85 + Math.sin(elapsed * 10.0 + f.phase) * 0.18);
                    animDummy.position.set(f.x, f.y + 2.1 * f.scale, f.z);
                    animDummy.rotation.set(0, elapsed * 3.2 + f.phase, 0);
                    animDummy.scale.set(s, s * 1.4, s);
                    animDummy.updateMatrix();
                    soulFlameInst.setMatrixAt(i, animDummy.matrix);
                }
                soulFlameInst.instanceMatrix.needsUpdate = true;
            }
            if (hellFlameInst) {
                for (let i = 0; i < hellFlameData.length; i++) {
                    const f = hellFlameData[i];
                    const s = f.scale * (0.85 + Math.cos(elapsed * 11.0 + f.phase) * 0.20);
                    animDummy.position.set(f.x, f.y + 2.1 * f.scale, f.z);
                    animDummy.rotation.set(0, -elapsed * 3.5 + f.phase, 0);
                    animDummy.scale.set(s, s * 1.45, s);
                    animDummy.updateMatrix();
                    hellFlameInst.setMatrixAt(i, animDummy.matrix);
                }
                hellFlameInst.instanceMatrix.needsUpdate = true;
            }
            for (let i = 0; i < portalRings.length; i++) {
                const r = portalRings[i];
                r.mesh.rotation.z = elapsed * r.speed;
                r.mesh.rotation.x = Math.sin(elapsed * 0.7 + i) * 0.25;
            }

            // 3D Diriliş Kapısı Dönüşü ve Yakınlık Kontrolü
            if (window.duatResurrectionPortal) {
                window.duatResurrectionPortal.cyl.rotation.y += delta * 1.2;
                if (player) {
                    const dist = Math.hypot(player.root.position.x, player.root.position.z - (-98.0));
                    if (dist < 3.0) {
                        if (!window.teleportingActive) {
                            window.teleportingActive = true;
                            if (window.GameHUD) window.GameHUD.showToast('Ebedi Kapıdan Geçildi! Nil Dünyasına Diriliyorsun...', 'gold');
                            setTimeout(() => {
                                window.GameState.resurrectPlayer('Ebedi kapıdan geçerek dünyaya dirildin.');
                            }, 600);
                        }
                    }
                }
            }

            // MMORPG Hasat, Madencilik ve Otomatik Görev Motoru
            if (window.EgyptGatheringEngine && player) {
                window.EgyptGatheringEngine.update(player, delta, elapsed);
            }

            // Evrensel 1. Şahıs / 3. Şahıs Kamera Motoru
            if (window.EgyptCameraSystem && player) {
                window.EgyptCameraSystem.camYaw = camYaw;
                window.EgyptCameraSystem.camPitch = camPitch;
                window.EgyptCameraSystem.camDist = camDist;
                window.EgyptCameraSystem.desiredDist = desiredDist;
                window.EgyptCameraSystem.updateCamera(camera, player, moving, mag, delta, elapsed);
            } else if (player) {
                camDist = THREE.MathUtils.lerp(camDist, desiredDist, 0.12);
                const focusX = player.root.position.x;
                const focusY = player.root.position.y + 1.25;
                const focusZ = player.root.position.z;

                const cx = focusX + Math.sin(camYaw) * Math.cos(camPitch) * camDist;
                const cz = focusZ + Math.cos(camYaw) * Math.cos(camPitch) * camDist;
                const cy = Math.max(0.5, focusY + Math.sin(camPitch) * camDist);

                camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.22);
                camera.lookAt(focusX, focusY, focusZ);
            }

            renderer.render(scene, camera);
        }

        function animateVillagerOrDuat(char, moving, mag, delta, elapsed) {
            animateCharacter(char, moving, mag, delta, elapsed);
        }

        window.onload = init;
    </script>
</body>
