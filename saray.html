<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gods of Egypt - Kraliyet Sarayı İçi, Taht Salonu ve Avlusu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="gameHud.css">
    <script src="errorHandler.js"></script>
    <script src="loadingScreen.js"></script>
    <script src="svg-icons.js"></script>
    <script src="gameState.js"></script>
    <script src="gameAudio.js"></script>
    <script src="tutorialSystem.js"></script>
    <script src="npcSystem.js"></script>
    <script src="gameHud.js"></script>
    <script src="egyptCharacterEngine.js"></script>
    <script src="collisionSystem.js"></script>
    <script src="combatSystem.js"></script>
    <script src="cameraSystem.js"></script>
    <script src="mmoGatheringSystem.js"></script>
    <script src="cinematicStudio.js"></script>
    <script src="flightSystem.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #120904;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            width: 100vw;
            min-height: 100dvh;
            max-width: 100vw;
            overscroll-behavior: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100dvh;
            max-width: 100vw;
            max-height: 100dvh;
        }
        .joy-glass {
            background: rgba(18, 10, 5, 0.76);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(251, 191, 36, 0.58);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.88), 0 0 24px rgba(245, 158, 11, 0.28);
        }
        .cam-btn {
            background: linear-gradient(135deg, rgba(28, 14, 6, 0.88), rgba(68, 34, 10, 0.88));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(251, 191, 36, 0.75);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.85), 0 0 18px rgba(245, 158, 11, 0.35);
            transition: all 0.2s ease;
        }
        .cam-btn:active {
            transform: scale(0.94);
        }
    </style>
</head>
<body class="overflow-hidden">

    <!-- MOBİL YÜRÜME JOYSTICK -->
    <div id="joystick-zone" class="fixed bottom-6 left-6 w-32 h-32 joy-glass rounded-full flex items-center justify-center z-20 touch-none">
        <div class="w-20 h-20 rounded-full border border-amber-400/30 pointer-events-none"></div>
        <div id="joystick-knob" class="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-700 via-amber-400 to-yellow-200 border-2 border-white/90 shadow-xl absolute pointer-events-none transition-transform duration-75"></div>
    </div>

    <!-- 1. ŞAHIS (FIRST-PERSON / KARAKTERİN GÖZÜNDEN) VE 3. ŞAHIS KAMERA GEÇİŞ BUTONU -->
    <button id="fpv-toggle-btn" class="fixed bottom-8 right-6 z-20 cam-btn text-amber-200 font-bold text-xs sm:text-sm px-4 py-3 rounded-2xl flex items-center gap-2.5 select-none">
        <span id="fpv-icon" class="text-lg">👁️</span>
        <span id="fpv-label">1. ŞAHIS (GÖZÜNDEN)</span>
    </button>

    <script>
        let scene, camera, renderer, clock;
        let player = null;
        let palaceNPCs = [];

        // Saray İçi ve Dışı Dinamik Nesneleri
        let palaceRoofGroup = null;
        let roofFadeMaterials = [];
        let waterShaderUniforms = null;
        let waterfallShaderUniforms = null;
        let astrolabeRings = [];
        let silkCurtains = [];
        let royalBanners = [];
        let chandelierPendulums = [];
        let hologramPyramidGroup = null;
        let palaceFlameInst = null;
        let palaceFlameData = [];
        let dustParticles = null;
        let wallColliders = [];

        // Mobil Kontroller, 1. Şahıs (First-Person) ve 3. Şahıs 360° Kamera
        let joyActive = false;
        let joyPointerId = null;
        let joyVec = { x: 0, y: 0 };
        const keys = { w: false, a: false, s: false, d: false };

        let isFirstPerson = false;
        let camYaw = 0.0;
        let camPitch = 0.14;
        let camDist = 9.5;
        let desiredDist = 9.5;
        let headBobTimer = 0.0;
        const activePointers = new Map();
        let lastPinchDist = 0;

        // ============================================================================
        // 1. KRALİYET SARAYI PBR DOKULARI (GERÇEK KUMTAŞI RÖLYEF, DİKEY OLUKLU LAPİS, ALTIN MERMER)
        // ============================================================================
        function buildPalaceTextures(rendererInstance) {
            // 1. Sıcak 24K Altın & Kehribar Saray Yansıma Haritası
            const envC = document.createElement('canvas');
            envC.width = 512; envC.height = 256;
            const eCtx = envC.getContext('2d');
            const skyGrad = eCtx.createLinearGradient(0, 0, 0, 256);
            skyGrad.addColorStop(0.0, '#140904');
            skyGrad.addColorStop(0.28, '#4a2208');
            skyGrad.addColorStop(0.48, '#d97706');
            skyGrad.addColorStop(0.54, '#fef3c7');
            skyGrad.addColorStop(0.68, '#92400e');
            skyGrad.addColorStop(1.0, '#120803');
            eCtx.fillStyle = skyGrad;
            eCtx.fillRect(0, 0, 512, 256);

            const rawEnv = new THREE.CanvasTexture(envC);
            rawEnv.mapping = THREE.EquirectangularReflectionMapping;
            let envMap = rawEnv;
            try {
                const pmrem = new THREE.PMREMGenerator(rendererInstance);
                pmrem.compileEquirectangularShader();
                envMap = pmrem.fromEquirectangular(rawEnv).texture;
                rawEnv.dispose();
                pmrem.dispose();
            } catch (e) {
                envMap = rawEnv;
            }

            // 2. Saray İçi Kraliyet Mermeri (Koyu Obsidyen, Kehribar Mermer Damarları ve İnce Altın Çerçeve)
            const floorC = document.createElement('canvas');
            floorC.width = 512; floorC.height = 512;
            const fCtx = floorC.getContext('2d');
            fCtx.fillStyle = '#18100c';
            fCtx.fillRect(0, 0, 512, 512);

            for (let y = 0; y < 512; y += 128) {
                for (let x = 0; x < 512; x += 128) {
                    const isAlt = ((x + y) / 128) % 2 === 0;
                    const tileGrad = fCtx.createLinearGradient(x, y, x + 128, y + 128);
                    if (isAlt) {
                        tileGrad.addColorStop(0, '#2a1a10');
                        tileGrad.addColorStop(0.5, '#362215');
                        tileGrad.addColorStop(1, '#1d120b');
                    } else {
                        tileGrad.addColorStop(0, '#140e0b');
                        tileGrad.addColorStop(0.5, '#211813');
                        tileGrad.addColorStop(1, '#100b08');
                    }
                    fCtx.fillStyle = tileGrad;
                    fCtx.fillRect(x + 2, y + 2, 124, 124);

                    // Doğal Mermer Kintsugi Altın Damarları
                    fCtx.strokeStyle = 'rgba(245, 158, 11, 0.25)';
                    fCtx.lineWidth = 1.8;
                    fCtx.beginPath();
                    fCtx.moveTo(x + 8, y + 32);
                    fCtx.bezierCurveTo(x + 48, y + 20, x + 80, y + 96, x + 120, y + 88);
                    fCtx.stroke();

                    // İnce 24K Altın Kakma Bordür
                    fCtx.strokeStyle = 'rgba(234, 179, 8, 0.62)';
                    fCtx.lineWidth = 2.5;
                    fCtx.strokeRect(x + 4, y + 4, 120, 120);
                }
            }
            const palaceFloorTex = new THREE.CanvasTexture(floorC);
            palaceFloorTex.wrapS = THREE.RepeatWrapping;
            palaceFloorTex.wrapT = THREE.RepeatWrapping;
            palaceFloorTex.repeat.set(12, 12);

            // 3. Saray Tavanı: Altın Kasetli ve Lapis Lazuli Yıldız Kubbeli Tavan Dokusu
            const ceilC = document.createElement('canvas');
            ceilC.width = 512; ceilC.height = 512;
            const clCtx = ceilC.getContext('2d');
            clCtx.fillStyle = '#0d1526';
            clCtx.fillRect(0, 0, 512, 512);
            for (let y = 0; y < 512; y += 128) {
                for (let x = 0; x < 512; x += 128) {
                    clCtx.strokeStyle = '#d97706';
                    clCtx.lineWidth = 10;
                    clCtx.strokeRect(x + 6, y + 6, 116, 116);
                    clCtx.strokeStyle = '#fde047';
                    clCtx.lineWidth = 2.5;
                    clCtx.strokeRect(x + 16, y + 16, 96, 96);

                    clCtx.fillStyle = '#fbbf24';
                    clCtx.beginPath();
                    clCtx.arc(x + 64, y + 64, 12, 0, Math.PI * 2);
                    clCtx.fill();
                    for (let a = 0; a < 8; a++) {
                        const ang = (a / 8) * Math.PI * 2;
                        clCtx.beginPath();
                        clCtx.moveTo(x + 64, y + 64);
                        clCtx.lineTo(x + 64 + Math.cos(ang) * 34, y + 64 + Math.sin(ang) * 34);
                        clCtx.strokeStyle = '#f59e0b';
                        clCtx.lineWidth = 2.5;
                        clCtx.stroke();
                    }
                }
            }
            const ceilingTex = new THREE.CanvasTexture(ceilC);
            ceilingTex.wrapS = THREE.RepeatWrapping;
            ceilingTex.wrapT = THREE.RepeatWrapping;
            ceilingTex.repeat.set(8, 8);

            // 4. Dış Avlu Kraliyet Kumtaşı Döşemesi
            const courtC = document.createElement('canvas');
            courtC.width = 512; courtC.height = 512;
            const cCtx = courtC.getContext('2d');
            cCtx.fillStyle = '#b8864c';
            cCtx.fillRect(0, 0, 512, 512);
            for (let y = 0; y < 512; y += 64) {
                const off = (y / 64) % 2 === 0 ? 0 : 64;
                for (let x = 0; x < 512; x += 128) {
                    cCtx.fillStyle = ((x + y) % 128 === 0) ? '#c79559' : '#a8763e';
                    cCtx.fillRect((x + off) % 512 + 2, y + 2, 124, 60);
                    cCtx.strokeStyle = 'rgba(120, 65, 20, 0.45)';
                    cCtx.lineWidth = 2;
                    cCtx.strokeRect((x + off) % 512 + 2, y + 2, 124, 60);
                }
            }
            const courtyardTex = new THREE.CanvasTexture(courtC);
            courtyardTex.wrapS = THREE.RepeatWrapping;
            courtyardTex.wrapT = THREE.RepeatWrapping;
            courtyardTex.repeat.set(16, 16);

            // 5. Gerçek Kumtaşı ve Altın Oyma Hiyeroglif Saray Duvarı Dokusu (Mavi Kare Düğmeler Tamamen Kaldırıldı!)
            const wallC = document.createElement('canvas');
            wallC.width = 512; wallC.height = 512;
            const wCtx = wallC.getContext('2d');
            wCtx.fillStyle = '#9e6b36';
            wCtx.fillRect(0, 0, 512, 512);

            for (let y = 0; y < 512; y += 64) {
                wCtx.fillStyle = y % 128 === 0 ? '#8f5e2c' : '#a8743c';
                wCtx.fillRect(0, y, 512, 62);

                // İnce Altın Kuşak
                wCtx.fillStyle = 'rgba(245, 158, 11, 0.75)';
                wCtx.fillRect(0, y, 512, 4);

                const off = (y / 64) % 2 === 0 ? 0 : 64;
                for (let x = 0; x < 512; x += 128) {
                    const bx = (x + off) % 512;
                    wCtx.strokeStyle = 'rgba(72, 38, 12, 0.48)';
                    wCtx.lineWidth = 2;
                    wCtx.strokeRect(bx + 2, y + 4, 124, 58);

                    // Kumtaşı İçine Oyulmuş Zarif Altın/Bronz Kartuş ve Hiyeroglif Sembolleri
                    wCtx.strokeStyle = 'rgba(251, 191, 36, 0.52)';
                    wCtx.lineWidth = 1.8;
                    wCtx.strokeRect(bx + 18, y + 12, 90, 40);

                    wCtx.fillStyle = 'rgba(253, 224, 71, 0.55)';
                    wCtx.beginPath();
                    wCtx.arc(bx + 38, y + 32, 6, 0, Math.PI * 2);
                    wCtx.fill();
                    wCtx.fillRect(bx + 54, y + 20, 4, 24);
                    wCtx.fillRect(bx + 66, y + 26, 22, 4);
                    wCtx.fillRect(bx + 66, y + 36, 16, 4);
                }
            }
            const hieroWallTex = new THREE.CanvasTexture(wallC);
            hieroWallTex.wrapS = THREE.RepeatWrapping;
            hieroWallTex.wrapT = THREE.RepeatWrapping;
            hieroWallTex.repeat.set(6, 2);

            // 6. Giza Piramitleri İçin Özel İnce Tura Kireçtaşı Blok Dokusu (Mavi Kareler Yok!)
            const pyrC = document.createElement('canvas');
            pyrC.width = 256; pyrC.height = 256;
            const pCtx = pyrC.getContext('2d');
            pCtx.fillStyle = '#c49358';
            pCtx.fillRect(0, 0, 256, 256);
            for (let y = 0; y < 256; y += 16) {
                pCtx.fillStyle = y % 32 === 0 ? '#b8864c' : '#cf9e63';
                pCtx.fillRect(0, y, 256, 15);
                pCtx.strokeStyle = 'rgba(78, 44, 16, 0.35)';
                pCtx.lineWidth = 1;
                pCtx.strokeRect(0, y, 256, 16);
            }
            const pyramidStoneTex = new THREE.CanvasTexture(pyrC);
            pyramidStoneTex.wrapS = THREE.RepeatWrapping;
            pyramidStoneTex.wrapT = THREE.RepeatWrapping;
            pyramidStoneTex.repeat.set(12, 12);

            // 7. Dikey Oluklu (Fluted) Lapis Lazuli & Altın Sütun Dokusu (Kareli Mısır Koçanı Görünümü Kaldırıldı!)
            const lapC = document.createElement('canvas');
            lapC.width = 256; lapC.height = 256;
            const lpCtx = lapC.getContext('2d');
            const lapGrad = lpCtx.createLinearGradient(0, 0, 256, 0);
            lapGrad.addColorStop(0.0, '#0c1938');
            lapGrad.addColorStop(0.5, '#172a5c');
            lapGrad.addColorStop(1.0, '#0c1938');
            lpCtx.fillStyle = lapGrad;
            lpCtx.fillRect(0, 0, 256, 256);

            // Dikey Altın Yivler (Fluting)
            for (let x = 0; x < 256; x += 16) {
                const flGrad = lpCtx.createLinearGradient(x, 0, x + 16, 0);
                flGrad.addColorStop(0.0, 'rgba(245, 158, 11, 0.55)');
                flGrad.addColorStop(0.2, 'rgba(30, 58, 138, 0.1)');
                flGrad.addColorStop(0.5, 'rgba(10, 20, 48, 0.45)');
                flGrad.addColorStop(0.8, 'rgba(30, 58, 138, 0.1)');
                flGrad.addColorStop(1.0, 'rgba(245, 158, 11, 0.55)');
                lpCtx.fillStyle = flGrad;
                lpCtx.fillRect(x, 0, 16, 256);
            }
            // Sadece Alt ve Üstte Zarif Altın Bilezik Kuşağı
            lpCtx.fillStyle = '#f59e0b';
            lpCtx.fillRect(0, 12, 256, 8);
            lpCtx.fillRect(0, 236, 256, 8);
            const lapisTex = new THREE.CanvasTexture(lapC);

            // 8. 24K Parlak Mısır Altını Dokusu
            const goldC = document.createElement('canvas');
            goldC.width = 256; goldC.height = 256;
            const gCtx = goldC.getContext('2d');
            const gGrad = gCtx.createLinearGradient(0, 0, 256, 256);
            gGrad.addColorStop(0.0, '#fffbeb');
            gGrad.addColorStop(0.28, '#f59e0b');
            gGrad.addColorStop(0.68, '#b45309');
            gGrad.addColorStop(1.0, '#fde047');
            gCtx.fillStyle = gGrad;
            gCtx.fillRect(0, 0, 256, 256);
            const goldTex = new THREE.CanvasTexture(goldC);

            // 9. Kraliyet Bordo, Lapis & Altın Dokuma Saray Halısı Dokusu
            const carpetC = document.createElement('canvas');
            carpetC.width = 256; carpetC.height = 256;
            const cpCtx = carpetC.getContext('2d');
            cpCtx.fillStyle = '#5c1111';
            cpCtx.fillRect(0, 0, 256, 256);
            cpCtx.fillStyle = '#d97706';
            cpCtx.fillRect(8, 0, 14, 256);
            cpCtx.fillRect(234, 0, 14, 256);
            cpCtx.fillStyle = '#0d9488';
            cpCtx.fillRect(26, 0, 6, 256);
            cpCtx.fillRect(224, 0, 6, 256);
            for (let y = 0; y < 256; y += 64) {
                cpCtx.strokeStyle = 'rgba(251, 191, 36, 0.65)';
                cpCtx.lineWidth = 2;
                cpCtx.strokeRect(44, y + 8, 168, 48);
                cpCtx.fillStyle = '#1e3a8a';
                cpCtx.beginPath();
                cpCtx.arc(128, y + 32, 12, 0, Math.PI * 2);
                cpCtx.fill();
                cpCtx.fillStyle = '#f59e0b';
                cpCtx.beginPath();
                cpCtx.arc(128, y + 32, 5, 0, Math.PI * 2);
                cpCtx.fill();
            }
            const carpetTex = new THREE.CanvasTexture(carpetC);
            carpetTex.wrapS = THREE.RepeatWrapping;
            carpetTex.wrapT = THREE.RepeatWrapping;
            carpetTex.repeat.set(1, 8);

            // 10. Keten ve Cilt Dokuları
            const linenC = document.createElement('canvas');
            linenC.width = 256; linenC.height = 256;
            const lCtx = linenC.getContext('2d');
            lCtx.fillStyle = '#f8fafc';
            lCtx.fillRect(0, 0, 256, 256);
            lCtx.fillStyle = '#eab308';
            lCtx.fillRect(0, 224, 256, 18);
            const linenTex = new THREE.CanvasTexture(linenC);

            const skinC = document.createElement('canvas');
            skinC.width = 256; skinC.height = 256;
            const skCtx = skinC.getContext('2d');
            skCtx.fillStyle = '#b8734b';
            skCtx.fillRect(0, 0, 256, 256);
            const skinTex = new THREE.CanvasTexture(skinC);

            return {
                envMap,
                palaceFloorTex,
                ceilingTex,
                courtyardTex,
                hieroWallTex,
                pyramidStoneTex,
                lapisTex,
                goldTex,
                carpetTex,
                linenTex,
                skinTex
            };
        }

        // ============================================================================
        // 2. OYUNCU (BEK), TANRILAR (OSİRİS, HORUS, HATHOR, THOTH) VE SARAY MUHAFIZLARI
        // ============================================================================
        let sharedCharGeos = null;
        let sharedCharMats = null;

        function initSharedCharacterAssets() {
            const torsoGeo = new THREE.CylinderGeometry(1, 1, 0.62, 20, 12, false);
            const pos = torsoGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
                const t = (vy + 0.31) / 0.62;
                const ang = Math.atan2(vx, vz);
                let rx = 0.14, rz = 0.10;
                if (t < 0.25) {
                    rx = THREE.MathUtils.lerp(0.14, 0.13, t / 0.25);
                    rz = THREE.MathUtils.lerp(0.10, 0.095, t / 0.25);
                } else if (t < 0.74) {
                    const k = (t - 0.25) / 0.49;
                    rx = THREE.MathUtils.lerp(0.13, 0.185, Math.sin(k * Math.PI * 0.5));
                    rz = THREE.MathUtils.lerp(0.095, 0.125, k);
                } else {
                    const k = (t - 0.74) / 0.26;
                    rx = THREE.MathUtils.lerp(0.185, 0.062, k);
                    rz = THREE.MathUtils.lerp(0.125, 0.060, k);
                }
                pos.setXYZ(i, Math.sin(ang) * rx, vy, Math.cos(ang) * rz);
            }
            torsoGeo.computeVertexNormals();

            sharedCharGeos = {
                torsoGeo,
                beltGeo: new THREE.CylinderGeometry(0.140, 0.146, 0.075, 14),
                kiltGeo: new THREE.CylinderGeometry(0.142, 0.19, 0.34, 16),
                collarGeo: new THREE.CylinderGeometry(0.085, 0.195, 0.06, 14, 1, true),
                capeGeo: new THREE.BoxGeometry(0.38, 0.76, 0.025),
                craniumGeo: new THREE.SphereGeometry(0.102, 12, 10),
                noseGeo: new THREE.ConeGeometry(0.017, 0.05, 5),
                khatGeo: new THREE.SphereGeometry(0.112, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.62),
                crownGeo: new THREE.CylinderGeometry(0.09, 0.105, 0.19, 12),
                deltoidGeo: new THREE.SphereGeometry(0.054, 8, 8),
                upperArmGeo: new THREE.CylinderGeometry(0.046, 0.038, 0.26, 8),
                foreArmGeo: new THREE.CylinderGeometry(0.038, 0.029, 0.25, 8),
                handGeo: new THREE.SphereGeometry(0.03, 6, 6),
                spearGeo: new THREE.CylinderGeometry(0.016, 0.016, 2.6, 6),
                spearTipGeo: new THREE.ConeGeometry(0.045, 0.28, 6),
                thighGeo: new THREE.CylinderGeometry(0.066, 0.048, 0.42, 8),
                shinGeo: new THREE.CylinderGeometry(0.048, 0.033, 0.42, 8),
                footGeo: new THREE.BoxGeometry(0.066, 0.036, 0.15)
            };

            sharedCharMats = {
                skinMat: new THREE.MeshStandardMaterial({ map: window.textures.skinTex, roughness: 0.46 }),
                linenMat: new THREE.MeshStandardMaterial({ map: window.textures.linenTex, roughness: 0.72 }),
                crimsonSilkMat: new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.48 }),
                lapisRobesMat: new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.48 }),
                turquoiseRobesMat: new THREE.MeshStandardMaterial({ color: 0x0d9488, roughness: 0.45 }),
                goldMat: new THREE.MeshStandardMaterial({
                    map: window.textures.goldTex,
                    envMap: window.textures.envMap,
                    color: 0xf59e0b,
                    metalness: 0.90,
                    roughness: 0.16
                })
            };
        }

        function createPalaceCharacter(scale = 1.0, role = 'player', castShad = false) {
            if (!sharedCharGeos) initSharedCharacterAssets();

            const root = new THREE.Group();
            root.scale.setScalar(scale);

            const hips = new THREE.Group();
            hips.position.y = 0.92;
            root.add(hips);

            const isGuard = role === 'royal_guard';
            const isDeity = role === 'deity_noble';

            const bodyMat = sharedCharMats.skinMat;
            const kiltMat = isGuard
                ? sharedCharMats.goldMat
                : (isDeity ? sharedCharMats.linenMat : sharedCharMats.turquoiseRobesMat);

            const torso = new THREE.Mesh(sharedCharGeos.torsoGeo, bodyMat);
            torso.position.y = 0.30;
            torso.castShadow = castShad;
            hips.add(torso);

            const belt = new THREE.Mesh(sharedCharGeos.beltGeo, sharedCharMats.goldMat);
            belt.position.y = 0.01;
            hips.add(belt);

            if (role === 'player' || isDeity) {
                const cape = new THREE.Mesh(
                    sharedCharGeos.capeGeo,
                    isDeity ? sharedCharMats.goldMat : sharedCharMats.crimsonSilkMat
                );
                cape.position.set(0, -0.06, -0.11);
                cape.rotation.x = 0.14;
                torso.add(cape);
            }

            const kilt = new THREE.Mesh(sharedCharGeos.kiltGeo, kiltMat);
            kilt.scale.set(0.95, 1.0, 0.78);
            kilt.position.y = -0.14;
            kilt.castShadow = castShad;
            hips.add(kilt);

            const collar = new THREE.Mesh(sharedCharGeos.collarGeo, sharedCharMats.goldMat);
            collar.scale.set(1.0, 1.0, 0.72);
            collar.position.y = 0.22;
            torso.add(collar);

                foot.position.set(0, -0.44, 0.032);
                knee.add(foot);

                return { hip, knee };
            }

            return {
                root,
                hips,
                torso,
                role,
                arms: { left: makeArm(false), right: makeArm(true) },
                legs: { left: makeLeg(false), right: makeLeg(true) },
                walkPhase: Math.random() * Math.PI * 2,
                patrolStartZ: 0,
                patrolDist: 0
            };
        }

        function animateCharacter(char, moving, speedMag, delta, elapsed) {
            if (!char) return;
            if (char.pelvis || (window.player === char && window.EgyptCharacterEngine)) {
                window.EgyptCharacterEngine.animateEgyptCharacter(char, moving, speedMag, delta, elapsed);
                return;
            }
            if (moving) {
                char.walkPhase += delta * (7.2 * Math.max(0.45, speedMag));
                const p = char.walkPhase;
                const s = Math.sin(p);
                const os = Math.sin(p + Math.PI);

                char.hips.position.y = 0.90 + Math.abs(Math.cos(p)) * 0.03;
                char.torso.rotation.y = -s * 0.10;
                char.torso.rotation.x = 0.08;

                char.legs.left.hip.rotation.x = s * 0.58;
                char.legs.right.hip.rotation.x = os * 0.58;
                char.legs.left.knee.rotation.x = Math.max(0, -Math.cos(p) * 0.68);
                char.legs.right.knee.rotation.x = Math.max(0, -Math.cos(p + Math.PI) * 0.68);

                char.arms.left.shoulder.rotation.x = os * 0.45;
                char.arms.right.shoulder.rotation.x = s * 0.45;
                char.arms.left.elbow.rotation.x = -0.28 - Math.max(0, os) * 0.22;
                char.arms.right.elbow.rotation.x = -0.28 - Math.max(0, s) * 0.22;
            } else {
                const breath = Math.sin(elapsed * 2.4 + char.walkPhase);
                char.hips.position.y = THREE.MathUtils.lerp(char.hips.position.y, 0.92 + breath * 0.008, 0.15);
                char.torso.rotation.y = THREE.MathUtils.lerp(char.torso.rotation.y, 0, 0.15);
                char.torso.rotation.x = THREE.MathUtils.lerp(char.torso.rotation.x, breath * 0.015, 0.15);

                char.legs.left.hip.rotation.x = THREE.MathUtils.lerp(char.legs.left.hip.rotation.x, 0, 0.15);
                char.legs.right.hip.rotation.x = THREE.MathUtils.lerp(char.legs.right.hip.rotation.x, 0, 0.15);
                char.legs.left.knee.rotation.x = THREE.MathUtils.lerp(char.legs.left.knee.rotation.x, 0, 0.15);
                char.legs.right.knee.rotation.x = THREE.MathUtils.lerp(char.legs.right.knee.rotation.x, 0, 0.15);

                char.arms.left.shoulder.rotation.x = THREE.MathUtils.lerp(char.arms.left.shoulder.rotation.x, 0.04, 0.15);
                char.arms.right.shoulder.rotation.x = THREE.MathUtils.lerp(char.arms.right.shoulder.rotation.x, -0.04, 0.15);
                char.arms.left.elbow.rotation.x = -0.18;
                char.arms.right.elbow.rotation.x = -0.18;
            }
        }

        function addWallWithCollider(parent, x, y, z, w, h, d, mat, registerCol = true) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            parent.add(mesh);

            if (registerCol) {
                wallColliders.push({
                    minX: x - w * 0.5 - 0.55,
                    maxX: x + w * 0.5 + 0.55,
                    minZ: z - d * 0.5 - 0.55,
                    maxZ: z + d * 0.5 + 0.55
                });
            }
            return mesh;
        }

        // Katmanlı Altın Şahin Kanatlı Güneş Diski (Behdety)
        function createWingedSolarEmblem(spanWidth, goldMat, lapisMat) {
            const emblem = new THREE.Group();
            const sunOrb = new THREE.Mesh(new THREE.SphereGeometry(spanWidth * 0.095, 20, 16), goldMat);
            sunOrb.scale.set(1.0, 1.0, 0.45);
            emblem.add(sunOrb);

            [-1, 1].forEach(side => {
                const cobraRing = new THREE.Mesh(
                    new THREE.TorusGeometry(spanWidth * 0.055, spanWidth * 0.015, 8, 16, Math.PI * 1.3),
                    goldMat
                );
                cobraRing.position.set(side * spanWidth * 0.085, -spanWidth * 0.02, 0.12);
                emblem.add(cobraRing);

                for (let f = 0; f < 14; f++) {
                    const u = f / 13;
                    const len = spanWidth * (0.48 - u * 0.26);
                    const feather = new THREE.Mesh(
                        new THREE.BoxGeometry(len, spanWidth * 0.024, 0.16),
                        f % 3 === 0 ? lapisMat : goldMat

                    feather.position.set(
                        side * (spanWidth * 0.09 + len * 0.48),
                        (0.45 - u) * spanWidth * 0.15,
                        -u * 0.08
                    );
                    feather.rotation.z = -side * (u * 0.28);
                    emblem.add(feather);
                }
            });
            return emblem;
        }

        // Kraliyet Hurma Palmiyesi
        function createRoyalPalmTree(trunkMat, leafMat) {
            const tree = new THREE.Group();
            for (let s = 0; s < 7; s++) {
                const t = s / 6;
                const seg = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.24 * (1 - t * 0.35), 0.30 * (1 - t * 0.35), 1.25, 8),
                    trunkMat
                );
                seg.position.set(Math.sin(t * 0.65) * 0.45, s * 1.12 + 0.6, 0);
                seg.rotation.z = -t * 0.12;
                tree.add(seg);
            }
            const topPos = new THREE.Vector3(0.28, 7.8, 0);
            for (let f = 0; f < 12; f++) {
                const ang = (f / 12) * Math.PI * 2;
                const frondGroup = new THREE.Group();
                frondGroup.position.copy(topPos);
                frondGroup.rotation.y = ang;
                tree.add(frondGroup);

                const innerBlade = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.06, 0.42), leafMat);
                innerBlade.position.set(0.75, 0.18, 0);
                innerBlade.rotation.z = 0.22;
                frondGroup.add(innerBlade);

                const outerBlade = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.05, 0.30), leafMat);
                outerBlade.position.set(2.15, -0.18, 0);
                outerBlade.rotation.z = -0.36;
                frondGroup.add(outerBlade);
            }
            return tree;
        }

            function addBrazier(x, y, z, scale = 1.0) {
                palaceFlameData.push({ x, y, z, scale, phase: Math.random() * Math.PI * 2 });
            }

            // NOKTASIZ, PÜRÜZSÜZ ZÜMRÜT-TURKUAZ KRALİYET SUYU SHADER'I (Yumurta Kolisi/Polka-Dot Deseni %100 Kaldırıldı!)
            waterShaderUniforms = { uTime: { value: 0.0 } };
            const waterShaderMat = new THREE.ShaderMaterial({
                uniforms: waterShaderUniforms,
                vertexShader: `
                    varying vec3 vWorldPos;
                    void main() {
                        vec4 wp = modelMatrix * vec4(position, 1.0);
                        vWorldPos = wp.xyz;
                        gl_Position = projectionMatrix * viewMatrix * wp;
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    varying vec3 vWorldPos;
                    void main() {
                        vec2 p = vWorldPos.xz * 0.14;
                        float w1 = sin(p.x * 2.1 + p.y * 1.7 + uTime * 1.4);
                        float w2 = sin(p.x * 1.3 - p.y * 2.4 - uTime * 1.1);
                        float wave = (w1 + w2) * 0.25 + 0.5;
                        vec3 deepCol = vec3(0.03, 0.26, 0.38);
                        vec3 shallowCol = vec3(0.06, 0.46, 0.58);
                        vec3 sunSheen = vec3(0.96, 0.76, 0.32) * smoothstep(0.78, 0.98, wave) * 0.18;
                        gl_FragColor = vec4(mix(deepCol, shallowCol, wave * 0.55) + sunSheen, 0.94);
                    }
                `,
                transparent: true
            });

            // PÜRÜZSÜZ İNCE TÜL ŞELALE SHADER'I
            waterfallShaderUniforms = { uTime: { value: 0.0 } };
            const waterfallShaderMat = new THREE.ShaderMaterial({
                uniforms: waterfallShaderUniforms,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    varying vec2 vUv;
                    void main() {

            });

            const d = 115;
            mainSunLight.shadow.camera.left = -d;
            mainSunLight.shadow.camera.right = d;
            mainSunLight.shadow.camera.top = d;
            mainSunLight.shadow.camera.bottom = -d;
            mainSunLight.shadow.camera.far = 340;
            mainSunLight.shadow.bias = -0.0005;
            scene.add(mainSunLight);

            const throneLight = new THREE.PointLight(0xf59e0b, 2.2, 85);
            throneLight.position.set(0, 16, -48);
            scene.add(throneLight);

            const hathorRoomLight = new THREE.PointLight(0xfbbf24, 1.6, 55);
            hathorRoomLight.position.set(-51, 14, -6);
            scene.add(hathorRoomLight);

            const libraryRoomLight = new THREE.PointLight(0x38bdf8, 1.6, 55);
            libraryRoomLight.position.set(51, 14, -6);
            scene.add(libraryRoomLight);

            // Kraliyet Sarayını (Dış Avlu, Tavanlı/Kubbeli Taht Salonu ve 5 Odayı) İnşa Et
            buildGodsOfEgyptPalaceWorld();

            // Karakter Tanrılar Motoru (karaktertanrilar.html'den Entegre Edilen Gerçek 3B Modeller)
            window.updatePlayerModelScale = () => {
                player = window.spawnPlayerCharacter(scene, renderer, new THREE.Vector3(0, 1.2, 18.0), Math.PI);
            };
            window.updatePlayerModelScale();

            // Saray İçindeki Tanrılar, Soylular ve Altın Saray Muhafızları
            palaceNPCs = [];

            // 1. Tahtın Önünde Zalim Kral Set (karaktertanrilar.html'den 3.6m Altın Çakal Zırhı!)
            const kingDeity = window.EgyptCharacterEngine.createEgyptCharacter({
                name: 'Kral Set',
                role: 'set_god',
                scale: 1.95
            }, renderer);
            kingDeity.root.position.set(0, 3.85, -51.5);
            kingDeity.root.rotation.y = 0;
            scene.add(kingDeity.root);
            palaceNPCs.push(kingDeity);

            // 2. Hathor'un Yatak Odasında Tanrıça Hathor ve Nedimeler
            const hathorDeity = createPalaceCharacter(1.32, 'deity_noble', true);
            hathorDeity.root.position.set(-46.0, 1.2, -2.0);
            hathorDeity.root.rotation.y = Math.PI * 0.25;
            scene.add(hathorDeity.root);
            palaceNPCs.push(hathorDeity);

            // 3. Kütüphanede Mimari Piramit Maketini İnceleyen Zaya ve Bilgelik Tanrısı Thoth
            const thothDeity = createPalaceCharacter(1.35, 'deity_noble', true);
            thothDeity.root.position.set(43.5, 1.2, -6.0);
            thothDeity.root.rotation.y = Math.PI / 2;
            scene.add(thothDeity.root);
            palaceNPCs.push(thothDeity);

            const zayaArchitect = createPalaceCharacter(1.0, 'noble', true);
            zayaArchitect.root.position.set(58.5, 1.2, -6.0);
            zayaArchitect.root.rotation.y = -Math.PI / 2;
            scene.add(zayaArchitect.root);
            palaceNPCs.push(zayaArchitect);

            // 4. Taht Salonu, Odalar ve Avluda Devriye Gezen 24 Altın Mızraklı Kraliyet Muhafızı
            const guardCoords = [
                [-6.2, 1.2, 20.0, 0], [6.2, 1.2, 20.0, 0],
                [-6.2, 1.2, 2.0, 5.0], [6.2, 1.2, 2.0, 5.0],
                [-6.2, 1.2, -20.0, 5.0], [6.2, 1.2, -20.0, 5.0],
                [-6.2, 1.2, -40.0, 0], [6.2, 1.2, -40.0, 0],
                [-22.0, 1.2, -12.0, 0], [22.0, 1.2, -12.0, 0],
                [-22.0, 1.2, -64.0, 0], [22.0, 1.2, -64.0, 0],
                [-51.0, 1.2, -34.0, 0], [51.0, 1.2, -34.0, 0],
                [-8.5, 1.2, -96.0, 4.0], [8.5, 1.2, -96.0, 4.0],
                [-6.5, 0.0, 44.0, 6.0], [6.5, 0.0, 44.0, 6.0],
                [-6.5, 0.0, 76.0, 6.0], [6.5, 0.0, 76.0, 6.0]
            ];
            guardCoords.forEach(([gx, gy, gz, pDist], idx) => {
                const guard = createPalaceCharacter(1.18, 'royal_guard', false);
                guard.root.position.set(gx, gy, gz);
                guard.root.rotation.y = gx < 0 ? Math.PI / 2 : -Math.PI / 2;
                guard.patrolStartZ = gz;
                guard.patrolDist = pDist;
                scene.add(guard.root);
                palaceNPCs.push(guard);
            });

            // 3D Portallar: Nil Başkenti ve Gizli Tuzaklı Tapınak Geçidi
            window.sarayPortals = [
                { name: 'Nil Nehri & Başkent', file: 'mısır.html', x: 0, y: 0.05, z: 80, color: 0xf59e0b },
                { name: 'Gizli Tuzaklı Tapınak', file: 'horustapınak.html', x: 0, y: 3.85, z: -68, color: 0xef4444 }
            ];

            window.sarayPortalGroups = [];
            window.sarayPortals.forEach(pd => {
                const pGroup = new THREE.Group();
                pGroup.position.set(pd.x, pd.y, pd.z);
                const ringGeo = new THREE.RingGeometry(2.0, 2.8, 32);
                ringGeo.rotateX(-Math.PI / 2);
                const ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: pd.color, side: THREE.DoubleSide }));
                pGroup.add(ringMesh);

                const cylGeo = new THREE.CylinderGeometry(2.4, 2.4, 3.8, 16, 1, true);
                const cylMesh = new THREE.Mesh(cylGeo, new THREE.MeshBasicMaterial({ color: pd.color, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
                cylMesh.position.y = 1.9;
                pGroup.add(cylMesh);

                scene.add(pGroup);
                window.sarayPortalGroups.push({ group: pGroup, cyl: cylMesh, data: pd });
            });


            window.scene = scene;
            window.camera = camera;
            window.renderer = renderer;

            if (window.EgyptCollisionEngine) {
                window.EgyptCollisionEngine.clearColliders();
                // Saray Giriş ve Taht Merdiven Rampaları
                window.EgyptCollisionEngine.addRampCollider(-12, 12, 26, 36, 0.0, 1.2, true);
                window.EgyptCollisionEngine.addRampCollider(-8, 8, -46, -52, 1.2, 3.85, true);
                // Saray Sütunları
                [-6.2, 6.2].forEach(colX => {
                    [20, 2, -20, -40].forEach(colZ => {
                        window.EgyptCollisionEngine.addCylinderCollider(colX, colZ, 1.4);
                    });
                });
                // Devasa Kraliyet Heykelleri
                window.EgyptCollisionEngine.addCylinderCollider(-18, -48, 2.8);
                window.EgyptCollisionEngine.addCylinderCollider(18, -48, 2.8);
            }

            if (window.EgyptCombatEngine) {
                window.EgyptCombatEngine.clearTargets();
                // Zalim Kral Set Boss Hedefi
                if (kingDeity && kingDeity.root) {
                    window.EgyptCombatEngine.registerTarget(kingDeity.root, 650, 650, 2.8, 'Kral Set (Tanrı Çakal)', (dmg, remHp) => {
                        if (window.GameHUD) window.GameHUD.showToast(`⚡ KRAL SET: "Cüretkar solucan! Kalan Gücüm: ${remHp}"`, 'danger');
                        if (kingDeity.hitStagger !== undefined) kingDeity.hitStagger = 1.0;
                    });
                }
                // Kraliyet Muhafızları
                palaceNPCs.forEach((npc, idx) => {
                    if (npc !== kingDeity && npc.root) {
                        window.EgyptCombatEngine.registerTarget(npc.root, 110, 110, 1.5, 'Kraliyet Muhafızı');
                    }
                });
            }

            bindPalaceControls();
            window.addEventListener('resize', onResize);
            animate();
        }

        // ============================================================================
        // 6. MOBİL DOKUNMATİK KONTROLLER & 1. ŞAHIS (FIRST-PERSON) GEÇİŞ BUTONU
        // ============================================================================
        function bindPalaceControls() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const fpvBtn = document.getElementById('fpv-toggle-btn');
            const fpvLabel = document.getElementById('fpv-label');
            const fpvIcon = document.getElementById('fpv-icon');
            const maxR = 40;

            // 1. Şahıs (Karakterin Gözünden) / 3. Şahıs Geçişi
            fpvBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
            });
            fpvBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (window.EgyptCameraSystem) {
                    window.EgyptCameraSystem.toggleFirstPerson();
                    isFirstPerson = window.EgyptCameraSystem.isFirstPerson;
                } else {
                    isFirstPerson = !isFirstPerson;
                }
                if (isFirstPerson) {
                    fpvIcon.textContent = '🏛️';
                    fpvLabel.textContent = '3. ŞAHIS (DIŞ KAMERA)';
                    camPitch = 0.04;
                    if (player) player.root.visible = false;
                } else {
                    fpvIcon.textContent = '👁️';
                    fpvLabel.textContent = '1. ŞAHIS (GÖZÜNDEN)';
                    camPitch = 0.16;
                    if (player) player.root.visible = true;
                }
            });

            function updateJoy(cx, cy) {
                const rect = zone.getBoundingClientRect();
                let dx = cx - (rect.left + rect.width / 2);
                let dy = cy - (rect.top + rect.height / 2);
                const dist = Math.hypot(dx, dy);
                if (dist > maxR) {
                    dx = (dx / dist) * maxR;
                    dy = (dy / dist) * maxR;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyVec.x = dx / maxR;
                joyVec.y = dy / maxR;
            }

            zone.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                joyActive = true;
                joyPointerId = e.pointerId;
                updateJoy(e.clientX, e.clientY);
            });

            const canvas = renderer.domElement;
            canvas.style.touchAction = 'none';
            canvas.addEventListener('pointerdown', (e) => {
                canvas.setPointerCapture(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (joyActive && e.pointerId === joyPointerId) {
                    updateJoy(e.clientX, e.clientY);
                    return;
                }
                if (!activePointers.has(e.pointerId)) return;

                const prev = activePointers.get(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 1) {
                    camYaw -= (e.clientX - prev.x) * 0.0075;
                    if (isFirstPerson) {
                        // 1. Şahıs Modunda Tavan ve Kubbelere Rahatça Bakabilmek İçin Geniş Dikey Açı
                        camPitch = Math.max(-1.15, Math.min(1.15, camPitch - (e.clientY - prev.y) * 0.0065));
                    } else {
                        camPitch = Math.max(-0.22, Math.min(1.42, camPitch + (e.clientY - prev.y) * 0.0065));
                    }
                } else if (activePointers.size === 2 && !isFirstPerson) {
                    const pts = Array.from(activePointers.values());
                    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinchDist > 0) {
                        desiredDist = Math.max(2.5, Math.min(280.0, desiredDist + (lastPinchDist - dist) * 0.20));
                    }
                    lastPinchDist = dist;
                }
            });

            function endPointer(e) {
                if (joyActive && e.pointerId === joyPointerId) {
                    joyActive = false;
                    joyPointerId = null;
                    joyVec.x = 0;
                    joyVec.y = 0;
                    knob.style.transform = 'translate(0px, 0px)';
                }
                activePointers.delete(e.pointerId);
                if (activePointers.size < 2) lastPinchDist = 0;
            }

            window.addEventListener('pointerup', endPointer);
            window.addEventListener('pointercancel', endPointer);

            window.addEventListener('wheel', (e) => {
                desiredDist = Math.max(2.5, Math.min(280.0, desiredDist + e.deltaY * 0.08));
            });

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (k === 's' || e.key === 'ArrowDown') keys.s = true;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (k === 's' || e.key === 'ArrowDown') keys.s = false;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================================================
        // 7. SARAY İÇ/DIŞ GEZİNME FİZİĞİ, AKILLI TAVAN SİSTEMİ VE ANİMASYON DÖNGÜSÜ
        // ============================================================================
        const animDummy = new THREE.Object3D();

        function isBlockedByWall(x, z) {
            for (let i = 0; i < wallColliders.length; i++) {
                const c = wallColliders[i];
                if (x >= c.minX && x <= c.maxX && z >= c.minZ && z <= c.maxZ) {
                    return true;
                }
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            if (waterShaderUniforms) waterShaderUniforms.uTime.value = elapsed;
            if (waterfallShaderUniforms) waterfallShaderUniforms.uTime.value = elapsed;

            let ix = joyVec.x;
            let iy = joyVec.y;
            if (keys.w) iy = -1;
            if (keys.s) iy = 1;
            if (keys.a) ix = -1;
            if (keys.d) ix = 1;

            const mag = Math.min(1, Math.hypot(ix, iy));
            const moving = mag > 0.05;

            if (moving && player) {
                const fwdX = -Math.sin(camYaw);
                const fwdZ = -Math.cos(camYaw);
                const rightX = Math.cos(camYaw);
                const rightZ = -Math.sin(camYaw);

                const dirX = rightX * ix + fwdX * (-iy);
                const dirZ = rightZ * ix + fwdZ * (-iy);

                const walkSpeed = 10.8 * mag;
                const candX = Math.max(-73.5, Math.min(73.5, player.root.position.x + dirX * walkSpeed * delta));
                const candZ = Math.max(-115.5, Math.min(142.0, player.root.position.z + dirZ * walkSpeed * delta));

                let nextX = player.root.position.x;
                let nextZ = player.root.position.z;
                if (!isBlockedByWall(candX, player.root.position.z)) {
                    nextX = candX;
                }
                if (!isBlockedByWall(player.root.position.x, candZ)) {
                    nextZ = candZ;
                }

                // 3D Sütun ve Katı Engel Kayma Çarpışması
                if (window.EgyptCollisionEngine) {
                    const resolved = window.EgyptCollisionEngine.resolvePosition(
                        player.root.position,
                        { x: nextX, z: nextZ },
                        (player.scale || 1) * 0.45,
                        player.root.position.y
                    );
                    player.root.position.x = resolved.x;
                    player.root.position.z = resolved.z;
                } else {
                    player.root.position.x = nextX;
                    player.root.position.z = nextZ;
                }

                // Merdiven, İç Saray Zemini ve Taht Kürsüsü Yükseklik Hesaplaması
                const px = player.root.position.x;
                const pz = player.root.position.z;
                let groundY = 0.0;
                if (pz <= 26.0) {
                    const distToThrone = Math.hypot(px, pz + 54.0);
                    if (distToThrone < 8.5) {
                        groundY = 1.2 + Math.min(2.6, (8.5 - distToThrone) * 0.35);
                    } else {
                        groundY = 1.2;
                    }
                } else if (pz < 36.0 && Math.abs(px) < 12.0) {
                    const stairT = (36.0 - pz) / 10.0;
                    groundY = stairT * 1.2;
                } else {
                    groundY = 0.0;
                }

                if (window.EgyptCollisionEngine) {
                    window.EgyptCollisionEngine.setGroundElevation(() => groundY);
                } else {
                    player.root.position.y = groundY;
                }

                const targetRot = Math.atan2(dirX, dirZ);
                let diff = targetRot - player.root.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                player.root.rotation.y += diff * 0.18;

                headBobTimer += delta * 11.0 * mag;
            }

            // Fiziği, Zıplamayı ve Manyetik Eşyaları Güncelle
            if (player && window.EgyptCollisionEngine) {
                window.EgyptCollisionEngine.updatePhysics(player, delta);
                window.EgyptCollisionEngine.updateMagneticDrops(player.root.position, delta, elapsed);
            }

            // Savaş Efektleri & Hasar Yazılarını Güncelle
            if (window.EgyptCombatEngine) {
                window.EgyptCombatEngine.update(delta, camera);
            }

            if (player) {
                if (window.EgyptCharacterEngine && player.pelvis) {
                    window.EgyptCharacterEngine.animateEgyptCharacter(player, moving, mag, delta, elapsed);
                } else {
                    animateCharacter(player, moving, mag, delta, elapsed);
                }
            }

            // Saray NPC ve Muhafız Animasyonları
            for (let i = 0; i < palaceNPCs.length; i++) {
                const npc = palaceNPCs[i];
                if (window.EgyptCharacterEngine && npc.pelvis) {
                    window.EgyptCharacterEngine.animateEgyptCharacter(npc, false, 0, delta, elapsed);
                } else {
                    if (npc.patrolDist > 0) {
                        npc.root.position.z = npc.patrolStartZ + Math.sin(elapsed * 0.9 + i) * npc.patrolDist;
                        animateCharacter(npc, true, 0.55, delta, elapsed);
                    } else {
                        animateCharacter(npc, false, 0, delta, elapsed);
                    }
                }
            }

            // Göksel Usturlap Halkaları, Zaya'nın 3B Piramit Maketi, Avizeler, İpek Perdeler ve Sancaklar
            for (let i = 0; i < astrolabeRings.length; i++) {
                const ar = astrolabeRings[i];
                ar.mesh.rotation.x += ar.speedX * delta;
                ar.mesh.rotation.y += ar.speedY * delta;
            }
            if (hologramPyramidGroup) {
                hologramPyramidGroup.rotation.y = elapsed * 0.55;
            }
            for (let i = 0; i < chandelierPendulums.length; i++) {
                const ch = chandelierPendulums[i];
                ch.mesh.rotation.z = Math.sin(elapsed * 1.4 + ch.phase) * 0.025;
            }
            for (let i = 0; i < silkCurtains.length; i++) {
                const sc = silkCurtains[i];
                sc.mesh.rotation.z = Math.sin(elapsed * 2.0 + sc.phase) * 0.055;
            }
            for (let i = 0; i < royalBanners.length; i++) {
                const rb = royalBanners[i];
                rb.mesh.rotation.x = Math.sin(elapsed * 2.4 + rb.phase) * 0.08;
            }

            // Saray Meşaleleri
            if (palaceFlameInst) {
                for (let i = 0; i < palaceFlameData.length; i++) {
                    const f = palaceFlameData[i];
                    const s = f.scale * (0.85 + Math.sin(elapsed * 11.0 + f.phase) * 0.18);
                    animDummy.position.set(f.x, f.y + 2.35 * f.scale, f.z);
                    animDummy.rotation.set(0, elapsed * 3.5 + f.phase, 0);
                    animDummy.scale.set(s, s * 1.35, s);
                    animDummy.updateMatrix();
                    palaceFlameInst.setMatrixAt(i, animDummy.matrix);
                }
                palaceFlameInst.instanceMatrix.needsUpdate = true;
            }

            // 3D Portalların Dönüşü ve Geçiş Kontrolü
            if (window.sarayPortalGroups) {
                for (let i = 0; i < window.sarayPortalGroups.length; i++) {
                    const sp = window.sarayPortalGroups[i];
                    sp.cyl.rotation.y += delta * 1.2;
                    if (player) {
                        const dist = Math.hypot(player.root.position.x - sp.data.x, player.root.position.z - sp.data.z);
                        if (dist < 2.8) {
                            if (!window.teleportingActive) {
                                window.teleportingActive = true;
                                if (window.GameHUD) window.GameHUD.showToast(`${sp.data.name} Kapısından Geçiliyor...`, 'gold');
                                setTimeout(() => {
                                    window.GameState.teleportTo(sp.data.file);
                                }, 600);
                            }
                        }
                    }
                }
            }

            // MMORPG Hasat, Madencilik ve Otomatik Görev Motoru
            if (window.EgyptGatheringEngine && player) {
                window.EgyptGatheringEngine.update(player, delta, elapsed);
            }

            // 1. ŞAHIS (KARAKTERİN GÖZÜNDEN) VEYA 3. ŞAHIS KAMERA TAKİBİ
            if (window.EgyptCameraSystem && player) {
                window.EgyptCameraSystem.camYaw = camYaw;
                window.EgyptCameraSystem.camPitch = camPitch;
                window.EgyptCameraSystem.camDist = camDist;
                window.EgyptCameraSystem.desiredDist = desiredDist;
                window.EgyptCameraSystem.updateCamera(camera, player, moving, mag, delta, elapsed);
                isFirstPerson = window.EgyptCameraSystem.isFirstPerson;
            } else if (player) {
                if (isFirstPerson) {
                    player.root.visible = false;
                    const bobOffset = moving ? Math.sin(headBobTimer) * 0.055 : Math.sin(elapsed * 2.0) * 0.012;
                    const eyeX = player.root.position.x;
                    const eyeY = player.root.position.y + 1.68 + bobOffset;
                    const eyeZ = player.root.position.z;

                    camera.position.set(eyeX, eyeY, eyeZ);
                    const lookDirX = -Math.sin(camYaw) * Math.cos(camPitch);
                    const lookDirY = Math.sin(camPitch);
                    const lookDirZ = -Math.cos(camYaw) * Math.cos(camPitch);
                    camera.lookAt(eyeX + lookDirX * 20.0, eyeY + lookDirY * 20.0, eyeZ + lookDirZ * 20.0);
                } else {
                    player.root.visible = true;
                    camDist = THREE.MathUtils.lerp(camDist, desiredDist, 0.12);
                    const focusX = player.root.position.x;
                    const focusY = player.root.position.y + 1.4;
                    const focusZ = player.root.position.z;

                    const cx = focusX + Math.sin(camYaw) * Math.cos(camPitch) * camDist;
                    const cz = focusZ + Math.cos(camYaw) * Math.cos(camPitch) * camDist;
                    const cy = Math.max(focusY - 0.5, focusY + Math.sin(camPitch) * camDist);

                    camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.22);
                    camera.lookAt(focusX, focusY, focusZ);
                }
            }

            // 1. Şahıs modundayken veya kamera tavanın altındayken tavan %100 katı görünür;
            // sadece dış kamerada gökyüzüne doğru çok uzaklaşıldığında (camera.position.y > 27.5) yarı saydamlaşır.
            const targetRoofOpacity = (!isFirstPerson && camera.position.y > 27.5) ? 0.14 : 1.0;
            for (let i = 0; i < roofFadeMaterials.length; i++) {
                const mat = roofFadeMaterials[i];
                mat.opacity = THREE.MathUtils.lerp(mat.opacity, targetRoofOpacity, 0.15);
                mat.depthWrite = mat.opacity > 0.5;
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
