        // ============================================================================
        // 5. MOBİL DOKUNMATİK KONTROLLER (JOYSTICK, 360° KAMERA VE KUŞBAKIŞI UZAKLAŞTIRMA)
        // ============================================================================
        function bindOpenWorldControls() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const maxR = 40;

            function updateJoy(cx, cy) {
                const rect = zone.getBoundingClientRect();
                let dx = cx - (rect.left + rect.width / 2);
                let dy = cy - (rect.top + rect.height / 2);
                const dist = Math.hypot(dx, dy);
                if (dist > maxR) {
                    dx = (dx / dist) * maxR;
                    dy = (dy / dist) * maxR;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyVec.x = dx / maxR;
                joyVec.y = dy / maxR;
            }

            zone.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                joyActive = true;
                joyPointerId = e.pointerId;
                updateJoy(e.clientX, e.clientY);
            });

            const canvas = renderer.domElement;
            canvas.style.touchAction = 'none';
            canvas.addEventListener('pointerdown', (e) => {
                canvas.setPointerCapture(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (joyActive && e.pointerId === joyPointerId) {
                    updateJoy(e.clientX, e.clientY);
                    return;
                }
                if (!activePointers.has(e.pointerId)) return;

                const prev = activePointers.get(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 1) {
                    camYaw -= (e.clientX - prev.x) * 0.008;
                    const isFpv = window.EgyptCameraSystem && window.EgyptCameraSystem.isFirstPerson;
                    if (isFpv) {
                        camPitch = Math.max(-1.42, Math.min(1.42, camPitch - (e.clientY - prev.y) * 0.0075));
                    } else {
                        camPitch = Math.max(-1.42, Math.min(1.42, camPitch + (e.clientY - prev.y) * 0.0065));
                    }
                } else if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinchDist > 0) {
                        desiredDist = Math.max(2.2, Math.min(310.0, desiredDist + (lastPinchDist - dist) * 0.18));
                    }
                    lastPinchDist = dist;
                }
            });

            function endPointer(e) {
                if (joyActive && e.pointerId === joyPointerId) {
                    joyActive = false;
                    joyPointerId = null;
                    joyVec.x = 0;
                    joyVec.y = 0;
                    knob.style.transform = 'translate(0px, 0px)';
                }
                activePointers.delete(e.pointerId);
                if (activePointers.size < 2) lastPinchDist = 0;
            }

            window.addEventListener('pointerup', endPointer);
            window.addEventListener('pointercancel', endPointer);

            window.addEventListener('wheel', (e) => {
                desiredDist = Math.max(2.2, Math.min(310.0, desiredDist + e.deltaY * 0.07));
            });

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (k === 's' || e.key === 'ArrowDown') keys.s = true;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (k === 's' || e.key === 'ArrowDown') keys.s = false;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================================================
        // 6. CANLI AÇIK DÜNYA ANİMASYON DÖNGÜSÜ (60 FPS OPTİMİZASYONLU)
        // ============================================================================
        const animDummy = new THREE.Object3D();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            let ix = joyVec.x;
            let iy = joyVec.y;
            if (keys.w) iy = -1;
            if (keys.s) iy = 1;
            if (keys.a) ix = -1;
            if (keys.d) ix = 1;

            const mag = Math.min(1, Math.hypot(ix, iy));
            const moving = mag > 0.05;

            // İlahi Tanrı Uçuşu & Ra'nın Güneş Gemisi Güncellemesi
            if (window.EgyptFlightEngine && player) {
                window.EgyptFlightEngine.update(player, delta, elapsed, camera);
            }

            const isFlying = window.EgyptFlightEngine && window.EgyptFlightEngine.isFlying;

            if (!isFlying) {
                if (moving && player) {
                    const fwdX = -Math.sin(camYaw);
                    const fwdZ = -Math.cos(camYaw);
                    const rightX = Math.cos(camYaw);
                    const rightZ = -Math.sin(camYaw);

                    const dirX = rightX * ix + fwdX * (-iy);
                    const dirZ = rightZ * ix + fwdZ * (-iy);

                    const walkSpeed = 7.8 * mag;
                    let nextX = Math.max(-175, Math.min(220, player.root.position.x + dirX * walkSpeed * delta));
                    let nextZ = Math.max(-210, Math.min(190, player.root.position.z + dirZ * walkSpeed * delta));

                    const inRiverX = nextX > 28.0 && nextX < 86.0;
                    const onBridgeZ = Math.abs(nextZ) < 5.4 || Math.abs(nextZ + 75) < 4.2 || Math.abs(nextZ - 75) < 4.2;
                    const onDockZ = nextX < 40.8 && (
                        Math.abs(nextZ + 112) < 3.0 || Math.abs(nextZ + 92) < 3.0 || Math.abs(nextZ + 52) < 3.0 || Math.abs(nextZ + 34) < 3.0 ||
                        Math.abs(nextZ - 34) < 3.0 || Math.abs(nextZ - 52) < 3.0 || Math.abs(nextZ - 94) < 3.0 || Math.abs(nextZ - 112) < 3.0
                    );

                    if (inRiverX && !onBridgeZ && !onDockZ) {
                        if (player.root.position.x <= 28.0) nextX = 28.0;
                        else if (player.root.position.x >= 86.0) nextX = 86.0;
                    }

                    // Fiziksel Katı Engel Kayma Çarpışması
                    if (window.EgyptCollisionEngine) {
                        const resolved = window.EgyptCollisionEngine.resolvePosition(
                            player.root.position,
                            { x: nextX, z: nextZ },
                            (player.scale || 1) * 0.45,
                            player.root.position.y
                        );
                        player.root.position.x = resolved.x;
                        player.root.position.z = resolved.z;
                    } else {
                        player.root.position.x = nextX;
                        player.root.position.z = nextZ;
                    }

                    const targetRot = Math.atan2(dirX, dirZ);
                    let diff = targetRot - player.root.rotation.y;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    player.root.rotation.y += diff * 0.18;
                }

                // Yerçekimi, Zıplama ve Manyetik Çekim Güncellemesi
                if (player && window.EgyptCollisionEngine) {
                    window.EgyptCollisionEngine.updatePhysics(player, delta);
                    window.EgyptCollisionEngine.updateMagneticDrops(player.root.position, delta, elapsed);
                }
            }

            // Savaş Saldırı Efektleri & Hasar Sayıları
            if (window.EgyptCombatEngine) {
                window.EgyptCombatEngine.update(delta, camera);
            }

            if (player && !isFlying) {
                if (window.EgyptCharacterEngine && player.pelvis) {
                    const animatePlayer = player.isFemale
                        ? window.EgyptCharacterEngine.animateFemaleCharacter
                        : window.EgyptCharacterEngine.animateEgyptCharacter;
                    animatePlayer(player, moving, mag, delta, elapsed);
                } else {
                    animateVillager(player, moving, mag, delta, elapsed);
                }
            }

            // Role-based city routines, nearby reactions, and conversation prompt.
            const px = player ? player.root.position.x : 0;
            const pz = player ? player.root.position.z : 0;
            let closestNpc = null;
            let closestNpcDistSq = Infinity;

            for (let i = 0; i < villagers.length; i++) {
                const v = villagers[i];
                const distToPlayerSq = (v.root.position.x - px) ** 2 + (v.root.position.z - pz) ** 2;
                if (distToPlayerSq < closestNpcDistSq) {
                    closestNpc = v;
                    closestNpcDistSq = distToPlayerSq;
                }

                if (v.aiWait > 0) {
                    v.aiWait -= delta;
                    if (v.persona === 'farmer' && v.workTimer > 0) {
                        v.workTimer = Math.max(0, v.workTimer - delta);
                        v.isGathering = v.workTimer > 0;
                        v.gatherType = 'harvest';
                    }
                    if (distToPlayerSq < 3600 && player) {
                        const lookYaw = Math.atan2(px - v.root.position.x, pz - v.root.position.z);
                        let lookDiff = lookYaw - v.root.rotation.y;
                        while (lookDiff > Math.PI) lookDiff -= Math.PI * 2;
                        while (lookDiff < -Math.PI) lookDiff += Math.PI * 2;
                        v.root.rotation.y += lookDiff * Math.min(1, delta * 2.2);
                        if (v.head) v.head.rotation.y = Math.sin(elapsed * 1.4 + i) * 0.08;
                    }
                    if (distToPlayerSq < 6400) {
                        const animateNpc = v.isFemale
                            ? window.EgyptCharacterEngine.animateFemaleCharacter
                            : window.EgyptCharacterEngine.animateEgyptCharacter;
                        animateNpc(v, false, 0, delta, elapsed, false);
                    }
                } else {
                    const dx = v.aiTarget.x - v.root.position.x;
                    const dz = v.aiTarget.z - v.root.position.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist < 0.8) {
                        v.aiWait = v.persona === 'thief' ? 0.8 + (i % 3) : 2 + (i % 5);
                        v.routeIndex = (v.routeIndex + 1) % v.route.length;
                        v.aiTarget.copy(v.route[v.routeIndex]);
                        v.workTimer = v.persona === 'farmer' ? 3 + (i % 4) : 0;
                        v.isGathering = false;
                    } else {
                        const spd = v.persona === 'thief' ? 2.7 : (v.persona === 'guard' ? 2.1 : 1.45 + (i % 3) * 0.2);
                        v.root.position.x += (dx / dist) * spd * delta;
                        v.root.position.z += (dz / dist) * spd * delta;
                        v.root.position.y = (v.root.position.x > 26 && v.root.position.x < 88 && Math.abs(v.root.position.z) < 5.4) ? 0.58 : 0.0;

                        const tRot = Math.atan2(dx, dz);
                        let dRot = tRot - v.root.rotation.y;
                        while (dRot > Math.PI) dRot -= Math.PI * 2;
                        while (dRot < -Math.PI) dRot += Math.PI * 2;
                        v.root.rotation.y += dRot * Math.min(1, delta * 2.8);
                        if (distToPlayerSq < 8500) {
                            const animateNpc = v.isFemale
                                ? window.EgyptCharacterEngine.animateFemaleCharacter
                                : window.EgyptCharacterEngine.animateEgyptCharacter;
                            animateNpc(v, true, spd / 2.4, delta, elapsed, false);
                        }
                    }
                }
            }

            nearestCityNpc = closestNpc && closestNpcDistSq < 4.8 ** 2 ? closestNpc : null;
            if (cityTalkPrompt) {
                cityTalkPrompt.classList.toggle('hidden', !nearestCityNpc);
                if (nearestCityNpc) {
                    cityTalkPrompt.textContent = `T · KONUŞ · ${nearestCityNpc.name} (${nearestCityNpc.title})`;
                }
            }

            // ==========================================
            // ULTRA-GERÇEKÇİ NİL NEHRİ GERSTNER DALGALARI VE AKIŞI
            // ==========================================
            if (waterPosAttr) {
                const wCount = waterPosAttr.count;
                for (let i = 0; i < wCount; i++) {
                    const wx = waterPosAttr.getX(i);
                    const wy = waterPosAttr.getY(i);

                    // 1. Ana Nehir Akıntı Dalgası (Büyük kütle akışı)
                    const w1 = Math.sin(wy * 0.085 - elapsed * 2.4 + wx * 0.04) * 0.15;
                    // 2. Çapraz Çöl Rüzgarı Kırışıklıkları
                    const w2 = Math.cos(wx * 0.28 + wy * 0.06 - elapsed * 3.2) * 0.08;
                    // 3. Gerstner Tepe Sivrilmesi (Köpüklenme eğilimi)
                    const peak = Math.pow(Math.max(0, (w1 + 0.15) / 0.30), 1.8) * 0.06;

                    waterPosAttr.setZ(i, w1 + w2 + peak);
                }
                waterPosAttr.needsUpdate = true;

                // Akıntı Normal ve Kostik Haritalarının Yönlü Akışı
                if (nileWaterMesh && nileWaterMesh.material.normalMap) {
                    nileWaterMesh.material.normalMap.offset.y -= delta * 0.18;
                    nileWaterMesh.material.normalMap.offset.x = Math.sin(elapsed * 0.4) * 0.04;
                }
            }

            // Kıyı Köpük Çizgilerinin Nabız Gibi Titreşimi
            for (let i = 0; i < shoreFoamMeshes.length; i++) {
                const fm = shoreFoamMeshes[i];
                fm.material.opacity = 0.45 + Math.sin(elapsed * 2.8 + i * 1.5) * 0.22;
                fm.scale.x = 0.90 + Math.sin(elapsed * 3.5 + i) * 0.18;
            }

            // Su Dolaplarından Dökülen Su Damlacıkları (Sakia Dripping Water Drops)
            if (waterDropsInst) {
                for (let i = 0; i < waterDropPositions.length; i++) {
                    const dp = waterDropPositions[i];
                    dp.y -= dp.speed * delta;
                    if (dp.y <= -0.25) {
                        dp.y = 3.2 + Math.random() * 0.9;
                    }
                    animDummy.position.set(dp.baseX, dp.y, dp.baseZ);
                    animDummy.scale.set(1, 1, 1);
                    animDummy.updateMatrix();
                    waterDropsInst.setMatrixAt(i, animDummy.matrix);
                }
                waterDropsInst.instanceMatrix.needsUpdate = true;
            }

            // Kutsal Mavi Nilüferlerin Su Üstünde Beşik Gibi Sallanması
            for (let i = 0; i < lotusClusters.length; i++) {
                const lc = lotusClusters[i];
                lc.position.y = -0.25 + Math.sin(elapsed * 2.2 + lc.userData.phase) * 0.04;
                lc.rotation.z = Math.sin(elapsed * 1.8 + lc.userData.phase) * 0.035;
                lc.rotation.x = Math.cos(elapsed * 1.6 + lc.userData.phase) * 0.035;
            }

            // ==========================================
            // ULTRA-GERÇEKÇİ NİL BUĞDAYI RÜZGAR DALGALANMASI VE OYUNCU AYIRMASI (TRAMPLING)
            // ==========================================
            if (wheatInst && wheatStalkData.length > 0) {
                const px = player ? player.root.position.x : 0;
                const pz = player ? player.root.position.z : 0;

                for (let i = 0; i < wheatStalkData.length; i++) {
                    const st = wheatStalkData[i];

                    // 1. Nil Vadisi Boyunca Akan Yönlü Rüzgar Dalgaları (Traveling Wind Wave)
                    const windAngle = (st.z * 0.075 + st.x * 0.038 - elapsed * 2.8);
                    const windWave = Math.sin(windAngle) * 0.18 + Math.sin(windAngle * 2.2 + st.phase) * 0.07;
                    const gust = Math.sin(elapsed * 6.5 + st.phase) * 0.04;

                    let rotX = windWave * 0.75;
                    let rotZ = (windWave + gust) * 0.95;

                    // 2. Oyuncu Yaklaştığında Buğdayların İki Yana Ayrılması (Player Trampling / Parting)
                    const dx = st.x - px;
                    const dz = st.z - pz;
                    const distSq = dx * dx + dz * dz;
                    if (distSq < 4.0) {
                        const dist = Math.sqrt(distSq);
                        const push = (1.0 - dist / 2.0) * 0.78;
                        rotX += (dz / (dist + 0.01)) * push;
                        rotZ += (dx / (dist + 0.01)) * push;
                    }

                    // Yumuşak yaylanma
                    st.tiltX = THREE.MathUtils.lerp(st.tiltX, rotX, 0.18);
                    st.tiltZ = THREE.MathUtils.lerp(st.tiltZ, rotZ, 0.18);

                    wheatAnimDummy.position.set(st.x, 0.02, st.z);
                    wheatAnimDummy.rotation.set(st.tiltX, st.baseRotY, st.tiltZ);
                    wheatAnimDummy.scale.set(st.scale, st.scale, st.scale);
                    wheatAnimDummy.updateMatrix();
                    wheatInst.setMatrixAt(i, wheatAnimDummy.matrix);
                }
                wheatInst.instanceMatrix.needsUpdate = true;
            }

            // Altın Buğday Tozu ve Polen Parçacıklarının Hareketi
            if (wheatPollenParticles) {
                const pPos = wheatPollenParticles.geometry.attributes.position;
                for (let i = 0; i < pPos.count; i++) {
                    let y = pPos.getY(i) + Math.sin(elapsed * 1.8 + i) * 0.012;
                    let x = pPos.getX(i) + Math.sin(elapsed * 0.8 + i) * 0.015;
                    pPos.setXYZ(i, x, y, pPos.getZ(i));
                }
                pPos.needsUpdate = true;
            }

            // Su Dolapları (Sakia), Shaduf Kaldıraçları, 24 Nil Gemisi ve Timsahlar
            for (let i = 0; i < waterWheels.length; i++) {
                waterWheels[i].rotation.z = -elapsed * 0.65;
            }
            for (let i = 0; i < shadufLevers.length; i++) {
                const s = shadufLevers[i];
                s.pivot.rotation.z = Math.sin(elapsed * 1.5 + s.phase) * 0.28;
            }
            for (let i = 0; i < waterfalls.length; i++) {
                waterfalls[i].scale.x = 0.92 + Math.sin(elapsed * 9.0 + i) * 0.12;
                waterfalls[i].scale.z = 0.92 + Math.cos(elapsed * 8.0 + i) * 0.12;
            }
            for (let i = 0; i < nileBoats.length; i++) {
                const b = nileBoats[i];
                const wave = (Math.sin(elapsed * b.speed + b.phase) + 1.0) * 0.5;
                const dir = Math.cos(elapsed * b.speed + b.phase) >= 0 ? 1 : -1;
                b.group.position.z = THREE.MathUtils.lerp(b.minZ, b.maxZ, wave);
                b.group.position.y = -0.22 + Math.sin(elapsed * 2.0 + b.phase) * 0.06;
                b.group.rotation.y = dir > 0 ? 0 : Math.PI;
                b.group.rotation.z = Math.sin(elapsed * 1.6 + b.phase) * 0.035;
                for (let j = 0; j < b.oars.length; j++) {
                    b.oars[j].mesh.rotation.x = Math.sin(elapsed * 3.2 + b.phase) * 0.35;
                }
            }
            for (let i = 0; i < crocodiles.length; i++) {
                const c = crocodiles[i];
                c.group.position.z = c.baseZ + Math.sin(elapsed * 0.45 + c.phase) * 5.5;
                c.tail.rotation.y = Math.sin(elapsed * 3.5 + c.phase) * 0.28;

                if (player && elapsed - (window.lastCrocHit || 0) > 1.8) {
                    const distToCroc = Math.hypot(player.root.position.x - c.group.position.x, player.root.position.z - c.group.position.z);
                    if (distToCroc < 3.4) {
                        window.lastCrocHit = elapsed;
                        window.GameState.takeDamage(20);
                        if (window.GameHUD) window.GameHUD.showToast('🐊 NİL TİMSAHI SALDIRDI! -20 CAN!', 'danger');
                    }
                }
            }

            // Tapınak Sancakları, Set Kulesi Halkaları ve Instanced Meşale Alevleri
            for (let i = 0; i < royalBanners.length; i++) {
                const b = royalBanners[i];
                b.mesh.rotation.x = Math.sin(elapsed * 2.6 + b.phase) * 0.08;
                b.mesh.rotation.z = Math.cos(elapsed * 2.0 + b.phase) * 0.04;
            }
            for (let i = 0; i < towerRings.length; i++) {
                const r = towerRings[i];
                r.mesh.rotation.y = elapsed * r.speed;
                r.mesh.rotation.x = Math.sin(elapsed * 0.5) * 0.35;
            }
            if (flameInst) {
                for (let i = 0; i < flameBasePositions.length; i++) {
                    const fp = flameBasePositions[i];
                    const s = fp.scale * (0.86 + Math.sin(elapsed * 11.0 + fp.phase) * 0.16);
                    animDummy.position.set(fp.x, fp.y, fp.z);
                    animDummy.rotation.set(0, elapsed * 3.0 + fp.phase, 0);
                    animDummy.scale.set(s, s * 1.3, s);
                    animDummy.updateMatrix();
                    flameInst.setMatrixAt(i, animDummy.matrix);
                }
                flameInst.instanceMatrix.needsUpdate = true;
            }

            // Gökyüzünde Süzülen 36 Altın Şahin
            for (let i = 0; i < circlingBirds.length; i++) {
                const b = circlingBirds[i];
                const ang = elapsed * b.speed + b.phase;
                b.group.position.set(
                    b.cx + Math.cos(ang) * b.radius,
                    b.height + Math.sin(elapsed * 1.5 + b.phase) * 1.2,
                    b.cz + Math.sin(ang) * b.radius
                );
                b.group.rotation.y = -ang;
                const flap = Math.sin(elapsed * 8.5 + b.phase) * 0.42;
                b.leftW.rotation.z = flap;
                b.rightW.rotation.z = -flap;
            }

            // Portalların Dönüşü ve Yakınlık Kontrolü
            if (window.realmPortals) {
                for (let i = 0; i < window.realmPortals.length; i++) {
                    const rp = window.realmPortals[i];
                    rp.cyl.rotation.y += delta * 1.2;
                    rp.cyl.material.opacity = 0.22 + Math.sin(elapsed * 2.8 + i) * 0.14;
                    if (player) {
                        const dist = Math.hypot(player.root.position.x - rp.data.x, player.root.position.z - rp.data.z);
                        if (dist < 3.2) {
                            if (!window.teleportingActive) {
                                window.teleportingActive = true;
                                if (window.GameHUD) window.GameHUD.showToast(`${rp.data.name} Portalı Aktif! Işınlanılıyor...`, 'gold');
                                setTimeout(() => {
                                    window.GameState.teleportTo(rp.data.file);
                                }, 600);
                            }
                        }
                    }
                }
            }

            // Altın Kan Toplama Kontrolü
            if (window.goldenBloodOrbs) {
                for (let i = window.goldenBloodOrbs.length - 1; i >= 0; i--) {
                    const orb = window.goldenBloodOrbs[i];
                    orb.mesh.rotation.y += delta * 2.5;
                    orb.mesh.position.y = 0.45 + Math.sin(elapsed * 4.5 + i) * 0.15;
                    if (player) {
                        const dist = Math.hypot(player.root.position.x - orb.mesh.position.x, player.root.position.z - orb.mesh.position.z);
                        if (dist < 2.5) {
                            scene.remove(orb.mesh);
                            window.goldenBloodOrbs.splice(i, 1);
                            window.GameState.addResource('golden_blood', 1);
                            window.GameState.gainExp(25);
                            if (window.GameHUD) window.GameHUD.showToast('+1 ALTIN KAN TOPLANDI! (Efsanevi Malzeme)', 'gold');
                        }
                    }
                }
            }

            // Altın Çöl Tozu Sürüklenişi ve Güneş Korona Halesi
            if (window.dustParticles && window.dustVelocities) {
                const pos = window.dustParticles.geometry.attributes.position;
                for (let i = 0; i < window.dustVelocities.length; i++) {
                    const vel = window.dustVelocities[i];
                    let x = pos.getX(i) + vel.vx;
                    let y = pos.getY(i) + Math.sin(elapsed + i) * 0.04;
                    let z = pos.getZ(i) + vel.vz;
                    if (x > 290) x = -290;
                    if (z > 290) z = -290;
                    if (z < -290) z = 290;
                    pos.setXYZ(i, x, y, z);
                }
                pos.needsUpdate = true;
            }
            if (window.sunFlareGroup) {
                window.sunFlareGroup.rotation.z += delta * 0.04;
            }

            // MMORPG Hasat, Madencilik ve Otomatik Görev / Kasılma Motoru
            if (window.EgyptGatheringEngine && player) {
                window.EgyptGatheringEngine.update(player, delta, elapsed);
            }
            if (window.interactiveNodeMeshes) {
                for (let i = 0; i < window.interactiveNodeMeshes.length; i++) {
                    const nm = window.interactiveNodeMeshes[i];
                    nm.ring.rotation.z += delta * 1.5;
                    nm.beam.material.opacity = 0.18 + Math.sin(elapsed * 3.5 + i) * 0.12;
                }
            }

            // Evrensel 1. Şahıs (FPV) & 3. Şahıs (TPV) Kamera Takibi
            if (window.EgyptCameraSystem && player) {
                window.EgyptCameraSystem.camYaw = camYaw;
                window.EgyptCameraSystem.camPitch = camPitch;
                window.EgyptCameraSystem.camDist = camDist;
                window.EgyptCameraSystem.desiredDist = desiredDist;
                window.EgyptCameraSystem.updateCamera(camera, player, moving, mag, delta, elapsed);
            } else if (player) {
                camDist = THREE.MathUtils.lerp(camDist, desiredDist, 0.12);
                const focusX = player.root.position.x;
                const focusY = player.root.position.y + 1.25;
                const focusZ = player.root.position.z;

                const cx = focusX + Math.sin(camYaw) * Math.cos(camPitch) * camDist;
                const cz = focusZ + Math.cos(camYaw) * Math.cos(camPitch) * camDist;
                const cy = Math.max(0.6, focusY + Math.sin(camPitch) * camDist);

                camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.22);
                camera.lookAt(focusX, focusY, focusZ);
            }

            renderer.render(scene, camera);
        }

        function npcZBounds(v) {
            return v.zoneBounds.maxZ;
        }

        window.onload = init;
    </script>
</body>
</html>
