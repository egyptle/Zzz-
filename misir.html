    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #160c05;
            font-family: system-ui, -apple-system, sans-serif;

            display: block;

            background: rgba(20, 12, 6, 0.55);

<body class="overflow-hidden">

    <!-- SADECE MOBİL YÜRÜME JOYSTICK (PC'de Gizlenir, Sadece Mobilde Görünür) -->
    <div id="joystick-zone" class="fixed bottom-6 left-6 w-32 h-32 joy-glass rounded-full flex items-center justify-center z-20 touch-none mmo-mobile-only">
        <div class="w-20 h-20 rounded-full border border-amber-400/25 pointer-events-none"></div>
        <div id="joystick-knob" class="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-700 via-amber-400 to-yellow-200 border-2 border-white/90 shadow-xl absolute pointer-events-none transition-transform duration-75"></div>
    </div>

    <script>
        let scene, camera, renderer, clock;
        let player = null;
        let villagers = [];
        let nearestCityNpc = null;
        let cityTalkPrompt = null;
        let nileWaterMesh = null;
        let waterPosAttr = null;
        let waterWheels = [];
        let shadufLevers = [];
        let waterfalls = [];
        let nileBoats = [];
        let crocodiles = [];
        let circlingBirds = [];
        let towerRings = [];
        let royalBanners = [];
        let swayingFrondsInst = null;
        let frondBaseMatrices = [];
        let flameInst = null;
        let flameBasePositions = [];
        let wheatInst = null;
        let wheatStalkData = [];
        let wheatAnimDummy = new THREE.Object3D();
        let reedInst = null;
        let waterCausticsMesh = null;
        let shoreFoamMeshes = [];
        let waterDropsInst = null;
        let waterDropPositions = [];
        let lotusClusters = [];
        let wheatPollenParticles = null;

        // Mobil Kontroller ve 360° Kamera (Yakınlaştırma / Uzaklaştırma)
        let joyActive = false;
        let joyPointerId = null;
        let joyVec = { x: 0, y: 0 };
        const keys = { w: false, a: false, s: false, d: false };

        let camYaw = 0.45;
        let camPitch = 0.24;
        let camDist = 8.0;
        let desiredDist = 8.0;
        const activePointers = new Map();
        let lastPinchDist = 0;

        // ============================================================================
        // 1. YÜKSEK DETAYLI PROSEDÜREL PBR DOKULAR (GODS OF EGYPT SİNEMATİK RENK PALETİ)
        // ============================================================================
        function buildOpenWorldTextures(rendererInstance) {
            // 1. Sinematik Günbatımı Mısır Gökyüzü HDRI Yansıma Haritası
            const envC = document.createElement('canvas');
            envC.width = 512; envC.height = 256;
            const eCtx = envC.getContext('2d');
            const skyGrad = eCtx.createLinearGradient(0, 0, 0, 256);
            skyGrad.addColorStop(0.0, '#071326');
            skyGrad.addColorStop(0.24, '#1b3b64');
            skyGrad.addColorStop(0.45, '#d97706');
            skyGrad.addColorStop(0.53, '#fef08a');
            skyGrad.addColorStop(0.62, '#92400e');
            skyGrad.addColorStop(1.0, '#140903');
            eCtx.fillStyle = skyGrad;
            eCtx.fillRect(0, 0, 512, 256);

            const sunGlow = eCtx.createRadialGradient(256, 118, 6, 256, 118, 125);
            sunGlow.addColorStop(0, 'rgba(255, 253, 230, 1.0)');
            sunGlow.addColorStop(0.35, 'rgba(251, 191, 36, 0.72)');
            sunGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            eCtx.fillStyle = sunGlow;
            eCtx.fillRect(0, 0, 512, 256);

            const rawEnv = new THREE.CanvasTexture(envC);
            rawEnv.mapping = THREE.EquirectangularReflectionMapping;
            const pmrem = new THREE.PMREMGenerator(rendererInstance);
            pmrem.compileEquirectangularShader();
            const envMap = pmrem.fromEquirectangular(rawEnv).texture;
            rawEnv.dispose();
            pmrem.dispose();

            // 2. Rüzgar Dalgalı Çöl Kumu Dokusu
            const sandC = document.createElement('canvas');
            sandC.width = 512; sandC.height = 512;
            const sCtx = sandC.getContext('2d');
            sCtx.fillStyle = '#d4a062';
            sCtx.fillRect(0, 0, 512, 512);
            for (let y = 0; y < 512; y += 3) {
                const wave = Math.sin(y * 0.09) * 14;
                sCtx.fillStyle = y % 6 === 0 ? 'rgba(145, 88, 34, 0.22)' : 'rgba(255, 236, 195, 0.16)';
                sCtx.fillRect(0, y + wave * 0.08, 512, 2);
            }
            for (let i = 0; i < 2200; i++) {
                sCtx.fillStyle = i % 2 === 0 ? 'rgba(85, 45, 15, 0.10)' : 'rgba(255, 245, 220, 0.10)';
                sCtx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }
            const sandTex = new THREE.CanvasTexture(sandC);
            sandTex.wrapS = THREE.RepeatWrapping;
            sandTex.wrapT = THREE.RepeatWrapping;
            sandTex.repeat.set(75, 75);

            // 3. Anıtsal Kraliyet Mermer / Kireçtaşı Meydan Döşemesi Dokusu
            const stoneC = document.createElement('canvas');
            stoneC.width = 512; stoneC.height = 512;
            const stCtx = stoneC.getContext('2d');
            stCtx.fillStyle = '#d2a673';
            stCtx.fillRect(0, 0, 512, 512);
            for (let y = 0; y < 512; y += 64) {
                const offset = (y / 64) % 2 === 0 ? 0 : 32;
                for (let x = 0; x < 512; x += 64) {
                    stCtx.fillStyle = ((x + y) / 64) % 2 === 0 ? 'rgba(255, 238, 200, 0.18)' : 'rgba(130, 80, 32, 0.14)';
                    stCtx.fillRect((x + offset) % 512, y, 62, 62);
                }
            }
            stCtx.strokeStyle = 'rgba(72, 42, 16, 0.42)';
            stCtx.lineWidth = 2;
            for (let y = 0; y < 512; y += 64) {
                stCtx.beginPath(); stCtx.moveTo(0, y); stCtx.lineTo(512, y); stCtx.stroke();
                const offset = (y / 64) % 2 === 0 ? 0 : 32;
                for (let x = offset; x < 512; x += 64) {
                    stCtx.beginPath(); stCtx.moveTo(x, y); stCtx.lineTo(x, y + 64); stCtx.stroke();
                }
            }
            const stoneTex = new THREE.CanvasTexture(stoneC);
            stoneTex.wrapS = THREE.RepeatWrapping;
            stoneTex.wrapT = THREE.RepeatWrapping;
            stoneTex.repeat.set(32, 32);

            // 4. Gerçekçi Antik Mısır Bina Cephesi Dokusu (Renkli Friz Şeridi, Kesme Taş ve Ahşap Kafesli)
            const mudC = document.createElement('canvas');
            mudC.width = 512; mudC.height = 512;
            const mCtx = mudC.getContext('2d');
            mCtx.fillStyle = '#c89662';
            mCtx.fillRect(0, 0, 512, 512);
            for (let y = 0; y < 512; y += 24) {
                mCtx.fillStyle = (y / 24) % 2 === 0 ? 'rgba(255, 235, 200, 0.08)' : 'rgba(95, 52, 18, 0.08)';
                mCtx.fillRect(0, y, 512, 24);
                mCtx.strokeStyle = 'rgba(75, 42, 16, 0.25)';
                mCtx.lineWidth = 2;
                mCtx.beginPath(); mCtx.moveTo(0, y); mCtx.lineTo(512, y); mCtx.stroke();
                const off = (y / 24) % 2 === 0 ? 0 : 32;
                for (let x = off; x < 512; x += 64) {
                    mCtx.beginPath(); mCtx.moveTo(x, y); mCtx.lineTo(x, y + 24); mCtx.stroke();
                }
            }
            // Üst Kısımda Antik Mısır Renkli Tapınak/Ev Friz Bandı (Kheker Frieze)
            mCtx.fillStyle = '#78350f';
            mCtx.fillRect(0, 0, 512, 46);
            const friezeColors = ['#d97706', '#0d9488', '#1e3a8a', '#b91c1c'];
            for (let x = 0; x < 512; x += 16) {
                mCtx.fillStyle = friezeColors[(x / 16) % 4];
                mCtx.fillRect(x + 2, 6, 12, 34);
            }
            mCtx.fillStyle = '#fbbf24';
            mCtx.fillRect(0, 42, 512, 6);
            // Alt Süpürgelik Taş Kuşağı
            mCtx.fillStyle = '#9a6b3e';
            mCtx.fillRect(0, 440, 512, 72);
            // Zarif Sıcak Işıklı Ahşap Mashrabiya Kafes Pencereler
            for (let wx = 72; wx < 450; wx += 160) {
                mCtx.fillStyle = '#5c2d12';
                mCtx.fillRect(wx - 6, 130, 68, 92);
                mCtx.fillStyle = '#b45309';
                mCtx.fillRect(wx, 136, 56, 80);
                mCtx.strokeStyle = '#fde047';
                mCtx.lineWidth = 2;
                for (let gx = wx; gx <= wx + 56; gx += 14) {
                    mCtx.beginPath(); mCtx.moveTo(gx, 136); mCtx.lineTo(gx, 216); mCtx.stroke();
                }
                for (let gy = 136; gy <= 216; gy += 16) {
                    mCtx.beginPath(); mCtx.moveTo(wx, gy); mCtx.lineTo(wx + 56, gy); mCtx.stroke();
                }
            }
            const mudTex = new THREE.CanvasTexture(mudC);
            mudTex.wrapS = THREE.RepeatWrapping;
            mudTex.wrapT = THREE.RepeatWrapping;

            // 5. Piramitler ve Kanyon Duvarları İçin Özel İnce Kireçtaşı Blok Dokusu
            const pyrC = document.createElement('canvas');
            pyrC.width = 512; pyrC.height = 512;
            const pCtx = pyrC.getContext('2d');
            pCtx.fillStyle = '#d1a36b';
            pCtx.fillRect(0, 0, 512, 512);
            for (let y = 0; y < 512; y += 16) {
                pCtx.fillStyle = (y / 16) % 2 === 0 ? 'rgba(255, 240, 205, 0.14)' : 'rgba(120, 72, 28, 0.14)';
                pCtx.fillRect(0, y, 512, 16);
                pCtx.strokeStyle = 'rgba(78, 44, 16, 0.45)';
                pCtx.lineWidth = 1.5;
                mLine(pCtx, 0, y, 512, y);
                const off = (y / 16) % 2 === 0 ? 0 : 16;
                for (let x = off; x < 512; x += 32) {
                    mLine(pCtx, x, y, x, y + 16);
                }
            }
            const pyrTex = new THREE.CanvasTexture(pyrC);
            pyrTex.wrapS = THREE.RepeatWrapping;
            pyrTex.wrapT = THREE.RepeatWrapping;
            pyrTex.repeat.set(14, 14);

            // 6. Altın Kakmalı Hiyeroglif Tapınak Duvarı Dokusu
            const hieroC = document.createElement('canvas');
            hieroC.width = 512; hieroC.height = 512;
            const hCtx = hieroC.getContext('2d');
            hCtx.fillStyle = '#c99a64';
            hCtx.fillRect(0, 0, 512, 512);
            hCtx.strokeStyle = 'rgba(62, 34, 10, 0.45)';
            hCtx.lineWidth = 3;
            for (let y = 32; y < 512; y += 32) {
                mLine(hCtx, 0, y, 512, y);
                for (let x = 16; x < 512; x += 32) {
                    hCtx.fillStyle = (x + y) % 64 === 0 ? 'rgba(245, 185, 35, 0.55)' : 'rgba(82, 44, 14, 0.45)';
                    hCtx.fillRect(x, y - 22, 6, 14);
                    hCtx.fillRect(x + 10, y - 18, 10, 4);
                }
            }
            const hieroTex = new THREE.CanvasTexture(hieroC);
            hieroTex.wrapS = THREE.RepeatWrapping;
            hieroTex.wrapT = THREE.RepeatWrapping;
            hieroTex.repeat.set(3, 3);

            // 7. 24K Parlak Mısır Altını Dokusu
            const goldC = document.createElement('canvas');
            goldC.width = 256; goldC.height = 256;
            const gCtx = goldC.getContext('2d');
            const gGrad = gCtx.createLinearGradient(0, 0, 256, 256);
            gGrad.addColorStop(0.0, '#fef08a');
            gGrad.addColorStop(0.35, '#f59e0b');
            gGrad.addColorStop(0.75, '#b45309');
            gGrad.addColorStop(1.0, '#fde047');
            gCtx.fillStyle = gGrad;
            gCtx.fillRect(0, 0, 256, 256);
            const goldTex = new THREE.CanvasTexture(goldC);

            // 8. Dokuma Kraliyet Kumaşı / Pazar Tentesi Dokusu
            const rugC = document.createElement('canvas');
            rugC.width = 256; rugC.height = 256;
            const rCtx = rugC.getContext('2d');
            rCtx.fillStyle = '#881313';
            rCtx.fillRect(0, 0, 256, 256);
            for (let y = 0; y < 256; y += 32) {
                rCtx.fillStyle = y % 64 === 0 ? '#d97706' : '#1e3a8a';
                rCtx.fillRect(0, y, 256, 6);
                rCtx.fillStyle = 'rgba(254, 240, 138, 0.7)';
                rCtx.fillRect(0, y + 8, 256, 2);
            }
            const rugTex = new THREE.CanvasTexture(rugC);
            rugTex.wrapS = THREE.RepeatWrapping;
            rugTex.wrapT = THREE.RepeatWrapping;

            // 9. Bereketli Nil Alüvyon ve Çimen Dokusu
            const grassC = document.createElement('canvas');
            grassC.width = 256; grassC.height = 256;
            const grCtx = grassC.getContext('2d');
            grCtx.fillStyle = '#2d5a27';
            grCtx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 1500; i++) {
                grCtx.fillStyle = i % 2 === 0 ? 'rgba(65, 115, 45, 0.35)' : 'rgba(40, 28, 16, 0.25)';
                grCtx.fillRect(Math.random() * 256, Math.random() * 256, 3, 3);
            }
            const grassTex = new THREE.CanvasTexture(grassC);
            grassTex.wrapS = THREE.RepeatWrapping;
            grassTex.wrapT = THREE.RepeatWrapping;
            grassTex.repeat.set(12, 60);

            // 10. Pilili Keten ve Yelken Kumaşı Dokusu
            const linenC = document.createElement('canvas');
            linenC.width = 256; linenC.height = 256;
            const lCtx = linenC.getContext('2d');
            lCtx.fillStyle = '#f3ead8';
            lCtx.fillRect(0, 0, 256, 256);
            for (let x = 0; x < 256; x += 8) {
                lCtx.fillStyle = x % 16 === 0 ? 'rgba(120, 90, 55, 0.20)' : 'rgba(255, 252, 245, 0.45)';
                lCtx.fillRect(x, 0, 4, 256);
            }
            lCtx.fillStyle = '#b45309';
            lCtx.fillRect(0, 226, 256, 12);
            lCtx.fillStyle = '#0d9488';
            lCtx.fillRect(0, 238, 256, 8);
            const linenTex = new THREE.CanvasTexture(linenC);

            // 11. Köylü Gövde ve Cilt Dokusu
            const torsoC = document.createElement('canvas');
            torsoC.width = 256; torsoC.height = 256;
            const tCtx = torsoC.getContext('2d');
            tCtx.fillStyle = '#b8734b';
            tCtx.fillRect(0, 0, 256, 256);
            const pecG = tCtx.createRadialGradient(128, 95, 6, 128, 110, 75);
            pecG.addColorStop(0, 'rgba(225, 162, 122, 0.35)');
            pecG.addColorStop(1, 'rgba(85, 40, 18, 0.25)');
            tCtx.fillStyle = pecG;
            tCtx.fillRect(0, 0, 256, 256);
            const skinTex = new THREE.CanvasTexture(torsoC);

            // 12. Nil Nehri Güneş Kırılma Kostikleri Dokusu (Water Caustics)
            const caustC = document.createElement('canvas');
            caustC.width = 512; caustC.height = 512;
            const cCtx = caustC.getContext('2d');
            cCtx.fillStyle = '#064e43';
            cCtx.fillRect(0, 0, 512, 512);

            // Çift katmanlı Voronoi / Hücresel Işık Ağı
            cCtx.strokeStyle = 'rgba(217, 249, 157, 0.55)';
            cCtx.lineWidth = 3.5;
            for (let i = 0; i < 48; i++) {
                const cx = (i * 73) % 512;
                const cy = (i * 109) % 512;
                const r = 24 + ((i * 17) % 36);
                cCtx.beginPath();
                for (let a = 0; a <= Math.PI * 2; a += Math.PI / 4) {
                    const wa = a + Math.sin(a * 3 + i) * 0.35;
                    const px = cx + Math.cos(wa) * r;
                    const py = cy + Math.sin(wa) * r;
                    if (a === 0) cCtx.moveTo(px, py);
                    else cCtx.lineTo(px, py);
                }
                cCtx.closePath();
                cCtx.stroke();
            }
            cCtx.strokeStyle = 'rgba(254, 240, 138, 0.42)';
            cCtx.lineWidth = 2.0;
            for (let i = 0; i < 36; i++) {
                const cx = ((i * 97) + 25) % 512;
                const cy = ((i * 83) + 40) % 512;
                const r = 18 + ((i * 13) % 28);
                cCtx.beginPath();
                for (let a = 0; a <= Math.PI * 2; a += Math.PI / 3) {
                    const px = cx + Math.cos(a) * r;
                    const py = cy + Math.sin(a) * r;
                    if (a === 0) cCtx.moveTo(px, py);
                    else cCtx.lineTo(px, py);
                }
                cCtx.closePath();
                cCtx.stroke();
            }
            const waterCausticsTex = new THREE.CanvasTexture(caustC);
            waterCausticsTex.wrapS = THREE.RepeatWrapping;
            waterCausticsTex.wrapT = THREE.RepeatWrapping;
            waterCausticsTex.repeat.set(4, 32);

            // 13. Nil Sıvı Akış ve Dalga Normal Haritası
            const normC = document.createElement('canvas');
            normC.width = 256; normC.height = 256;
            const nCtx = normC.getContext('2d');
            const nImg = nCtx.createImageData(256, 256);
            for (let y = 0; y < 256; y++) {
                for (let x = 0; x < 256; x++) {
                    const idx = (y * 256 + x) * 4;
                    const nx = Math.sin(x * 0.15 + y * 0.08) * 0.5 + 0.5;
                    const ny = Math.cos(y * 0.12 - x * 0.06) * 0.5 + 0.5;
                    nImg.data[idx] = Math.floor(nx * 255);
                    nImg.data[idx + 1] = Math.floor(ny * 255);
                    nImg.data[idx + 2] = 235;
                    nImg.data[idx + 3] = 255;
                }
            }
            nCtx.putImageData(nImg, 0, 0);
            const waterNormalTex = new THREE.CanvasTexture(normC);
            waterNormalTex.wrapS = THREE.RepeatWrapping;
            waterNormalTex.wrapT = THREE.RepeatWrapping;
            waterNormalTex.repeat.set(6, 48);

            // 14. Kutsal Nil Mavi Nilüferi (Blue Lotus) Yaprak Dokusu
            const lotPadC = document.createElement('canvas');
            lotPadC.width = 128; lotPadC.height = 128;
            const lpCtx = lotPadC.getContext('2d');
            lpCtx.fillStyle = '#065f46';
            lpCtx.beginPath();
            lpCtx.arc(64, 64, 58, 0.25, Math.PI * 2 - 0.25);
            lpCtx.lineTo(64, 64);
            lpCtx.closePath();
            lpCtx.fill();
            lpCtx.strokeStyle = '#34d399';
            lpCtx.lineWidth = 1.8;
            for (let a = 0.4; a < Math.PI * 2 - 0.4; a += Math.PI / 4) {
                lpCtx.beginPath();
                lpCtx.moveTo(64, 64);
                lpCtx.lineTo(64 + Math.cos(a) * 54, 64 + Math.sin(a) * 54);
                lpCtx.stroke();
            }
            const lotusPadTex = new THREE.CanvasTexture(lotPadC);

            // 15. Antik Mısır Altın Emmer Buğday Başağı Dokusu
            const wheatC = document.createElement('canvas');
            wheatC.width = 128; wheatC.height = 256;
            const whCtx = wheatC.getContext('2d');
            whCtx.fillStyle = '#d97706';
            whCtx.fillRect(0, 0, 128, 256);
            for (let y = 8; y < 250; y += 14) {
                const off = (y / 14) % 2 === 0 ? 12 : 36;
                for (let x = 8; x < 120; x += 32) {
                    whCtx.fillStyle = '#fde047';
                    whCtx.beginPath();
                    whCtx.ellipse(x + off, y, 9, 6, 0.2, 0, Math.PI * 2);
                    whCtx.fill();
                    whCtx.strokeStyle = '#92400e';
                    whCtx.lineWidth = 1.2;
                    whCtx.stroke();
                }
            }
            const wheatEarTex = new THREE.CanvasTexture(wheatC);

            return { envMap, sandTex, stoneTex, mudTex, pyrTex, hieroTex, goldTex, rugTex, grassTex, linenTex, skinTex, waterCausticsTex, waterNormalTex, lotusPadTex, wheatEarTex };
        }

        function mLine(ctx, x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        // ============================================================================
        // 2. PAYLAŞIMLI GEOMETRİLİ ANATOMİK KÖYLÜ / MUHAFIZ / SU TAŞIYICI MOTORU (60 FPS)
        // ============================================================================
        let sharedCharGeos = null;
        let sharedCharMats = null;

        function initSharedCharacterAssets() {
            const torsoGeo = new THREE.CylinderGeometry(1, 1, 0.62, 20, 12, false);
            const pos = torsoGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
                const t = (vy + 0.31) / 0.62;
                const ang = Math.atan2(vx, vz);
                let rx = 0.14, rz = 0.10;
                if (t < 0.25) {
                    rx = THREE.MathUtils.lerp(0.14, 0.13, t / 0.25);
                    rz = THREE.MathUtils.lerp(0.10, 0.095, t / 0.25);
                } else if (t < 0.74) {
                    const k = (t - 0.25) / 0.49;
                    rx = THREE.MathUtils.lerp(0.13, 0.185, Math.sin(k * Math.PI * 0.5));
                    rz = THREE.MathUtils.lerp(0.095, 0.125, k);
                } else {
                    const k = (t - 0.74) / 0.26;
                    rx = THREE.MathUtils.lerp(0.185, 0.062, k);
                    rz = THREE.MathUtils.lerp(0.125, 0.060, k);
                }

        function animateVillager(char, moving, speedMag, delta, elapsed) {
            if (moving) {
                char.walkPhase += delta * (7.0 * Math.max(0.45, speedMag));
                const p = char.walkPhase;
                const s = Math.sin(p);
                const os = Math.sin(p + Math.PI);

                char.hips.position.y = 0.92 + Math.abs(Math.cos(p)) * 0.028;
                char.torso.rotation.y = -s * 0.11;
                char.torso.rotation.x = 0.04;

                char.legs.left.hip.rotation.x = s * 0.58;
                char.legs.right.hip.rotation.x = os * 0.58;
                char.legs.left.knee.rotation.x = Math.max(0, -Math.cos(p) * 0.65);
                char.legs.right.knee.rotation.x = Math.max(0, -Math.cos(p + Math.PI) * 0.65);

                if (char.role === 'carrier') {
                    char.arms.left.shoulder.rotation.x = -2.4;
                    char.arms.left.elbow.rotation.x = -1.1;
                    char.arms.right.shoulder.rotation.x = s * 0.35;
                    char.arms.right.elbow.rotation.x = -0.22;
                } else {
                    char.arms.left.shoulder.rotation.x = os * 0.42;
                    char.arms.right.shoulder.rotation.x = s * 0.42;
                    char.arms.left.elbow.rotation.x = -0.22 - Math.max(0, os) * 0.2;
                    char.arms.right.elbow.rotation.x = -0.22 - Math.max(0, s) * 0.2;
                }
            } else {
                const breath = Math.sin(elapsed * 2.2 + char.walkPhase);
                char.hips.position.y = THREE.MathUtils.lerp(char.hips.position.y, 0.92 + breath * 0.008, 0.15);
                char.torso.rotation.y = THREE.MathUtils.lerp(char.torso.rotation.y, 0, 0.15);
                char.torso.rotation.x = THREE.MathUtils.lerp(char.torso.rotation.x, breath * 0.015, 0.15);

                char.legs.left.hip.rotation.x = THREE.MathUtils.lerp(char.legs.left.hip.rotation.x, 0, 0.15);
                char.legs.right.hip.rotation.x = THREE.MathUtils.lerp(char.legs.right.hip.rotation.x, 0, 0.15);
                char.legs.left.knee.rotation.x = THREE.MathUtils.lerp(char.legs.left.knee.rotation.x, 0, 0.15);
                char.legs.right.knee.rotation.x = THREE.MathUtils.lerp(char.legs.right.knee.rotation.x, 0, 0.15);

                char.arms.left.shoulder.rotation.x = THREE.MathUtils.lerp(char.arms.left.shoulder.rotation.x, 0.03, 0.15);
                char.arms.right.shoulder.rotation.x = THREE.MathUtils.lerp(char.arms.right.shoulder.rotation.x, -0.03, 0.15);
                char.arms.left.elbow.rotation.x = -0.16;
                char.arms.right.elbow.rotation.x = -0.16;
            }
        }

        // 3. ULTRA GERÇEKÇİ GEOMETRİ BİRLEŞTİRİCİ, ANATOMİK BUĞDAY VE KUTSAL MAVİ NİLÜFER

        function mergeBufferGeometries(geos) {
            let totalVerts = 0;
            let totalIndices = 0;
            for (const g of geos) {
                totalVerts += g.attributes.position.count;
                if (g.index) totalIndices += g.index.count;
                else totalIndices += g.attributes.position.count;
            }

            const positions = new Float32Array(totalVerts * 3);
            const normals = new Float32Array(totalVerts * 3);
            const uvs = new Float32Array(totalVerts * 2);
            const indices = [];

            let vertOffset = 0;

            for (const g of geos) {
                const pos = g.attributes.position;
                const norm = g.attributes.normal;
                const uv = g.attributes.uv;
                const count = pos.count;

                for (let i = 0; i < count; i++) {
                    positions[(vertOffset + i) * 3] = pos.getX(i);
                    positions[(vertOffset + i) * 3 + 1] = pos.getY(i);
                    positions[(vertOffset + i) * 3 + 2] = pos.getZ(i);

                    if (norm) {
                        normals[(vertOffset + i) * 3] = norm.getX(i);
                        normals[(vertOffset + i) * 3 + 1] = norm.getY(i);
                        normals[(vertOffset + i) * 3 + 2] = norm.getZ(i);
                    } else {
                        normals[(vertOffset + i) * 3 + 1] = 1.0;
                    }

                    if (uv) {
                        uvs[(vertOffset + i) * 2] = uv.getX(i);
                        uvs[(vertOffset + i) * 2 + 1] = uv.getY(i);
                    }
                }

                if (g.index) {
                    for (let j = 0; j < g.index.count; j++) {
                        indices.push(g.index.getX(j) + vertOffset);
                    }
                } else {
                    for (let j = 0; j < count; j++) {
                        indices.push(j + vertOffset);
                    }
                }

                vertOffset += count;
            }

            const merged = new THREE.BufferGeometry();
            merged.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            merged.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
            merged.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
            merged.setIndex(indices);
            return merged;
        }

        // Filmdeki Gibi Anatomik Antik Mısır Kılçıklı Emmer Buğdayı (Triticum dicoccum)
        function createEmmerWheatGeometry() {
            // 1. İnce ve bükülgen altın sap
            const stalk = new THREE.CylinderGeometry(0.018, 0.038, 1.18, 5);
            stalk.translate(0, 0.59, 0);

            // 2. Yan yapraklar (kavisli buğday yaprakları)

            leaf1.rotateZ(0.48);
            leaf1.translate(0.14, 0.52, 0);

            const leaf2 = new THREE.ConeGeometry(0.040, 0.38, 3);
            leaf2.rotateZ(-0.42);
            leaf2.rotateY(Math.PI * 0.7);
            leaf2.translate(-0.12, 0.72, 0.04);

            // 3. Dolgun, ağır kavisli Emmer Buğday Başağı (Ear)
            const ear = new THREE.CylinderGeometry(0.052, 0.075, 0.48, 6);
            ear.rotateZ(0.18);
            ear.translate(0.07, 1.30, 0);

            // 4. Uzun altın kılçıklar (Awns) - Güneşi yansıtan iğneler
            const awn1 = new THREE.CylinderGeometry(0.005, 0.002, 0.42, 3);
            awn1.rotateZ(0.28);
            awn1.translate(0.14, 1.62, 0);

            const awn2 = new THREE.CylinderGeometry(0.005, 0.002, 0.38, 3);
            awn2.rotateZ(-0.20);
            awn2.rotateY(0.8);
            awn2.translate(0.02, 1.58, 0.08);

            const awn3 = new THREE.CylinderGeometry(0.005, 0.002, 0.35, 3);
            awn3.rotateX(0.22);
            awn3.translate(0.06, 1.56, -0.07);

            const awn4 = new THREE.CylinderGeometry(0.004, 0.002, 0.34, 3);
            awn4.rotateZ(0.12);
            awn4.rotateX(-0.18);
            awn4.translate(0.08, 1.55, 0.05);

            return mergeBufferGeometries([stalk, leaf1, leaf2, ear, awn1, awn2, awn3, awn4]);
        }

            });

            });

            const lushGrassMat = new THREE.MeshStandardMaterial({
                map: window.textures.grassTex,
                roughness: 0.82
            });

            // Ateş Sunakları (Braziers) İçin GPU Instanced Liste
            const brazierPositions = [];
            function registerBrazier(x, y, z, scale = 1.0) {
                brazierPositions.push({ x, y, z, scale });
            }

            // ------------------------------------------------------------------------
            // A. 900x900m ANA KITA, GERÇEK KANYON / MESA SIRADAĞLARI VE DALGALANAN NİL NEHRİ
            // ------------------------------------------------------------------------
            const westLand = new THREE.Mesh(new THREE.BoxGeometry(560, 4.0, 920), sandMat);
            westLand.position.set(-252, -2.0, 0);
            westLand.receiveShadow = true;
            worldGroup.add(westLand);

            const eastLand = new THREE.Mesh(new THREE.BoxGeometry(560, 4.0, 920), sandMat);
            eastLand.position.set(366, -2.0, 0);
            eastLand.receiveShadow = true;
            worldGroup.add(eastLand);

            // Sivri Koniler Yerine Katmanlı Teb Mesa Kanyon Dağları ve Çöl Sırtları
            const mesaMat = new THREE.MeshStandardMaterial({
                color: 0xb8763e,
                map: window.textures.pyrTex,
                roughness: 0.90
            });
            const mesaBaseGeo = new THREE.CylinderGeometry(16, 34, 18, 7);
            const mesaMidGeo = new THREE.CylinderGeometry(11, 22, 16, 7);
            const mesaTopGeo = new THREE.CylinderGeometry(7, 14, 12, 7);
            const mesaBaseInst = new THREE.InstancedMesh(mesaBaseGeo, mesaMat, 90);
            const mesaMidInst = new THREE.InstancedMesh(mesaMidGeo, mesaMat, 90);
            const mesaTopInst = new THREE.InstancedMesh(mesaTopGeo, sandMat, 90);
            let mIdx = 0;

            for (let i = 0; i < 72; i++) {
                const ang = (i / 72) * Math.PI * 2;
                const cx = 40 + Math.cos(ang) * 355;
                const cz = Math.sin(ang) * 375;
                // Nil Nehri Boğazını ve Güney Kamera Bakış Açısını Açık Bırak
                if (cx > 5 && cx < 110) continue;
                if (cz > 120 && Math.abs(cx) < 120) continue;

                const sx = 1.4 + (i % 4) * 0.45;
                const sy = 0.9 + (i % 3) * 0.35;
                const sz = 1.3 + (i % 5) * 0.40;

                dummy.position.set(cx, 9 * sy, cz);
                dummy.rotation.set(0, i * 0.9, 0);
                dummy.scale.set(sx, sy, sz);
                dummy.updateMatrix();

                mesaMidInst.setMatrixAt(mIdx, dummy.matrix);

                dummy.position.set(cx - 1, 36 * sy, cz + 1);

                mesaBaseInst.setMatrixAt(mIdx, dummy.matrix);

                dummy.position.set(-188, 28, zCliff);
                dummy.scale.set(1.25, 1.15, 1.35);

                mesaMidInst.setMatrixAt(mIdx, dummy.matrix);

                dummy.position.set(-190, 42, zCliff);
                dummy.scale.set(1.0, 1.0, 1.1);
                dummy.updateMatrix();
                mesaTopInst.setMatrixAt(mIdx, dummy.matrix);
                mIdx++;
            }
            mesaBaseInst.count = mIdx;
            mesaMidInst.count = mIdx;

                const archOut = fy * 0.88;
                const archUp = Math.sin(normY * Math.PI * 0.85) * 0.75 - Math.pow(normY, 2.2) * 1.15;
                fPos.setXYZ(i, archOut, archUp, fx * leafWidth);
            }
            frondGeo.computeVertexNormals();

            const leafMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.62, side: THREE.DoubleSide });
            swayingFrondsInst = new THREE.InstancedMesh(frondGeo, leafMat, totalPalms * 9);
            frondBaseMatrices = [];

            let fIdx = 0;
            palmLocations.forEach(([px, pz], idx) => {
                const s = 0.85 + (idx % 5) * 0.11;
                const rotTreeY = idx * 1.1;
                dummy.position.set(px, 0, pz);
                dummy.rotation.set(0, rotTreeY, 0);
                dummy.scale.setScalar(s);
                dummy.updateMatrix();
                palmTrunkInst.setMatrixAt(idx, dummy.matrix);

                const topY = 6.2 * s;
                const topX = px + Math.cos(rotTreeY) * (0.55 * s);
                const topZ = pz - Math.sin(rotTreeY) * (0.55 * s);

                for (let f = 0; f < 9; f++) {
                    const ang = (f / 9) * Math.PI * 2 + idx * 0.4;
                    dummy.position.set(topX, topY, topZ);
                    dummy.rotation.set((f % 2) * 0.12, ang, 0);
                    dummy.scale.setScalar(s);
                    dummy.updateMatrix();
                    swayingFrondsInst.setMatrixAt(fIdx, dummy.matrix);
                    frondBaseMatrices.push({ x: topX, y: topY, z: topZ, ang, scale: s, phase: idx * 0.5 + f });
                    fIdx++;
                }
            });
            worldGroup.add(palmTrunkInst, swayingFrondsInst);

            // Tüm Ateş Sunaklarını (Braziers) Tek GPU InstancedMesh Olarak Oluştur
            const bStandGeo = new THREE.CylinderGeometry(0.24, 0.42, 1.5, 6);
            bStandGeo.translate(0, 0.75, 0);
            const bStandInst = new THREE.InstancedMesh(bStandGeo, goldMat, brazierPositions.length);
            const flameGeo = new THREE.OctahedronGeometry(0.38, 1);
            flameInst = new THREE.InstancedMesh(flameGeo, new THREE.MeshBasicMaterial({ color: 0xff6b00 }), brazierPositions.length);
            flameBasePositions = [];

            brazierPositions.forEach((b, i) => {
                dummy.position.set(b.x, b.y, b.z);
                dummy.rotation.set(0, 0, 0);
                dummy.scale.setScalar(b.scale);
                dummy.updateMatrix();
                bStandInst.setMatrixAt(i, dummy.matrix);

                const fy = b.y + 1.65 * b.scale;
                dummy.position.set(b.x, fy, b.z);
                dummy.updateMatrix();
                flameInst.setMatrixAt(i, dummy.matrix);
                flameBasePositions.push({ x: b.x, y: fy, z: b.z, scale: b.scale, phase: i * 0.7 });
            });
            worldGroup.add(bStandInst, flameInst);

            // Gökyüzünde Tapınak, Köy, Saray ve Nil Üzerinde Süzülen 36 Altın Şahin / İbis Kuşu
            circlingBirds = [];
            for (let b = 0; b < 36; b++) {
                const birdGroup = new THREE.Group();
                worldGroup.add(birdGroup);

                const bBody = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.75, 5), goldMat);
                bBody.rotation.x = Math.PI / 2;
                birdGroup.add(bBody);

                const leftW = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.04, 0.32), goldMat);
                leftW.position.x = -0.55;
                birdGroup.add(leftW);

                const rightW = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.04, 0.32), goldMat);
                rightW.position.x = 0.55;
                birdGroup.add(rightW);

                circlingBirds.push({
                    group: birdGroup,
                    leftW,
                    rightW,
                    cx: (b % 4 === 0) ? 57 : (b % 3 === 0 ? -82 : (b % 2 === 0 ? 0 : -45)),
                    cz: (b % 4 === 0) ? 0 : (b % 3 === 0 ? -118 : (b % 2 === 0 ? -80 : 25)),
                    radius: 22 + (b % 7) * 9,
                    height: 19 + (b % 6) * 5,
                    speed: 0.32 + (b % 3) * 0.12,
                    phase: b * 0.8
                });
            }
        }

        // ============================================================================
        // 4. SAHNE KURULUMU, ATMOSFERİK IŞIKLANDIRMA VE 100 CANLI KÖYLÜ / MUHAFIZ
        // ============================================================================
        function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.34;
            document.body.appendChild(renderer.domElement);

            window.textures = buildOpenWorldTextures(renderer);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd98a3c);
            scene.environment = window.textures.envMap;
            scene.fog = new THREE.FogExp2(0xd98a3c, 0.0012);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.3, 1600);
            clock = new THREE.Clock();

            const skyC = document.createElement('canvas');
            skyC.width = 512; skyC.height = 256;
            const sCtx = skyC.getContext('2d');
            const sGrad = sCtx.createLinearGradient(0, 0, 0, 256);
            sGrad.addColorStop(0.0, '#091933');
            sGrad.addColorStop(0.36, '#2b5876');
            sGrad.addColorStop(0.66, '#d97706');
            sGrad.addColorStop(0.86, '#fde047');
            sGrad.addColorStop(1.0, '#78350f');
            sCtx.fillStyle = sGrad;
            sCtx.fillRect(0, 0, 512, 256);

            const skyDome = new THREE.Mesh(
                new THREE.SphereGeometry(1250, 32, 24),
                new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(skyC), side: THREE.BackSide, depthWrite: false })
            );
            scene.add(skyDome);

            const hemiLight = new THREE.HemisphereLight(0xfffbeb, 0x78350f, 0.95);
            scene.add(hemiLight);

            const sunLight = new THREE.DirectionalLight(0xfff3c4, 2.1);
            sunLight.position.set(75, 115, 55);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.set(2048, 2048);
            const d = 135;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.camera.far = 420;
            sunLight.shadow.bias = -0.0004;
            scene.add(sunLight);

            // 1. Sinematik Güneş Korona Halesi ve Glare Efekti (Sun Glare & Flare)
            const sunFlareGroup = new THREE.Group();
            sunFlareGroup.position.copy(sunLight.position).multiplyScalar(7.2);
            const sunDiskMesh = new THREE.Mesh(
                new THREE.SphereGeometry(32, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xfffbeb, fog: false })
            );
            sunFlareGroup.add(sunDiskMesh);

            const coronaMesh = new THREE.Mesh(
                new THREE.RingGeometry(32, 110, 32),
                new THREE.MeshBasicMaterial({
                    color: 0xfde047,
                    transparent: true,
                    opacity: 0.45,
                    side: THREE.DoubleSide,
                    fog: false
                })
            );
            sunFlareGroup.add(coronaMesh);
            scene.add(sunFlareGroup);
            window.sunFlareGroup = sunFlareGroup;

            // 2. Çöl Rüzgarı ve Uçuşan Altın Toz Parçacıkları (Golden Sand Dust Swarm - 1.200 Parçacık)
            const dustGeo = new THREE.BufferGeometry();
            const dustCount = 1200;
            const dustPositions = new Float32Array(dustCount * 3);
            const dustVelocities = [];
            for (let i = 0; i < dustCount; i++) {
                dustPositions[i * 3] = (Math.random() - 0.5) * 580;
                dustPositions[i * 3 + 1] = Math.random() * 45;
                dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 580;
                dustVelocities.push({
                    vx: (Math.random() * 0.4 + 0.12),
                    vy: (Math.sin(i) * 0.08),
                    vz: (Math.random() * 0.25 - 0.12)
                });
            }
            dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
            const dustMat = new THREE.PointsMaterial({
                color: 0xfef08a,
                size: 1.2,
                transparent: true,
                opacity: 0.65,
                fog: true
            });
            const dustParticles = new THREE.Points(dustGeo, dustMat);
            scene.add(dustParticles);
            window.dustParticles = dustParticles;
            window.dustVelocities = dustVelocities;

            // Devasa Açık Dünya Haritasını İnşa Et
            buildGodsOfEgyptOpenWorld();

            // Gökyüzünde Süzülen Devasa Ra'nın Güneş Gemisi ve Kanat Ucu Vorteks İzleri
            if (window.EgyptFlightEngine) {
                window.EgyptFlightEngine.initTrailParticles(scene);
                window.EgyptFlightEngine.spawnRaSolarBarque(scene);
            }

            // Karakter Tanrılar Motoru (karaktertanrilar.html'den Entegre Edilen Gerçek 3B Modeller)
            window.updatePlayerModelScale = () => {
                player = window.spawnPlayerCharacter(scene, renderer, new THREE.Vector3(0, 0, 8), Math.PI);
            };
            window.updatePlayerModelScale();

            // Named city residents use the same detailed character models as the character showcase.
            const cityNpcProfiles = [
                { id: 'thoth', name: 'Thoth', title: 'Köy Bilgesi', role: 'horus_human', persona: 'priest', start: [-8, 11], route: [[-8, 11], [-16, 16], [-18, 7]], greeting: 'Nil\'in hesabı şaşmaz; Set\'in vergisi şaşar. Bugün ne arıyorsun?', rumor: 'Dikilitaştaki yazılar, Horus\'un tapınağında kayıp bir gözden söz ediyor.', work: 'Köylülerin hasat kayıtlarını tutuyorum. Buğdayı saymak, tanrıları saymaktan kolay.', joke: 'Bir kâtip neden Nil\'e taşınmış? Hesapları akıp gitsin diye.' },
                { id: 'nefru', name: 'Nefru', title: 'Nil Çiftçisi', role: 'villager', persona: 'farmer', start: [13, 14], route: [[13, 14], [18, 18], [22, 12]], greeting: 'Şu başakları görüyor musun? Set vergiyi almadan biçebilirsek bugün bayram.', rumor: 'Kuzey tarlasının su kanalı tıkandı; Nil bile bazen işe geç kalıyor.', work: 'Buğdayı biç, demet yap, siloya taşı. Tanrılar bile sofraya oturuyor.', joke: 'Buğday neden tapınağa girmiş? Başak çıkarmaya.' },
                { id: 'hapu', name: 'Hapu', title: 'Çiftçi ve Değirmenci', role: 'villager', persona: 'farmer', start: [20, -16], route: [[20, -16], [15, -20], [10, -15]], greeting: 'Öğütülecek tahıl çok, değirmen tek. Bir de üstüne vergi memuru var!', rumor: 'Pazarın batı kapısında bu gece gölgeler dolaşmış.', work: 'Un öğütür, ekmek pişirir, sonra yine un öğütürüm.', joke: 'Değirmen neden dedikodu dinlemez? Her şeyi ağzında öğütür.' },
                { id: 'merit', name: 'Merit', title: 'Pazar Tüccarı', role: 'villager', persona: 'merchant', start: [-18, 4], route: [[-18, 4], [-28, 12], [-33, 6]], greeting: 'Baharat, keten, papirüs! Fiyatlar Set\'ten daha acımasız değil, söz.', rumor: 'Bir hırsız dün kendi gölgesini takip edip pazardan çıktı.', work: 'Tartım doğru, pazarlık uzun. İkisi de ticaretin parçası.', joke: 'Tüccar Nil\'e ne demiş? Akıntıya kapılma, fiyatı ben belirlerim.' },
                { id: 'bek_nadif', name: 'Nadif', title: 'Gezgin Hırsız', role: 'bek', persona: 'thief', start: [-34, 24], route: [[-34, 24], [-45, 28], [-41, 12]], greeting: 'Ben mi? Sadece pazarı geziyorum. Kesenin neden hafiflediğini sonra konuşuruz.', rumor: 'Muhafızlar köprü başında nöbet değiştirirken gözlerini kapatıyor.', work: 'Kilit açarım. Bazen de insanlara doğru kapıyı gösteririm. Ücret karşılığı.', joke: 'Hırsız neden aynaya bakmaz? Aynadaki de ondan şüpheleniyor.' },
                { id: 'bek_taia', name: 'Taia', title: 'Saraydan Kaçan Hırsız', role: 'bek', persona: 'thief', start: [-48, 38], route: [[-48, 38], [-58, 42], [-53, 26]], greeting: 'Sarayın kapısı kilitliydi. İçeriden açılması daha kolay oldu.', rumor: 'Set\'in mühürlü sandıkları batı yolundan taşınacakmış.', work: 'Ben iz bırakmam. Bıraktıysam da onu başka biri bulur.', joke: 'Hırsızın en sevdiği müzik? Cüzdanın şıngırtısı. Sessiz olanı.' },
                { id: 'khepri', name: 'Khepri', title: 'Köprü Muhafızı', role: 'horus_human', persona: 'guard', start: [22, 2], route: [[22, 2], [25, 0], [22, -2]], greeting: 'Köprü açık. Ama şüpheli bir şey görürsen bana söyle; ben zaten bakıyorum.', rumor: 'Gece nöbetinde doğu kıyısından ışık parladığını gördüm.', work: 'Nöbet tutuyorum. Hırsızlar kaçıyor, sivrisinekler kalıyor.', joke: 'Muhafız neden köprüden geçmez? Vardiyası zaten köprüde.' },
                { id: 'dedi', name: 'Dedi', title: 'Muhafız', role: 'bek', persona: 'guard', start: [31, 1], route: [[31, 1], [34, 0], [31, -1]], greeting: 'Geçiş serbest. Lütfen deveyle yarışmayı köprüde deneme.', rumor: 'Batı pazarında yeni bir hırsız görülmüş. Şapkasını tarif ettiler: yokmuş.', work: 'Köprüde düzeni sağlarım. En zor kısmı develere anlatmak.', joke: 'Muhafızın en sevdiği sayı? Nöbet çizelgesindeki kendi sırası.' },
                { id: 'priest_amen', name: 'Amen', title: 'Dikilitaş Rahibi', role: 'villager', persona: 'priest', start: [-12, -20], route: [[-12, -20], [-17, -16], [-12, -12]], greeting: 'Horus\'un ışığı taşta, Nil\'in bereketi tarlada. İkisine de iyi bak.', rumor: 'Dikilitaş tamamlanırsa Set\'in karanlığı bu kıyıdan çekilecek.', work: 'Yazıtları okur, adakları düzenler ve kayıp sandaletleri bulurum.', joke: 'Rahip neden piramide geç kalmış? Yolu biraz fazla kutsal çıkmış.' },
                { id: 'horus', name: 'Horus', title: 'Şahin Tanrı', role: 'horus_god', persona: 'god', start: [22, -40], route: [[22, -40], [18, -45], [24, -48]], greeting: 'Ölümlülerin cesareti, tanrıların gücünden daha şaşırtıcı olabilir.', rumor: 'Set, Horus Tapınağı\'nda gücümün bir parçasını saklıyor.', work: 'Nil\'i gözetiyorum. Bazen de insanların kendi başlarına çözebileceğine güveniyorum.', joke: 'Bir şahin neden vergi ödemez? Zaten her şeyi yukarıdan görüyor.' },
                { id: 'set', name: 'Set', title: 'Çöl Tanrısı', role: 'set_god', persona: 'god', start: [-52, -94], route: [[-52, -94], [-46, -100], [-57, -105]], greeting: 'Benim adımı mı arıyordun? Çöl, davetsiz misafirleri uzun süre saklamaz.', rumor: 'Dikilitaşın yükselmesine izin vermeyeceğim. Bu konuda söylenti değil, tehdit.', work: 'Krallığı yönetiyorum. Herkesin memnun olmasını beklemiyorum.', joke: 'Set neden kum saatini sevmez? Kum ona bile geri sayım yapıyor.' },
                { id: 'sabu', name: 'Sabu', title: 'Tahıl Taşıyıcısı', role: 'villager', persona: 'farmer', start: [16, 42], route: [[16, 42], [21, 46], [18, 52]], greeting: 'Bir çuval buğday mı? İki elim dolu. Üçüncü elimi arıyorum.', rumor: 'Silo kapısının yanında bir kedi nöbet tutuyor. Ücret istemiyor.', work: 'Tarladan siloya, silodan pazara. Ayaklarım haritayı ezberledi.', joke: 'Taşıyıcı neden şarkı söylemez? Yüksek notaya çıkınca çuval düşüyor.' },
                { id: 'tamit', name: 'Tamit', title: 'Nil Kayıkçısı', role: 'villager', persona: 'merchant', start: [97, 30], route: [[97, 30], [103, 34], [100, 25]], greeting: 'Nil\'de yol kısa, akıntı uzundur. Nereye gideceğini söyle.', rumor: 'Doğu kıyısında papirüs arasında eski bir mühür bulmuşlar.', work: 'Kayığımı akıntıya bırakmam. Akıntı da beni bırakmaz.', joke: 'Kayıkçı neden karaya çıkmış? Suya biraz ara vermek istemiş.' },
                { id: 'human_horus', name: 'Aset', title: 'Saray Elçisi', role: 'horus_human', persona: 'noble', start: [-24, -54], route: [[-24, -54], [-30, -58], [-26, -64]], greeting: 'Sarayda herkes fısıldıyor. Burada en azından Nil cevap veriyor.', rumor: 'Set\'in askerleri tapınağa giden yolu sıkı tutuyor.', work: 'Halkın dileklerini saraya taşıyorum. Bazılarını yüksek sesle, bazılarını hiç.', joke: 'Elçi neden mektubu yürütmüş? Mühürlü diye ata emanet edememiş.' },
                { id: 'nebet', name: 'Nebet', title: 'Baharatçı', role: 'villager', persona: 'merchant', start: [-38, 58], route: [[-38, 58], [-44, 62], [-40, 68]], greeting: 'Kimyon, kişniş, tarçın. Çölün tozu hariç her şey var.', rumor: 'Pazarda bir hırsız baharat çalmış; üç gün hapşırmış.', work: 'Baharatı tartarım, müşteriyi dinlerim, Set\'in vergisini görmezden gelirim.', joke: 'Baharatçı neden sır saklayamaz? Her lafa biraz kimyon katar.' },
                { id: 'baket', name: 'Baket', title: 'Doğu Tarlası Çiftçisi', role: 'villager', persona: 'farmer', start: [96, -22], route: [[96, -22], [102, -18], [98, -28]], greeting: 'Doğu tarlasında başak bol, gölge az. Bir şapka bulursan haber ver.', rumor: 'Nil yükselince papirüs sazlığına balıklar kadar söylenti de doluyor.', work: 'Buğday biçer, papirüs toplar, akşam olunca kayığı bağlarım.', joke: 'Çiftçi neden Nil\'e şiir yazmış? Kafiye kendiliğinden akmış.' },
                { id: 'horus_guard', name: 'Paser', title: 'Tapınak Muhafızı', role: 'horus_human', persona: 'guard', start: [2, -74], route: [[2, -74], [7, -78], [2, -82]], greeting: 'Tapınak yolu açık değil. Önce ne aradığını bilmelisin.', rumor: 'Gece nöbetinde kapının arkasından bir kartal sesi geldi.', work: 'Kutsal yolu korurum. Kum fırtınası bile sıraya girer.', joke: 'Muhafız neden tapınakta fısıldar? Duvarların kulağı var, heykellerin de.' },
                { id: 'menna', name: 'Menna', title: 'Nil Çiftçisi', role: 'villager', persona: 'farmer', start: [18, 62], route: [[18, 62], [22, 66], [17, 70]], greeting: 'Hasat iyi giderse kış rahat geçer. Vergi memuru gelmezse daha da rahat.', rumor: 'Bir deve pazarda kendi fiyatını düşürmüş. Tüccar hâlâ şaşkın.', work: 'Başakları tek tek biçiyorum. Acele edenler samanı da topluyor.', joke: 'Buğday başağı neden utanmış? Herkes onunla ekmek yapıyormuş.' },
                { id: 'sutekh', name: 'Sutekh', title: 'Çöl Yolcusu', role: 'bek', persona: 'thief', start: [-66, 12], route: [[-66, 12], [-72, 18], [-68, 24]], greeting: 'Ben yolcuyum. Çantam hafif, hikâyem ağır. Sor bakalım.', rumor: 'Taş ocağında eski bir mızrak bulmuşlar. Kimse dokunmaya cesaret edemiyor.', work: 'Yol gösteririm. Bazen yolun kendisini de değiştiririm.', joke: 'Çöl yolcusu neden pusulaya güvenmez? Pusula hep kuzeyi gösterip duruyor.' },
                { id: 'tahem', name: 'Tahem', title: 'Nil Kayıkçısı', role: 'villager', persona: 'merchant', start: [100, 55], route: [[100, 55], [105, 60], [101, 65]], greeting: 'Kayık hazır. Yolcu hazır. Ücret konusunda biraz daha konuşabiliriz.', rumor: 'Batı kıyısında bir rahip kayığını ters bağlamış; Nil hâlâ gülüyor.', work: 'Kayıkla insan, yük ve bazen çok inatçı bir keçi taşırım.', joke: 'Kayık neden ödevini yapmamış? Akıntıya bırakmış.' },
                { id: 'zaya_city', name: 'Zaya', title: 'Ölümlü Gezgin', role: 'zaya', isFemale: true, skinTone: 'pearl', scale: 1.0, persona: 'thief', start: [-22, -34], route: [[-22, -34], [-28, -38], [-24, -28]], greeting: 'Set\'in muhafızları beni arıyor. Sebebini sorma; kesen hâlâ bende.', rumor: 'Sarayın arka kapısında gece yarısı bir ışık yanıyor.', work: 'Kervan yollarını ve kilitleri herkesten iyi bilirim.', joke: 'Bir hırsız neden sessiz yürür? Ayak sesleri de tanık sayılır.' },
                { id: 'hathor_city', name: 'Hathor', title: 'Aşk ve Bereket Tanrıçası', role: 'hathor', isFemale: true, skinTone: 'golden', scale: 1.52, persona: 'goddess', start: [1, 24], route: [[1, 24], [-5, 28], [5, 31]], greeting: 'Nil\'in şarkısını duyuyor musun? İnsanlar birbirine yardım edince daha güzel çalıyor.', rumor: 'Dikilitaşın gölgesi kısalınca yeni bir çağ başlayacak.', work: 'Köylülerin hasat şenliğini ve adaklarını gözetiyorum.', joke: 'Tanrıça neden arpını Nil\'e bırakmış? Telleri biraz akort olsun diye.' },
