    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #110a06;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            width: 100vw;
            min-height: 100dvh;
            max-width: 100vw;
            overscroll-behavior: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100dvh;
            max-width: 100vw;
            max-height: 100dvh;
        }
        .ui-glass {
            background: rgba(18, 10, 6, 0.86);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 191, 36, 0.42);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.72);
        }
        .char-pill {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .char-pill.active {
            background: linear-gradient(135deg, #fde047 0%, #f59e0b 55%, #b45309 100%);
            color: #1c1004;
            border-color: #fef9c3;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.75);
            transform: translateY(-1px);
        }
        .gold-btn {
            background: linear-gradient(135deg, #fde047 0%, #f59e0b 50%, #d97706 100%);
            color: #1c1004;
            border: 1px solid #fef08a;
        }
        .action-btn:active { transform: scale(0.93); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-amber-100 overflow-hidden">

            Set Zırh (3.6m)
        </button>
        <button onclick="selectCharacter(12)" id="pill-12" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">

        </button>
    </div>

    <!-- SEÇİLİ KARAKTER BİLGİ ETİKETİ -->
    <div class="fixed top-16 left-1/2 -translate-x-1/2 z-20 ui-glass px-4 py-1 rounded-full flex items-center gap-2 pointer-events-none whitespace-nowrap">
        <span id="char-badge-title" class="text-xs font-black text-amber-300 tracking-wide">Zaya (Ölümlü Baş Güzeli)</span>
        <span class="text-amber-500/60">•</span>
        <span id="char-badge-desc" class="text-[11px] text-amber-100/90">Dinamik Kumaş Fiziği • Çarpışmasız (Zero-Clipping) 3B Mücevherli Büstiyer & Etek</span>
    </div>

    <!-- SOL ALT: MOBİL YÜRÜME JOYSTICK -->
    <div id="joystick-zone" class="fixed bottom-6 left-6 w-32 h-32 ui-glass rounded-full flex items-center justify-center z-20 touch-none">
        <div class="w-20 h-20 rounded-full border border-amber-400/30 pointer-events-none"></div>
        <div id="joystick-knob" class="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-700 via-amber-400 to-yellow-200 border-2 border-white/90 shadow-xl absolute pointer-events-none transition-transform duration-75"></div>
    </div>

    <!-- SAĞ ALT: KAMERA AÇISI VE POZ KONTROLLERİ -->
    <div class="fixed bottom-6 right-6 z-20 flex flex-col items-end gap-2">
        <div class="flex flex-wrap justify-end gap-1.5">
            <button onclick="toggleActionPose()" id="btn-wings" class="action-btn ui-glass px-3 py-1.5 rounded-xl text-xs font-bold text-amber-300 border border-amber-400/40">
                Cazibe / Kanat Pozu
            </button>
            <button onclick="focusBodySculpt()" class="action-btn ui-glass px-3 py-1.5 rounded-xl text-xs font-semibold text-amber-200">
                Vücut / Sütyen & Kalça
            </button>
            <button onclick="focusFace()" class="action-btn ui-glass px-3 py-1.5 rounded-xl text-xs font-semibold text-amber-200">
                Yüz & Saç Detayı
            </button>
            <button onclick="resetCameraView()" class="action-btn ui-glass px-3 py-1.5 rounded-xl text-xs font-semibold text-amber-200">
                Tam Boy
            </button>
        </div>
        <div class="ui-glass px-3 py-1.5 rounded-xl text-[11px] text-amber-200/90 pointer-events-none">
            Ekranı kaydır: 360° Kamera • İki parmak / Tekerlek: Yakınlaştır
        </div>
    </div>

    <script>
        let scene, camera, renderer, clock;
        let characters = [];
        let activeIndex = 0;
        let actionPoseActive = false;
        let frontKeyLight, warmFillLight;
        let divineParticles;

        // Kontroller
        let joyActive = false;
        let joyPointerId = null;
        let joyVec = { x: 0, y: 0 };
        const keys = { w: false, a: false, s: false, d: false };

        // 360° Kamera
        let camYaw = 0.16;
        let camPitch = 0.03;
        let camDist = 3.05;
        let camTargetY = 1.00;
        let desiredTargetY = 1.00;
        let desiredDist = 3.05;
        const activePointers = new Map();
        let lastPinchDist = 0;

        // ==========================================
        // 1. PBR YANSIMA HARİTASI VE GERÇEKÇİ TEN / KUMAŞ DOKULARI
        // ==========================================
        function buildTextures(rendererInstance) {
            const envC = document.createElement('canvas');
            envC.width = 1024; envC.height = 512;
            const eCtx = envC.getContext('2d');

            const skyGrad = eCtx.createLinearGradient(0, 0, 0, 512);
            skyGrad.addColorStop(0.0, '#090d16');
            skyGrad.addColorStop(0.24, '#241822');
            skyGrad.addColorStop(0.45, '#d97706');
            skyGrad.addColorStop(0.50, '#fef08a');
            skyGrad.addColorStop(0.56, '#9a3412');
            skyGrad.addColorStop(0.78, '#281207');
            skyGrad.addColorStop(1.0, '#0a0502');
            eCtx.fillStyle = skyGrad;
            eCtx.fillRect(0, 0, 1024, 512);

            const studioPanels = [
                { x: 220, y: 150, r: 145, c: 'rgba(255, 248, 228, 0.92)' },
                { x: 512, y: 170, r: 175, c: 'rgba(253, 224, 71, 0.88)' },
                { x: 810, y: 150, r: 145, c: 'rgba(255, 232, 212, 0.90)' },
                { x: 512, y: 365, r: 160, c: 'rgba(217, 119, 6, 0.52)' }
            ];
            studioPanels.forEach(p => {
                const rg = eCtx.createRadialGradient(p.x, p.y, 4, p.x, p.y, p.r);
                rg.addColorStop(0, p.c);
                rg.addColorStop(0.45, 'rgba(245, 158, 11, 0.32)');
                rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
                eCtx.fillStyle = rg;
                eCtx.fillRect(0, 0, 1024, 512);
            });

            const rawEnvTex = new THREE.CanvasTexture(envC);
            rawEnvTex.mapping = THREE.EquirectangularReflectionMapping;

            const pmremGenerator = new THREE.PMREMGenerator(rendererInstance);
            pmremGenerator.compileEquirectangularShader();
            const envMap = pmremGenerator.fromEquirectangular(rawEnvTex).texture;
            rawEnvTex.dispose();
            pmremGenerator.dispose();

            // 2. Doğal Kadın Vücut Ten Dokusu (Köprücük kemiği, yumuşak göğüs dekoltesi gölgesi, ince bel konturu ve göbek deliği)
            function createFemaleBodySkinTexture(baseRgb, shadowRgb, highlightRgb) {
                const c = document.createElement('canvas');
                c.width = 1024; c.height = 1024;
                const ctx = c.getContext('2d');

                ctx.fillStyle = `rgb(${baseRgb[0]}, ${baseRgb[1]}, ${baseRgb[2]})`;
                ctx.fillRect(0, 0, 1024, 1024);

                function softShade(cx, cy, rx, ry, colorStr) {
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.scale(rx, ry);
                    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
                    g.addColorStop(0, colorStr);
                    g.addColorStop(0.55, colorStr.replace(/[\d.]+\)$/, (m) => (parseFloat(m) * 0.45) + ')'));
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(0, 0, 1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                const sh = (a) => `rgba(${shadowRgb[0]}, ${shadowRgb[1]}, ${shadowRgb[2]}, ${a})`;
                const hi = (a) => `rgba(${highlightRgb[0]}, ${highlightRgb[1]}, ${highlightRgb[2]}, ${a})`;

                // Yan bel ve kaburga konturları
                softShade(270, 480, 75, 290, sh(0.22));
                softShade(754, 480, 75, 290, sh(0.22));

                // Sırt omurga oluğu (x = 0 ve x = 1024)
                softShade(0, 460, 22, 310, sh(0.32));
                softShade(1024, 460, 22, 310, sh(0.32));

                // Köprücük kemiği (Clavicle)
                [-1, 1].forEach(dir => {
                    softShade(512 + dir * 66, 200, 52, 7, hi(0.30));
                    softShade(512 + dir * 66, 210, 52, 6, sh(0.22));
                });

                // Göğüs dekolte arası yumuşak gölge ve üst göğüs ışıltısı
                softShade(512, 315, 14, 78, sh(0.38));
                [-1, 1].forEach(dir => {
                    const bx = 512 + dir * 58;
                    softShade(bx, 295, 52, 48, hi(0.30));
                    softShade(bx, 358, 52, 16, sh(0.35));
                });

                // İnce kadın karnı ışıltısı ve göbek deliği
                softShade(512, 495, 48, 105, hi(0.18));
                softShade(462, 495, 9, 95, sh(0.16));
                softShade(562, 495, 9, 95, sh(0.16));
                softShade(512, 565, 6, 9, sh(0.50));

                // Arka kalça (Glutes) üst/alt doğal gölge ve ışıltısı
                softShade(85, 690, 65, 65, hi(0.22));
                softShade(939, 690, 65, 65, hi(0.22));
                softShade(0, 695, 16, 85, sh(0.42));
                softShade(1024, 695, 16, 85, sh(0.42));

                return new THREE.CanvasTexture(c);
            }

            // 3. Doğal İnsan & Tanrıça Yüz Dokusu (Yumuşak allık, elmacık kemiği ışıltısı ve pürüzsüz cilt tonu)
            function createHumanFaceTexture(baseRgb, shadowRgb, highlightRgb, blushRgba = null) {
                const c = document.createElement('canvas');
                c.width = 512; c.height = 512;
                const ctx = c.getContext('2d');

                ctx.fillStyle = `rgb(${baseRgb[0]}, ${baseRgb[1]}, ${baseRgb[2]})`;
                ctx.fillRect(0, 0, 512, 512);

                const g = ctx.createRadialGradient(256, 235, 12, 256, 256, 210);
                g.addColorStop(0, `rgba(${highlightRgb[0]}, ${highlightRgb[1]}, ${highlightRgb[2]}, 0.28)`);
                g.addColorStop(0.62, `rgba(${baseRgb[0]}, ${baseRgb[1]}, ${baseRgb[2]}, 0.0)`);
                g.addColorStop(1, `rgba(${shadowRgb[0]}, ${shadowRgb[1]}, ${shadowRgb[2]}, 0.24)`);
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, 512, 512);

                if (blushRgba) {
                    [-1, 1].forEach(dir => {
                        const bx = 256 + dir * 56;
                        const by = 278;
                        const bg = ctx.createRadialGradient(bx, by, 2, bx, by, 38);
                        bg.addColorStop(0, blushRgba);
                        bg.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = bg;
                        ctx.fillRect(0, 0, 512, 512);
                    });
                }

                return new THREE.CanvasTexture(c);
            }

            // 4. Erkek Tanrı & Kahraman Gövde Dokusu
            function createMaleTorsoTexture(baseRgb, darkRgb, highlightRgb) {
                const c = document.createElement('canvas');
                c.width = 1024; c.height = 1024;
                const ctx = c.getContext('2d');

                ctx.fillStyle = `rgb(${baseRgb[0]}, ${baseRgb[1]}, ${baseRgb[2]})`;
                ctx.fillRect(0, 0, 1024, 1024);

                function softBlob(cx, cy, rx, ry, colorStr) {
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.scale(rx, ry);
                    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
                    g.addColorStop(0, colorStr);
                    g.addColorStop(0.55, colorStr.replace(/[\d.]+\)$/, (m) => (parseFloat(m) * 0.42) + ')'));
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(0, 0, 1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                const shadow = (a) => `rgba(${darkRgb[0]}, ${darkRgb[1]}, ${darkRgb[2]}, ${a})`;
                const light = (a) => `rgba(${highlightRgb[0]}, ${highlightRgb[1]}, ${highlightRgb[2]}, ${a})`;

                softBlob(265, 520, 82, 330, shadow(0.26));
                softBlob(759, 520, 82, 330, shadow(0.26));
                softBlob(0, 500, 28, 330, shadow(0.36));
                softBlob(1024, 500, 28, 330, shadow(0.36));
                softBlob(512, 515, 13, 250, shadow(0.30));

                [-1, 1].forEach(dir => {
                    const px = 512 + dir * 74;
                    softBlob(px, 392, 66, 15, shadow(0.38));
                    softBlob(px, 336, 62, 48, light(0.26));
                });

                const abRows = [465, 545, 625];
                abRows.forEach((ry, idx) => {
                    const w = 36 - idx * 3;
                    [-1, 1].forEach(dir => {
                        const ax = 512 + dir * 36;
                        softBlob(ax, ry + 30, w, 8, shadow(0.25));
                        softBlob(ax, ry, w * 0.85, 22, light(0.18));
                    });
                });

                softBlob(512, 682, 8, 10, shadow(0.45));
                return new THREE.CanvasTexture(c);
            }

            // 5. İnce Pilili İpek Kalasiris & İşlemeli Büstiyer Kumaş Dokusu
            function createSilkFabricTexture(bgHex, pleatRgba, goldHex, accentHex) {
                const c = document.createElement('canvas');
                c.width = 512; c.height = 512;
                const ctx = c.getContext('2d');
                ctx.fillStyle = bgHex;
                ctx.fillRect(0, 0, 512, 512);

                // İnce dikey ipek pilileri ve dokuma ışıltısı
                for (let x = 0; x < 512; x += 4) {
                    ctx.fillStyle = x % 8 === 0 ? pleatRgba : 'rgba(255, 255, 255, 0.14)';
                    ctx.fillRect(x, 0, 2, 512);
                }

                // Altın nakış bordürleri ve Mısır lotus/geometrik desen şeridi
                ctx.fillStyle = goldHex;
                ctx.fillRect(0, 0, 512, 18);
                ctx.fillRect(0, 462, 512, 22);
                ctx.fillStyle = accentHex;
                ctx.fillRect(0, 484, 512, 14);
                ctx.fillStyle = goldHex;
                ctx.fillRect(0, 498, 512, 14);

                ctx.strokeStyle = goldHex;
                ctx.lineWidth = 2;
                for (let x = 0; x < 512; x += 16) {
                    ctx.beginPath();
                    ctx.moveTo(x, 462);
                    ctx.lineTo(x + 8, 446);
                    ctx.lineTo(x + 16, 462);
                    ctx.stroke();
                }

                return new THREE.CanvasTexture(c);
            }

            // 6. Altın Zırh & Mücevher Dokusu
            const goldC = document.createElement('canvas');
            goldC.width = 512; goldC.height = 512;
            const gCtx = goldC.getContext('2d');
            const gGrad = gCtx.createLinearGradient(0, 0, 512, 512);
            gGrad.addColorStop(0, '#fde047');
            gGrad.addColorStop(0.5, '#f59e0b');
            gGrad.addColorStop(1, '#b45309');
            gCtx.fillStyle = gGrad;
            gCtx.fillRect(0, 0, 512, 512);
            gCtx.strokeStyle = 'rgba(92, 42, 6, 0.32)';
            gCtx.lineWidth = 2;
            for (let y = 0; y < 512; y += 22) {
                for (let x = 0; x < 512; x += 26) {
                    gCtx.beginPath();
                    gCtx.moveTo(x, y);
                    gCtx.lineTo(x + 13, y + 11);
                    gCtx.lineTo(x + 26, y);
                    gCtx.stroke();
                }
            }
            const goldTex = new THREE.CanvasTexture(goldC);

            // 7. Tapınak Zemin Dokusu
            const floorC = document.createElement('canvas');
            floorC.width = 512; floorC.height = 512;
            const fCtx = floorC.getContext('2d');
            fCtx.fillStyle = '#c29b6c';
            fCtx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 8500; i++) {
                fCtx.fillStyle = i % 2 === 0 ? 'rgba(255,240,215,0.05)' : 'rgba(75,42,15,0.06)';
                fCtx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
            }
            fCtx.strokeStyle = 'rgba(85, 48, 18, 0.35)';
            fCtx.lineWidth = 3;
            for (let p = 0; p <= 512; p += 128) {
                fCtx.beginPath(); fCtx.moveTo(p, 0); fCtx.lineTo(p, 512); fCtx.stroke();
                fCtx.beginPath(); fCtx.moveTo(0, p); fCtx.lineTo(512, p); fCtx.stroke();
            }
            const floorTex = new THREE.CanvasTexture(floorC);
            floorTex.wrapS = THREE.RepeatWrapping;
            floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(60, 60);

            return {
                envMap,
                goldTex,
                floorTex,
                // Kadın Cilt Tonları (Sıcak Buğday/İnci, Altın Bronz, Güneş Esmeri)
                femBodyPearl: createFemaleBodySkinTexture([218, 158, 122], [124, 68, 40], [248, 204, 174]),
                femBodyGolden: createFemaleBodySkinTexture([202, 136, 94], [108, 54, 26], [238, 184, 146]),
                femBodyBronze: createFemaleBodySkinTexture([184, 116, 76], [92, 42, 18], [224, 164, 124]),
                femFacePearl: createHumanFaceTexture([218, 158, 122], [124, 68, 40], [248, 204, 174], 'rgba(215, 85, 80, 0.24)'),
                femFaceGolden: createHumanFaceTexture([202, 136, 94], [108, 54, 26], [238, 184, 146], 'rgba(210, 75, 68, 0.25)'),
                femFaceBronze: createHumanFaceTexture([184, 116, 76], [92, 42, 18], [224, 164, 124], 'rgba(198, 65, 58, 0.24)'),
                // Erkek Cilt Tonları
                maleTorsoHorus: createMaleTorsoTexture([208, 142, 100], [104, 50, 24], [244, 194, 156]),
                maleTorsoBek: createMaleTorsoTexture([196, 128, 88], [94, 44, 20], [236, 180, 142]),
                maleFaceHorus: createHumanFaceTexture([208, 142, 100], [114, 58, 28], [244, 194, 156]),
                maleFaceBek: createHumanFaceTexture([196, 128, 88], [108, 54, 26], [236, 180, 142]),
                // Kumaşlar (Ten rengiyle karışmayan, zengin ve belirgin ipek/brokar tonları)
                fabricZaya: createSilkFabricTexture('#f8fafc', 'rgba(56, 189, 248, 0.28)', '#f59e0b', '#0284c7'),

        // ==========================================
        // 2. KESİNTİSİZ CANLI UZUV (KOL & BACAK) MOTORU
        // ==========================================
        function createContinuousSkinnedLimb(totalLength, jointRatio, profile, material, isArm = false) {
            const radialSegs = 32;
            const heightSegs = 36;
            const geom = new THREE.CylinderGeometry(1, 1, totalLength, radialSegs, heightSegs, true);

            const pos = geom.attributes.position;
            const restData = [];

            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const vz = pos.getZ(i);

                const t = Math.max(0.0, Math.min(1.0, (totalLength / 2 - vy) / totalLength));
                const radialLen = Math.hypot(vx, vz);
                const nx = radialLen > 0.0001 ? vx / radialLen : 0;
                const nz = radialLen > 0.0001 ? vz / radialLen : 0;

                let rx = profile[profile.length - 1][1];
                let rz = profile[profile.length - 1][2];
                let offZ = profile[profile.length - 1][3] || 0;

                for (let j = 0; j < profile.length - 1; j++) {
                    const p0 = profile[j];
                    const p1 = profile[j + 1];
                    if (t >= p0[0] && t <= p1[0] + 0.0001) {
                        const span = Math.max(0.0001, p1[0] - p0[0]);
                        const lt = Math.max(0.0, Math.min(1.0, (t - p0[0]) / span));
                        const s = lt * lt * (3 - 2 * lt);
                        rx = p0[1] + (p1[1] - p0[1]) * s;
                        rz = p0[2] + (p1[2] - p0[2]) * s;
                        offZ = (p0[3] || 0) + ((p1[3] || 0) - (p0[3] || 0)) * s;
                        break;
                    }
                }

                let capScale = 1.0;
                let yLocal = -t * totalLength;
                if (t < 0.08) {
                    const kt = t / 0.08;
                    capScale = Math.sin(kt * Math.PI * 0.5);
                    yLocal = (1.0 - kt) * (rx * 0.52);
                }

                const lx = nx * rx * capScale;
                const lz = nz * rz * capScale + offZ;

                restData.push({ t, lx, ly: yLocal, lz });
                pos.setXYZ(i, lx, yLocal, lz);
            }

            geom.computeVertexNormals();
            const mesh = new THREE.Mesh(geom, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            const jointY = -jointRatio * totalLength;

            const upperGroup = new THREE.Group();
            upperGroup.position.set(0, -totalLength * 0.25, 0);
            mesh.add(upperGroup);

            const lowerGroup = new THREE.Group();
            lowerGroup.position.set(0, jointY, 0);
            mesh.add(lowerGroup);

            const endGroup = new THREE.Group();
            endGroup.position.set(0, -totalLength, 0);
            mesh.add(endGroup);

            function updateBend(jointAngleX) {
                const sinA = Math.sin(jointAngleX);
                const cosA = Math.cos(jointAngleX);

                for (let i = 0; i < restData.length; i++) {
                    const v = restData[i];
                    if (v.t <= jointRatio - 0.09) {
                        pos.setXYZ(i, v.lx, v.ly, v.lz);
                    } else {
                        let weight = 1.0;
                        if (v.t < jointRatio + 0.09) {
                            const kt = (v.t - (jointRatio - 0.09)) / 0.18;
                            weight = kt * kt * (3 - 2 * kt);
                        }
                        const a = jointAngleX * weight;
                        const s = Math.sin(a);
                        const c = Math.cos(a);

                        const dy = v.ly - jointY;
                        const dz = v.lz;

                        const ny = jointY + dy * c - dz * s;
                        const nz = dy * s + dz * c;
                        pos.setXYZ(i, v.lx, ny, nz);
                    }
                }
                pos.needsUpdate = true;

                lowerGroup.position.set(0, jointY, 0);
                lowerGroup.rotation.x = jointAngleX;

                const lowerLen = totalLength * (1 - jointRatio);
                endGroup.position.set(0, jointY - lowerLen * cosA, -lowerLen * sinA);
                endGroup.rotation.x = jointAngleX;
            }

            updateBend(isArm ? -0.16 : 0.04);
            return { mesh, upperGroup, lowerGroup, endGroup, updateBend };
        }

        // ==========================================
        // 3. ÇARPIŞMASIZ (ZERO-CLIPPING) KADIN ANATOMİSİ, TAM OTURAN 3B KRALİYET BÜSTİYERİ VE GERÇEK ZAMANLI HAREKETLİ KUMAŞ ETEK MOTORU
        // ==========================================
        function sampleSeamlessFemaleBodySurface(theta, t, curveScale = 1.0) {
            // t = 0.0 (Kalça/uyluk birleşimi y = -0.14) -> t = 1.0 (Boyun üstü y = +0.62)
            const nx = Math.sin(theta);
            const nz = Math.cos(theta);

            const smooth = (a, b, v) => {
                const k = Math.max(0, Math.min(1, (v - a) / (b - a)));
                return k * k * (3 - 2 * k);
            };

            let rx = 0.12;
            let rz = 0.09;
            let centerZ = 0;

            if (t < 0.15) {
                const s = smooth(0.0, 0.15, t);
                rx = (0.128 + 0.026 * s) * curveScale;
                rz = (0.094 + 0.018 * s) * curveScale;
                centerZ = -0.007 * s;
            } else if (t < 0.31) {
                // Yuvarlak kalçadan kum saati ince bele geçiş
                const s = smooth(0.15, 0.31, t);
                rx = (0.154 * (1 - s) + 0.094 * s) * curveScale;
                rz = (0.112 * (1 - s) + 0.073 * s);
                centerZ = -0.007 * (1 - s) + 0.006 * s;
            } else if (t < 0.46) {
                const s = smooth(0.31, 0.46, t);
                rx = 0.094 * curveScale * (1 - s) + 0.121 * s;
                rz = 0.073 * (1 - s) + 0.091 * s;
                centerZ = 0.007;
            } else if (t < 0.74) {
                const s = smooth(0.46, 0.74, t);
                rx = 0.121 + Math.sin(s * Math.PI * 0.65) * 0.021;
                rz = 0.091 + Math.sin(s * Math.PI * 0.55) * 0.009;
                centerZ = 0.007 * (1 - s * 0.6);
            } else if (t < 0.86) {
                const s = smooth(0.74, 0.86, t);
                rx = 0.138 * (1 - s) + 0.042 * s;
                rz = 0.095 * (1 - s) + 0.042 * s;
            } else {
                const s = smooth(0.86, 1.0, t);
                rx = 0.042 - Math.sin(s * Math.PI) * 0.003;
                rz = 0.042 - Math.sin(s * Math.PI) * 0.003;
                centerZ = 0.003;
            }

            let x = nx * rx;
            let z = nz * rz + centerZ;
            const y = -0.14 + t * 0.76;

            // 1. DOĞAL YUVARLAK DAMLA (TEARDROP) 3B GÖĞÜS ANATOMİSİ (Sivri koni yapmayan yuvarlak kubbe profili!)
            if (nz > -0.05 && t > 0.49 && t < 0.75) {
                const ty = (t - 0.618) / 0.108;
                if (Math.abs(ty) < 1.0) {
                    // Yuvarlak kubbe dikey profil + doğal alt göğüs dolgunluğu
                    const domeY = Math.sqrt(Math.max(0, 1.0 - ty * ty)) * (ty < 0 ? 1.12 : 1.0 - ty * 0.16);

                    const distL = Math.abs(nx + 0.44) / 0.40;
                    const distR = Math.abs(nx - 0.44) / 0.40;
                    // Sivri tepe yerine pürüzsüz yuvarlak küresel kapak (cos^2)
                    const lobeL = distL < 1.0 ? Math.pow(Math.cos(distL * Math.PI * 0.5), 1.7) : 0;
                    const lobeR = distR < 1.0 ? Math.pow(Math.cos(distR * Math.PI * 0.5), 1.7) : 0;

                    const breastVolume = (lobeL + lobeR) * domeY * Math.max(0, nz) * curveScale;
                    z += breastVolume * 0.062;
                    x += Math.sign(nx) * breastVolume * 0.016;
                }
            }

            // 2. DOĞAL YUVARLAK 3B KALÇA KASLARI (GLUTES)
            if (nz < 0.05 && t > 0.03 && t < 0.27) {
                const gy = (t - 0.15) / 0.105;
                if (Math.abs(gy) < 1.0) {
                    const gluteDomeY = Math.sqrt(Math.max(0, 1.0 - gy * gy)) * (gy < 0 ? 1.14 : 1.0);
                    const gDistL = Math.abs(nx + 0.43) / 0.42;
                    const gDistR = Math.abs(nx - 0.43) / 0.42;
                    const gLobeL = gDistL < 1.0 ? Math.pow(Math.cos(gDistL * Math.PI * 0.5), 1.7) : 0;
                    const gLobeR = gDistR < 1.0 ? Math.pow(Math.cos(gDistR * Math.PI * 0.5), 1.7) : 0;

                    const gLobe = (gLobeL + gLobeR) * gluteDomeY * Math.max(0, -nz) * curveScale;
                    z -= gLobe * 0.050;
                    x += Math.sign(nx) * gLobe * 0.012;
                }
            }

            // 3. YUMUŞAK KARIN KAVİSİ VE OMURGA OLUĞU
            const absX = Math.abs(nx);
            if (nz > 0.25 && t > 0.20 && t < 0.48) {
                const belly = Math.sin(((t - 0.20) / 0.28) * Math.PI) * Math.cos(Math.min(1, absX / 0.55) * Math.PI * 0.5);
                z += belly * 0.007;
            }
            if (nz < -0.25 && t > 0.28 && t < 0.75 && absX < 0.20) {
                z += (1.0 - absX / 0.20) * ((-nz - 0.25) / 0.75) * 0.008;
            }

            return { x, y, z, nx, nz };
        }

        // Büstiyer üst sınır fonksiyonu (Hem gövde gizlemede hem büstiyer ağında ortak kullanılır -> %100 sıfır çarpışma!)
        function getBraUpperBoundaryT(theta) {
            const absTheta = Math.abs(theta);
            if (absTheta >= 1.48) return 0.562; // Sırtta zarif düz bant
            const cupArch = Math.sin(Math.min(1, absTheta / 1.18) * Math.PI);
            const plungeV = Math.pow(Math.min(1, absTheta / 0.34), 1.35);
            return 0.546 + plungeV * cupArch * 0.118;
        }

        // Kemer yüksekliği fonksiyonu
        function getBeltTopT(theta) {
            const cosT = Math.cos(theta);
            return 0.232 - (cosT > 0 ? Math.pow(cosT, 1.6) * 0.044 : 0.010 * (-cosT));
        }

                const baseVertices = [];

                for (let i = 0; i < p.count; i++) {
                    const u = p.getX(i) + 0.5; // 0..1 yatay
                    const v = 0.5 - p.getY(i); // 0 (kemer üstü) .. 1 (etek ucu)

                    // Yırtmaç kesimi: kalçada birleşik başlar, aşağı indikçe zarifçe açılır
                    const slitNarrow = isFront ? (1.0 - Math.pow(v, 0.85) * 0.24) : (1.0 - Math.pow(v, 0.85) * 0.12);
                    const midTheta = (thetaStart + thetaEnd) * 0.5;
                    const halfSpan = ((thetaEnd - thetaStart) * 0.5) * slitNarrow;
                    const th = midTheta + (u - 0.5) * 2.0 * halfSpan;

                    const tTop = getBeltTopT(th);
                    const hipFollow = Math.min(1.0, v / 0.25);
                    const tSample = tTop * (1 - hipFollow) + 0.02 * hipFollow;
                    const hipPt = sampleSeamlessFemaleBodySurface(th, tSample, curveScale);
                    const topPt = sampleSeamlessFemaleBodySurface(th, tTop, curveScale);

                    const yPos = topPt.y - v * skirtLength;
                    // Kalça ve bacak yüzeyinin güvenli dışında başlayan A-kesim ipek döküm
                    const drapeFlare = Math.pow(v, 1.15) * 0.055;
                    const pleatWave = Math.sin(u * Math.PI * 24) * (0.0018 + v * 0.0055);
                    const radScale = 1.048 + drapeFlare + pleatWave;

                    const bx = hipPt.x * radScale;
                    const by = yPos;
                    const bz = hipPt.z * radScale;

                    baseVertices.push({ u, v, th, bx, by, bz });
                    p.setXYZ(i, bx, by, bz);
                    uvs.setXY(i, u, 1 - v);
                }

                geom.computeVertexNormals();
                const mat = fabricMat.clone();
                mat.side = THREE.DoubleSide;
                mat.polygonOffset = true;
                mat.polygonOffsetFactor = -1;
                mat.polygonOffsetUnits = -1;

                const mesh = new THREE.Mesh(geom, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                dynamicSkirtPanels.push({ mesh, geom, baseVertices, isFront, skirtLength });
                return mesh;
            }

            // Ön İpek Etek Paneli ve Arka İpek Etek Paneli
            bodyGroup.add(createDynamicSkirtPanel(-1.12, 1.12, true));
            bodyGroup.add(createDynamicSkirtPanel(1.28, Math.PI * 2 - 1.28, false));

            // Kemerden Aşağı Sarkan Hareketli Kraliyet Ön Kuşağı (Royal Apron / Sash)
            const sashCols = 16;
            const sashRows = 28;
            const sashGeom = new THREE.PlaneGeometry(1, 1, sashCols, sashRows);
            const sPos = sashGeom.attributes.position;
            const sUv = sashGeom.attributes.uv;
            const sashBase = [];
            const sashLen = skirtLength * 0.88;

            for (let i = 0; i < sPos.count; i++) {
                const u = sPos.getX(i) + 0.5;
                const v = 0.5 - sPos.getY(i);
                const pointTaper = v > 0.82 ? (1.0 - (v - 0.82) / 0.18) : (1.0 - v * 0.15);
                const th = (u - 0.5) * 0.42 * pointTaper;

                const tTop = getBeltTopT(th);
                const hipFollow = Math.min(1.0, v / 0.25);
                const hipPt = sampleSeamlessFemaleBodySurface(th, tTop * (1 - hipFollow) + 0.02 * hipFollow, curveScale);
                const topPt = sampleSeamlessFemaleBodySurface(th, tTop, curveScale);

                const bx = hipPt.x * 1.068;
                const by = topPt.y - v * sashLen;
                const bz = hipPt.z * 1.068 + 0.008 + Math.pow(v, 1.2) * 0.025;

                sashBase.push({ u, v, th, bx, by, bz });
                sPos.setXYZ(i, bx, by, bz);
                sUv.setXY(i, u, 1 - v);
            }
            sashGeom.computeVertexNormals();
            const sashMat = (role === 'zaya' || role === 'female_villager') ? goldMat.clone() : accentMat.clone();
            sashMat.side = THREE.DoubleSide;
            const sashMesh = new THREE.Mesh(sashGeom, sashMat);
            sashMesh.castShadow = true;
            bodyGroup.add(sashMesh);
            dynamicSkirtPanels.push({ mesh: sashMesh, geom: sashGeom, baseVertices: sashBase, isFront: true, isSash: true, skirtLength: sashLen });

            // Her karede bacak açısına ve yürüyüş hızına göre eteği dalgalandıran ve bacak çarpışmasını %100 önleyen fizik çözücü
            function updateSkirtClothPhysics(lHipAngle, rHipAngle, walkMag, elapsed, phase) {
                for (let pIdx = 0; pIdx < dynamicSkirtPanels.length; pIdx++) {
                    const panel = dynamicSkirtPanels[pIdx];
                    const posAttr = panel.geom.attributes.position;
                    const verts = panel.baseVertices;

                    for (let i = 0; i < verts.length; i++) {
                        const vtx = verts[i];
                        const v = vtx.v; // 0 (kemer) -> 1 (etek ucu)
                        if (v < 0.02) {
                            posAttr.setXYZ(i, vtx.bx, vtx.by, vtx.bz);
                            continue;
                        }

                        const sinTh = Math.sin(vtx.th); // < 0 sol bacak tarafı, > 0 sağ bacak tarafı
                        const cosTh = Math.cos(vtx.th); // > 0 ön, < 0 arka

                        // Sol ve sağ bacağın ileri/geri adım açısına göre kumaşı bacağın önünde/arkasında itme (Leg Collision Response)
                        const leftWeight = Math.max(0, -sinTh * 1.35);
                        const rightWeight = Math.max(0, sinTh * 1.35);
                        const centerBlend = Math.max(0, 1.0 - Math.abs(sinTh) * 1.5);

                        let legPushZ = 0;
                        let legLiftY = 0;
                        let slitFlareX = 0;

                        if (panel.isFront) {
                            // Bacak öne kalktığında (hip.rotation.x < 0 ise Three.js'de bacak +Z yönüne, yani ÖNE gider!)
                            // Dikkat: Three.js'de Y-ekseni aşağı uzanan uzuvda rotation.x < 0 ucu +Z'ye (öne) kaldırır, rotation.x > 0 ucu -Z'ye (arkaya) iter!
                            const fwdLeft = Math.max(0, -lHipAngle);
                            const fwdRight = Math.max(0, -rHipAngle);
                            const maxFwd = Math.max(fwdLeft, fwdRight);

                            const activeFwd = fwdLeft * leftWeight + fwdRight * rightWeight + maxFwd * centerBlend * 0.75;
                            const distAlongLeg = v * panel.skirtLength;

                            // Uyluk ve dizin öne çıkma miktarından +2.5cm daha fazla kumaşı öne ve yukarı kaldır!
                            legPushZ = Math.sin(activeFwd) * distAlongLeg * 1.18 + (activeFwd > 0.01 ? 0.022 * Math.min(1, v * 3.0) : 0);
                            legLiftY = (1.0 - Math.cos(activeFwd)) * distAlongLeg * 0.45;
                            slitFlareX = sinTh * activeFwd * Math.pow(v, 1.2) * 0.065;
                        } else {
                            // Arka panel: Bacak geriye gittiğinde (hip.rotation.x > 0 ise uç -Z'ye, yani ARKAYA gider!)
                            const backLeft = Math.max(0, lHipAngle);
                            const backRight = Math.max(0, rHipAngle);
                            const maxBack = Math.max(backLeft, backRight);

                            const activeBack = backLeft * leftWeight + backRight * rightWeight + maxBack * centerBlend * 0.75;
                            const distAlongLeg = v * panel.skirtLength;

                            legPushZ = -Math.sin(activeBack) * distAlongLeg * 1.18 - (activeBack > 0.01 ? 0.022 * Math.min(1, v * 3.0) : 0);
                            legLiftY = (1.0 - Math.cos(activeBack)) * distAlongLeg * 0.40;
                            slitFlareX = sinTh * activeBack * Math.pow(v, 1.2) * 0.055;
                        }

                        // Gerçek zamanlı ipek rüzgar ve adım dalgalanması (Silk Wave & Flutter)
                        const waveAmp = Math.pow(v, 1.45) * (0.008 + walkMag * 0.024);
                        const wavePhase = elapsed * (3.2 + walkMag * 4.5) + vtx.u * 9.0 - v * 5.5 + phase;
                        const flutterZ = Math.sin(wavePhase) * waveAmp * (panel.isSash ? 1.35 : 1.0);
                        const swayX = Math.cos(elapsed * 2.6 + phase - v * 3.5) * Math.pow(v, 1.3) * (0.005 + walkMag * 0.018);

                        posAttr.setXYZ(
                            i,
                            vtx.bx + slitFlareX + swayX,
                            vtx.by + legLiftY,
                            vtx.bz + legPushZ + flutterZ
                        );
                    }
                    posAttr.needsUpdate = true;
                    panel.geom.computeVertexNormals();
                }
            }

            return { bodyGroup, braGroup, updateSkirtClothPhysics };
        }

        // ==========================================
        // 4. ERKEK TANRI & KAHRAMAN GÖVDESİ (Horus, Set, Bek)
        // ==========================================
        function createMaleTorso(muscleScale, torsoMat) {
            const torsoGroup = new THREE.Group();
            const totalH = 0.78;
            const geom = new THREE.CylinderGeometry(1, 1, totalH, 64, 52, false);
            const pos = geom.attributes.position;
            const uv = geom.attributes.uv;

            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const vz = pos.getZ(i);

                const radial = Math.hypot(vx, vz);
                const t = Math.max(0.0, Math.min(1.0, (vy + totalH / 2) / totalH));

                if (radial < 0.001) {
                    pos.setXYZ(i, 0, vy + totalH / 2 - 0.02, 0);
                    uv.setXY(i, 0.5, t);
                    continue;
                }

                const nx = vx / radial;
                const nz = vz / radial;
                const lockedU = (Math.atan2(nx, nz) / (Math.PI * 2)) + 0.5;
                uv.setXY(i, lockedU, t);

                let rx = 0.145;
                let rz = 0.102;
                let centerZ = 0;

                if (t < 0.22) {
                    const k = t / 0.22;
                    rx = (0.148 * (1 - k) + 0.132 * k) * muscleScale;
                    rz = (0.112 * (1 - k) + 0.094 * k) * muscleScale;
                } else if (t < 0.75) {
                    const k = (t - 0.22) / 0.53;
                    const curve = Math.sin(k * Math.PI * 0.60);
                    rx = (0.132 + curve * 0.056) * muscleScale;
                    rz = (0.094 + curve * 0.030) * muscleScale;
                    centerZ = Math.sin(k * Math.PI) * 0.007;
                } else if (t < 0.88) {
                    const k = (t - 0.75) / 0.13;
                    const sk = k * k * (3 - 2 * k);
                    rx = (0.182 * (1 - sk) + 0.060 * sk) * muscleScale;
                    rz = (0.118 * (1 - sk) + 0.058 * sk) * muscleScale;
                } else {
                    const k = (t - 0.88) / 0.12;
                    rx = (0.060 - Math.sin(k * Math.PI) * 0.003) * muscleScale;
                    rz = (0.058 - Math.sin(k * Math.PI) * 0.003) * muscleScale;
                    centerZ = 0.004;
                }

                let xOut = nx * rx;
                let zOut = nz * rz + centerZ;

                const absX = Math.abs(nx);
                if (nz > 0.15 && t > 0.18 && t < 0.75) {
                    const frontWeight = (nz - 0.15) / 0.85;
                    if (t >= 0.50 && t <= 0.74 && absX > 0.06 && absX < 0.84) {
                        const py = (t - 0.50) / 0.24;
                        const pecProfileY = Math.sin(py * Math.PI);
                        const sternumGap = Math.min(1, (absX - 0.06) / 0.18);
                        const outerFade = Math.sin(((absX - 0.06) / 0.78) * Math.PI);
                        zOut += pecProfileY * sternumGap * outerFade * 0.018 * muscleScale * frontWeight;
                    }
                    if (t >= 0.22 && t < 0.49 && absX > 0.05 && absX < 0.46) {
                        const ay = (t - 0.22) / 0.27;
                        const rowWave = Math.pow(Math.abs(Math.sin(ay * Math.PI * 3)), 0.85);
                        const colWave = Math.sin(((absX - 0.05) / 0.41) * Math.PI);
                        zOut += rowWave * colWave * 0.006 * muscleScale * frontWeight;
                    }
                }

                pos.setXYZ(i, xOut, vy + totalH / 2 - 0.02, zOut);
            }

            geom.computeVertexNormals();
            const torsoMesh = new THREE.Mesh(geom, torsoMat);
            torsoMesh.castShadow = true;
            torsoMesh.receiveShadow = true;
            torsoGroup.add(torsoMesh);

            return torsoGroup;
        }

        // ==========================================
        // 5. UÇLARI İNCELEN (TAPERED) DOĞAL 3B KADIN SAÇ SİSTEMİ
        // (Küt boru uçlarını kaldırır, uçları doğal saç teli gibi sivrilen ve gövdeye girmeyen bukleler üretir!)
        // ==========================================
        function createTaperedHairStrand(curvePoints, baseRadius, hairMat, goldMat = null, addRingAt = -1) {
            const curve = new THREE.CatmullRomCurve3(curvePoints);
            const tubularSegs = 28;
            const radialSegs = 10;
            const geom = new THREE.TubeGeometry(curve, tubularSegs, baseRadius, radialSegs, false);
            const pos = geom.attributes.position;

            // Saç buklesinin kökünden ucuna doğru doğal incelme (Taper to fine tip) ve saç teli olukları
            for (let i = 0; i <= tubularSegs; i++) {
                const u = i / tubularSegs;
                const center = curve.getPointAt(u);
                // Ortada dolgun, uçta 0.08'e kadar incelen doğal saç tutamı profili
                const taper = u < 0.15
                    ? (0.75 + (u / 0.15) * 0.25)
                    : (u > 0.65 ? Math.max(0.06, 1.0 - ((u - 0.65) / 0.35) * 0.94) : 1.0 + Math.sin(u * Math.PI * 3) * 0.08);

                for (let j = 0; j <= radialSegs; j++) {
                    const idx = i * (radialSegs + 1) + j;
                    if (idx >= pos.count) continue;
                    const vx = pos.getX(idx) - center.x;
                    const vy = pos.getY(idx) - center.y;
                    const vz = pos.getZ(idx) - center.z;
                    const strandGroove = 1.0 + Math.sin((j / radialSegs) * Math.PI * 6) * 0.08;
                    pos.setXYZ(
                        idx,
                        center.x + vx * taper * strandGroove,
                        center.y + vy * taper * strandGroove,
                        center.z + vz * taper * strandGroove
                    );
                }
            }
            geom.computeVertexNormals();
            const group = new THREE.Group();
            const mesh = new THREE.Mesh(geom, hairMat);
            mesh.castShadow = true;
            group.add(mesh);

            if (goldMat && addRingAt > 0 && addRingAt < 1) {
                const ringPt = curve.getPointAt(addRingAt);
                const ring = new THREE.Mesh(new THREE.TorusGeometry(baseRadius * 0.92, 0.0028, 8, 16), goldMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.copy(ringPt);
                group.add(ring);
            }
            return group;
        }

        function createRealisticFlowingFemaleHair(role, headRoot, goldMat) {
            const hairColor = role === 'zaya' ? 0x261207 : (role === 'hathor' || role === 'dancer' ? 0x180a05 : 0x100806);
            const hairMat = new THREE.MeshStandardMaterial({
                color: hairColor,
                roughness: 0.42,
                metalness: 0.16
            });

            // 1. Kafa derisini ve tepeyi saran ortadan ayrılmış hacimli saç kökü
            const crownHairGeom = new THREE.SphereGeometry(0.108, 40, 32);
            const cPos = crownHairGeom.attributes.position;
            for (let i = 0; i < cPos.count; i++) {
                let hx = cPos.getX(i), hy = cPos.getY(i), hz = cPos.getZ(i);
                const ny = hy / 0.108;
                const nz = hz / 0.108;
                if (nz > 0.14 && ny < 0.36) {
                    hx *= 0.60; hy *= 0.70; hz *= 0.58;
                } else {
                    hx *= 0.90; hy *= 1.13; hz *= 1.05;
                    // Ortadan ayrım (center part) ve doğal saç dalgası
                    if (ny > 0.55 && Math.abs(hx) < 0.015) {
                        hy -= (0.015 - Math.abs(hx)) * 0.25;
                    }
                }
                cPos.setXYZ(i, hx, hy, hz);
            }
            crownHairGeom.computeVertexNormals();
            const crownHair = new THREE.Mesh(crownHairGeom, hairMat);
            crownHair.position.set(0, 0.010, -0.008);
            headRoot.add(crownHair);

            // 2. Yüzü çerçeveleyip omuzların ve göğüslerin DIŞINDAN süzülen ucu incelen 3B bukleler (Gövdeye çarpma yapmaz!)
            [-1, 1].forEach(dir => {
                for (let b = 0; b < 4; b++) {
                    const xSpread = dir * (0.074 + b * 0.015);
                    const zStart = 0.024 - b * 0.018;
                    const wavePts = [
                        new THREE.Vector3(dir * 0.042, 0.078, zStart + 0.02),
                        new THREE.Vector3(xSpread * 1.02, 0.018, zStart + 0.014),
                        new THREE.Vector3(xSpread * 1.08, -0.055, zStart + 0.026),
                        new THREE.Vector3(xSpread * 1.18, -0.135, zStart + 0.048),
                        new THREE.Vector3(xSpread * 1.14, -0.215 - b * 0.022, zStart + 0.056),
                        new THREE.Vector3(xSpread * 1.06, -0.295 - b * 0.028, zStart + 0.044)
                    ];
                    const strand = createTaperedHairStrand(
                        wavePts,
                        0.0145 - b * 0.0015,
                        hairMat,
                        goldMat,
                        b < 2 ? 0.62 : -1
                    );
                    headRoot.add(strand);
                }
            });

            // 3. Sırttan aşağı omuzların dışından dalgalar halinde dökülen gür arka saç yelesi (15 adet ucu incelen 3B bukle)
            for (let idx = -7; idx <= 7; idx++) {
                const normIdx = idx / 7;
                const xBase = normIdx * 0.084;
                const zBase = -0.082 + Math.abs(normIdx) * 0.016;
                const lengthBoost = (1.0 - Math.abs(normIdx) * 0.22) * 0.44;

                const backPts = [
                    new THREE.Vector3(xBase * 0.75, 0.058, zBase + 0.012),
                    new THREE.Vector3(xBase * 0.96, -0.025, zBase - 0.018),
                    new THREE.Vector3(xBase * 1.10 + Math.sin(idx) * 0.008, -0.125, zBase - 0.042),
                    new THREE.Vector3(xBase * 1.06 - Math.sin(idx) * 0.008, -0.225, zBase - 0.048),
                    new THREE.Vector3(xBase * 1.12, -0.225 - lengthBoost * 0.52, zBase - 0.054),
                    new THREE.Vector3(xBase * 1.04, -0.225 - lengthBoost, zBase - 0.044)
                ];
                const backStrand = createTaperedHairStrand(
                    backPts,
                    0.0165,
                    hairMat,
                    goldMat,
                    Math.abs(idx) % 3 === 0 ? 0.72 : -1
                );
                headRoot.add(backStrand);
            }
        }

        // ==========================================
        // 6. GERÇEKÇİ 3B İNSAN YÜZÜ (DOĞAL GÖZ KAPAĞI & SÜRMELİ BAKIŞ), TANRIÇA TAÇLARI VE MİĞFERLER
        // ==========================================
        function createHeadAndCrown(role, isFemale, faceMat, skinMat, goldMat, darkGoldMat, accentMat, obsidianMat, gemMat) {
            const headRoot = new THREE.Group();

            // A) HORUS SAVAŞ FORMU: ALTIN ŞAHİN MİĞFERİ
            if (role === 'horus_god') {
                const skullGeom = new THREE.SphereGeometry(0.116, 40, 32);
                const sPos = skullGeom.attributes.position;
                for (let i = 0; i < sPos.count; i++) {
                    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
                    const ny = y / 0.116, nz = z / 0.116;
                    x *= 0.82; y *= 0.98; z *= 1.25;
                    if (nz > 0.15) {
                        x *= (1.0 - nz * 0.35);
                        if (ny > 0.05 && ny < 0.35) z += Math.sin(((ny - 0.05) / 0.30) * Math.PI) * 0.026;
                    }
                    if (nz < -0.1 && ny < 0.2) z -= (1.0 - Math.abs(x) / 0.10) * 0.045;
                    sPos.setXYZ(i, x, y, z);
                }
                skullGeom.computeVertexNormals();
                headRoot.add(new THREE.Mesh(skullGeom, goldMat));

                const beakShape = new THREE.Shape();
                beakShape.moveTo(0, 0.036);
                beakShape.quadraticCurveTo(0.088, 0.030, 0.118, -0.044);
                beakShape.quadraticCurveTo(0.062, -0.014, 0, -0.015);
                beakShape.closePath();
                const beakGeom = new THREE.ExtrudeGeometry(beakShape, { depth: 0.024, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: 0.008, bevelThickness: 0.008 });
                beakGeom.center();
                const upperBeak = new THREE.Mesh(beakGeom, darkGoldMat);
                upperBeak.rotation.y = -Math.PI / 2;
                upperBeak.position.set(0, -0.008, 0.146);
                headRoot.add(upperBeak);

                const finShape = new THREE.Shape();
                finShape.moveTo(0, 0.014);
                finShape.quadraticCurveTo(0.10, 0.022, 0.21, -0.008);
                finShape.quadraticCurveTo(0.10, -0.014, 0, -0.012);
                finShape.closePath();
                const finGeom = new THREE.ExtrudeGeometry(finShape, { depth: 0.007, bevelEnabled: true, bevelSize: 0.002, bevelThickness: 0.002 });

                [-1, 1].forEach(dir => {
                    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.018, 14, 12), gemMat);
                    eye.scale.set(1.35, 0.42, 0.55);
                    eye.position.set(dir * 0.040, 0.018, 0.118);
                    eye.rotation.z = -dir * 0.28;
                    eye.rotation.y = dir * 0.42;
                    headRoot.add(eye);

                    for (let k = 0; k < 6; k++) {
                        const fin = new THREE.Mesh(finGeom, k % 2 === 0 ? goldMat : accentMat);
                        fin.scale.set(1.0 - k * 0.09, 1.0, 1.0);
                        fin.rotation.y = Math.PI / 2 + dir * (0.18 + k * 0.04);
                        fin.rotation.x = 0.22 - k * 0.06;
                        fin.position.set(dir * (0.068 + k * 0.005), 0.052 - k * 0.019, 0.025 - k * 0.012);
                        headRoot.add(fin);
                    }
                });
                return headRoot;
            }

            // B) SET SAVAŞ FORMU: OBSİDYEN & ALTIN ÇAKAL MİĞFERİ
            if (role === 'set_god') {
                const skullGeom = new THREE.SphereGeometry(0.114, 40, 32);
                const sPos = skullGeom.attributes.position;
                for (let i = 0; i < sPos.count; i++) {
                    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
                    const ny = y / 0.114, nz = z / 0.114;
                    x *= 0.80; y *= 0.98; z *= 1.28;
                    if (nz > 0.15 && ny < 0.25 && ny > -0.45) {
                        const snoutFactor = (nz - 0.15) / 0.85;
                        x *= (1.0 - snoutFactor * 0.48);
                        z += snoutFactor * 0.072;
                        y -= snoutFactor * 0.016;
                    }
                    sPos.setXYZ(i, x, y, z);
                }
                skullGeom.computeVertexNormals();
                headRoot.add(new THREE.Mesh(skullGeom, obsidianMat));

                const earShape = new THREE.Shape();
                earShape.moveTo(-0.018, 0);
                earShape.quadraticCurveTo(-0.022, 0.15, -0.008, 0.29);
                earShape.lineTo(0.012, 0.27);
                earShape.quadraticCurveTo(0.020, 0.14, 0.016, 0);
                earShape.closePath();
                const earGeom = new THREE.ExtrudeGeometry(earShape, { depth: 0.012, bevelEnabled: true, bevelSize: 0.003, bevelThickness: 0.003 });

                [-1, 1].forEach(dir => {
                    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.018, 14, 12), gemMat);
                    eye.scale.set(1.35, 0.42, 0.55);
                    eye.position.set(dir * 0.039, 0.022, 0.116);
                    eye.rotation.z = -dir * 0.32;
                    eye.rotation.y = dir * 0.40;
                    headRoot.add(eye);

                    const earGroup = new THREE.Group();
                    earGroup.position.set(dir * 0.046, 0.078, -0.018);
                    earGroup.rotation.x = -0.48;
                    earGroup.rotation.z = -dir * 0.14;
                    headRoot.add(earGroup);
                    earGroup.add(new THREE.Mesh(earGeom, obsidianMat));
                });
                return headRoot;
            }

            // C) DOĞAL 3B İNSAN & TANRIÇA YÜZ HEYKELİ
            const headGeom = new THREE.SphereGeometry(0.104, 64, 52);
            const pos = headGeom.attributes.position;
            const uv = headGeom.attributes.uv;

            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                const r = Math.hypot(x, y, z) || 0.104;
                const nx = x / r, ny = y / r, nz = z / r;

                uv.setXY(i, (Math.atan2(nx, nz) / (Math.PI * 2)) + 0.5, Math.max(0.0, Math.min(1.0, (ny + 1.0) * 0.5)));

                x *= isFemale ? 0.79 : 0.84;
                y *= isFemale ? 1.07 : 1.12;
                z *= 0.93;

                if (ny < 0) {
                    const jawTaper = 1.0 + ny * (isFemale ? 0.43 : 0.32);
                    x *= Math.max(isFemale ? 0.44 : 0.54, jawTaper);
                    if (nz > 0.25 && ny < -0.52 && ny > -0.88) {
                        const chinCurve = Math.sin(((ny + 0.88) / 0.36) * Math.PI);
                        z += (1.0 - Math.min(1, Math.abs(nx) / 0.42)) * chinCurve * 0.010;
                    }
                }

                if (nz > 0.25) {
                    const absX = Math.abs(nx);
                    // Elmacık kemikleri
                    if (ny > -0.15 && ny < 0.08 && absX > 0.25 && absX < 0.74) {
                        const cheek = Math.sin(((ny + 0.15) / 0.23) * Math.PI) * Math.sin(((absX - 0.25) / 0.49) * Math.PI);
                        z += cheek * (isFemale ? 0.0085 : 0.007);
                    }
                    // Hafif göz çukuru
                    if (ny > 0.02 && ny < 0.20 && absX > 0.15 && absX < 0.54) {
                        const socketY = Math.sin(((ny - 0.02) / 0.18) * Math.PI);
                        const socketX = Math.sin(((absX - 0.15) / 0.39) * Math.PI);
                        z -= socketY * socketX * 0.005;
                    }
                }

                pos.setXYZ(i, x, y, z);
            }
            headGeom.computeVertexNormals();
            const headMesh = new THREE.Mesh(headGeom, faceMat);
            headMesh.castShadow = true;
            headMesh.receiveShadow = true;
            headRoot.add(headMesh);

            // Zarif 3B Burun
            const noseGroup = new THREE.Group();
            noseGroup.position.set(0, 0.002, 0.091);
            headRoot.add(noseGroup);

            const noseBridge = new THREE.Mesh(new THREE.CylinderGeometry(isFemale ? 0.0048 : 0.0065, isFemale ? 0.0088 : 0.011, 0.034, 14), skinMat);
            noseBridge.scale.set(0.80, 1.0, 0.92);
            noseBridge.rotation.x = -0.25;
            noseBridge.position.set(0, 0.004, 0.004);
            noseGroup.add(noseBridge);

            const noseTip = new THREE.Mesh(new THREE.SphereGeometry(isFemale ? 0.0084 : 0.0102, 16, 14), skinMat);
            noseTip.scale.set(0.98, 0.85, 1.08);
            noseTip.position.set(0, -0.011, 0.010);
            noseGroup.add(noseTip);

            [-1, 1].forEach(dir => {
                const nostril = new THREE.Mesh(new THREE.SphereGeometry(0.0058, 12, 10), skinMat);
                nostril.scale.set(1.05, 0.75, 0.92);
                nostril.position.set(dir * 0.0072, -0.013, 0.005);
                noseGroup.add(nostril);
            });

            // Doğal 3B Dudaklar
            if (isFemale) {
                const isRedLip = ['hathor', 'astarte', 'dancer', 'isis'].includes(role);
                const upperLipMat = new THREE.MeshStandardMaterial({ color: isRedLip ? 0x991b1b : 0xb44c4b, roughness: 0.26 });
                const lowerLipMat = new THREE.MeshStandardMaterial({ color: isRedLip ? 0xdc2626 : 0xcf5c5b, roughness: 0.20 });

                [-1, 1].forEach(dir => {
                    const upperLobe = new THREE.Mesh(new THREE.SphereGeometry(0.0096, 16, 12), upperLipMat);
                    upperLobe.scale.set(1.15, 0.45, 0.62);
                    upperLobe.position.set(dir * 0.0052, -0.033, 0.089);
                    upperLobe.rotation.z = -dir * 0.14;
                    headRoot.add(upperLobe);
                });

                const lowerLip = new THREE.Mesh(new THREE.SphereGeometry(0.014, 18, 14), lowerLipMat);
                lowerLip.scale.set(1.30, 0.46, 0.66);
                lowerLip.position.set(0, -0.041, 0.089);
                headRoot.add(lowerLip);
            } else {
                const upperLip = new THREE.Mesh(new THREE.SphereGeometry(0.0155, 16, 12), new THREE.MeshStandardMaterial({ color: 0x9e503c, roughness: 0.55 }));
                upperLip.scale.set(1.42, 0.34, 0.55);
                upperLip.position.set(0, -0.036, 0.093);
                headRoot.add(upperLip);

                const lowerLip = new THREE.Mesh(new THREE.SphereGeometry(0.0145, 16, 12), new THREE.MeshStandardMaterial({ color: 0xb05c46, roughness: 0.48 }));
                lowerLip.scale.set(1.30, 0.40, 0.60);
                lowerLip.position.set(0, -0.044, 0.092);
                headRoot.add(lowerLip);
            }

            // Canlı Badem Gözler, 3B Üst Göz Kapağı (Şaşkın bakışı önleyen doğal kapak kıvrımı!), İris ve Cleopatra Eyeliner
            const scleraMat = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
            let irisHex = 0x38bdf8;
            if (role === 'hathor' || role === 'bastet') irisHex = 0xf59e0b;
            else if (role === 'nephthys') irisHex = 0x10b981;
            else if (role === 'astarte' || role === 'anat') irisHex = 0xa855f7;
            else if (role === 'female_villager' || role === 'dancer' || role === 'bek') irisHex = 0x5c3416;

            const irisMat = new THREE.MeshBasicMaterial({ color: irisHex });
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            const catchlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const lashMat = new THREE.MeshStandardMaterial({ color: 0x120a07, roughness: 0.4 });

            [-1, 1].forEach(dir => {
                const eyeGroup = new THREE.Group();
                eyeGroup.position.set(dir * 0.0285, 0.0155, 0.088);
                eyeGroup.rotation.y = dir * 0.14;
                eyeGroup.rotation.z = -dir * (isFemale ? 0.06 : 0.02); // Hafif çekik kedi/badem göz açısı
                headRoot.add(eyeGroup);

                const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.0122, 20, 16), scleraMat);
                sclera.scale.set(1.22, 0.68, 0.42);
                eyeGroup.add(sclera);

                // 3B Üst Göz Kapağı (Göz akının üst kısmını doğal şekilde örterek baygın/çekici ve gerçekçi bakış sağlar!)
                const upperEyelid = new THREE.Mesh(
                    new THREE.SphereGeometry(0.0126, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.42),
                    skinMat
                );
                upperEyelid.scale.set(1.24, 0.72, 0.46);
                upperEyelid.rotation.x = -0.22;
                upperEyelid.position.set(0, 0.0006, 0.0004);
                eyeGroup.add(upperEyelid);

                const iris = new THREE.Mesh(new THREE.CircleGeometry(0.0062, 20), irisMat);
                iris.position.set(0, -0.0004, 0.0054);
                eyeGroup.add(iris);

                const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.0030, 16), pupilMat);
                pupil.position.set(0, -0.0004, 0.0056);
                eyeGroup.add(pupil);

                const catchlight = new THREE.Mesh(new THREE.CircleGeometry(0.0014, 10), catchlightMat);
                catchlight.position.set(0.0018, 0.0016, 0.0058);
                eyeGroup.add(catchlight);

                // İnce Üst Kirpik ve Kuyruklu Mısır Sürmesi (Winged Kohl Liner)
                const upperLash = new THREE.Mesh(new THREE.TorusGeometry(0.0122, 0.0014, 8, 22, Math.PI), lashMat);
                upperLash.scale.set(1.26, 0.60, 0.65);
                upperLash.position.set(0, 0.0004, 0.0044);
                eyeGroup.add(upperLash);

                if (isFemale) {
                    const wingTip = new THREE.Mesh(new THREE.ConeGeometry(0.0016, 0.009, 6), lashMat);
                    wingTip.rotation.z = -dir * 1.15;
                    wingTip.position.set(dir * 0.0165, 0.0018, 0.0025);
                    eyeGroup.add(wingTip);
                }

                // Doğal Kavisli Kaşlar (Çok yukarıda durmayan, gözle uyumlu zarif kaş kemeri)
                const brow = new THREE.Mesh(new THREE.TorusGeometry(0.0175, 0.0019, 8, 18, Math.PI * 0.72), lashMat);
                brow.rotation.z = Math.PI * 0.14 - dir * 0.08;
                brow.scale.set(1.14, 0.48, 0.70);
                brow.position.set(-dir * 0.001, 0.0048, 0.0045);
                eyeGroup.add(brow);

                const ear = new THREE.Mesh(new THREE.SphereGeometry(0.018, 12, 12), skinMat);
                ear.scale.set(0.34, 1.12, 0.58);
                ear.position.set(dir * 0.082, 0.003, -0.006);
                headRoot.add(ear);

                if (isFemale) {
                    const earring = new THREE.Mesh(new THREE.TorusGeometry(0.012, 0.0022, 8, 20), goldMat);
                    earring.rotation.y = Math.PI / 2;
                    earring.position.set(dir * 0.085, -0.020, -0.004);
                    headRoot.add(earring);
                }
            });

            // SAÇLAR VE TAÇLAR
            if (isFemale) {
                createRealisticFlowingFemaleHair(role, headRoot, goldMat);

                if (role === 'zaya' || role === 'dancer' || role === 'female_villager') {
                    const diadem = new THREE.Mesh(new THREE.TorusGeometry(0.087, 0.0042, 10, 36), goldMat);
                    diadem.rotation.x = Math.PI / 2 - 0.10;
                    diadem.position.set(0, 0.052, 0.003);
                    headRoot.add(diadem);

                    const browGem = new THREE.Mesh(new THREE.OctahedronGeometry(0.011, 1), gemMat);
                    browGem.position.set(0, 0.050, 0.090);
                    headRoot.add(browGem);
                } else if (role === 'hathor') {
                    const baseCrown = new THREE.Mesh(new THREE.CylinderGeometry(0.064, 0.078, 0.042, 28), goldMat);
                    baseCrown.position.set(0, 0.094, 0.004);
                    headRoot.add(baseCrown);

                    const sunDisk = new THREE.Mesh(new THREE.CylinderGeometry(0.064, 0.064, 0.015, 32), goldMat);
                    sunDisk.rotation.x = Math.PI / 2;
                    sunDisk.position.set(0, 0.185, 0.008);
                    headRoot.add(sunDisk);

                    [-1, 1].forEach(dir => {
                        const horn = new THREE.Mesh(new THREE.TorusGeometry(0.088, 0.0085, 12, 28, Math.PI * 0.76), goldMat);
                        horn.position.set(dir * 0.015, 0.185, 0.008);
                        horn.rotation.z = dir === 1 ? -0.35 : Math.PI - 0.42;
                        headRoot.add(horn);
                    });
                } else if (role === 'nephthys') {
                    const vultureCap = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.084, 0.044, 28), goldMat);
                    vultureCap.position.set(0, 0.092, 0.002);
                    headRoot.add(vultureCap);

                    const enclosure = new THREE.Mesh(new THREE.BoxGeometry(0.060, 0.078, 0.018), goldMat);
                    enclosure.position.set(0, 0.154, 0.008);
                    headRoot.add(enclosure);

                    const basketTop = new THREE.Mesh(new THREE.CylinderGeometry(0.044, 0.020, 0.028, 20), accentMat);
                    basketTop.position.set(0, 0.205, 0.008);
                    headRoot.add(basketTop);
                } else if (role === 'isis') {
                    const diadem = new THREE.Mesh(new THREE.CylinderGeometry(0.070, 0.084, 0.040, 28), goldMat);
                    diadem.position.set(0, 0.090, 0.004);
                    headRoot.add(diadem);

                    const sunDisk = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.014, 28), goldMat);
                    sunDisk.rotation.x = Math.PI / 2;
                    sunDisk.position.set(0, 0.158, 0.010);
                    headRoot.add(sunDisk);

                    const throneBack = new THREE.Mesh(new THREE.BoxGeometry(0.040, 0.088, 0.015), goldMat);
                    throneBack.position.set(-0.010, 0.222, 0.010);
                    headRoot.add(throneBack);

                    const throneSeat = new THREE.Mesh(new THREE.BoxGeometry(0.058, 0.042, 0.016), accentMat);
                    throneSeat.position.set(0.005, 0.198, 0.010);
                    headRoot.add(throneSeat);
                } else if (role === 'astarte' || role === 'anat') {
                    const helmBand = new THREE.Mesh(new THREE.CylinderGeometry(0.076, 0.086, 0.042, 28), goldMat);
                    helmBand.position.set(0, 0.080, 0.005);
                    headRoot.add(helmBand);

                    [-1, 1].forEach(dir => {
                        const hornFin = new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.15, 6), role === 'anat' ? accentMat : goldMat);
                        hornFin.position.set(dir * 0.075, 0.112, 0.012);
                        hornFin.rotation.z = -dir * 0.26;
                        hornFin.rotation.x = -0.22;
                        headRoot.add(hornFin);
                    });
                } else if (role === 'bastet') {
                    const catBand = new THREE.Mesh(new THREE.TorusGeometry(0.086, 0.0055, 10, 32), goldMat);
                    catBand.rotation.x = Math.PI / 2 - 0.12;
                    catBand.position.set(0, 0.054, 0.004);
                    headRoot.add(catBand);

                    [-1, 1].forEach(dir => {
                        const catEar = new THREE.Mesh(new THREE.ConeGeometry(0.026, 0.072, 4), goldMat);
                        catEar.position.set(dir * 0.056, 0.114, 0.005);
                        catEar.rotation.y = Math.PI / 4;
                        catEar.rotation.z = -dir * 0.22;
                        headRoot.add(catEar);
                    });
                }
            } else {
                // Erkek Karakter Saç & Sakal (Horus İnsan ve Bek)
                const isRoyal = role === 'horus_human';
                const hairMat = new THREE.MeshStandardMaterial({ color: isRoyal ? 0x3b2312 : 0x221309, roughness: 0.75 });

                const beardGeom = new THREE.SphereGeometry(0.1055, 36, 28);
                const bPos = beardGeom.attributes.position;
                for (let i = 0; i < bPos.count; i++) {
                    let bx = bPos.getX(i), by = bPos.getY(i), bz = bPos.getZ(i);
                    const ny = by / 0.1055, nz = bz / 0.1055, absX = Math.abs(bx) / 0.1055;
                    bx *= 0.85; by *= 1.13; bz *= 0.94;
                    if (ny < 0) bx *= Math.max(0.55, 1.0 + ny * 0.32);
                    const isJawBeard = (nz > -0.05 && ny < -0.14 && !(ny > -0.46 && absX < 0.25));
                    if (!isJawBeard) { bx *= 0.75; by *= 0.75; bz *= 0.75; }
                    bPos.setXYZ(i, bx, by, bz);
                }
                beardGeom.computeVertexNormals();
                headRoot.add(new THREE.Mesh(beardGeom, hairMat));

                const hairGeom = new THREE.SphereGeometry(0.109, 36, 28);
                const hPos = hairGeom.attributes.position;
                for (let i = 0; i < hPos.count; i++) {
                    let hx = hPos.getX(i), hy = hPos.getY(i), hz = hPos.getZ(i);
                    const ny = hy / 0.109, nz = hz / 0.109;
                    if (nz > 0.16 && ny < 0.38) { hx *= 0.65; hy *= 0.75; hz *= 0.65; }
                    else { hx *= 0.89; hy *= 1.14; hz *= 1.03; }
                    hPos.setXYZ(i, hx, hy, hz);
                }
                hairGeom.computeVertexNormals();
                const hairMesh = new THREE.Mesh(hairGeom, hairMat);
                hairMesh.position.set(0, 0.006, -0.006);
                headRoot.add(hairMesh);

                if (isRoyal) {
                    const crown = new THREE.Mesh(new THREE.TorusGeometry(0.092, 0.008, 12, 32), goldMat);
                    crown.rotation.x = Math.PI / 2 - 0.12;
                    crown.position.set(0, 0.056, 0.002);
                    headRoot.add(crown);
                }
            }

            return headRoot;
        }

        // ==========================================
        // 7. YELPAZE KAVİSLİ BİYOMEKANİK TANRI & TANRIÇA KANATLARI
        // ==========================================
        function createBiomechanicalWings(goldMat, darkGoldMat, accentMat, glowMat) {
            const wingsGroup = new THREE.Group();
            wingsGroup.position.set(0, 0.44, -0.095);

            const featherShape = new THREE.Shape();
            featherShape.moveTo(0, 0);
            featherShape.quadraticCurveTo(0.030, -0.35, 0.016, -0.82);
            featherShape.lineTo(0, -1.0);
            featherShape.lineTo(-0.015, -0.85);
            featherShape.quadraticCurveTo(-0.022, -0.40, 0, 0);
            featherShape.closePath();

            const featherGeom = new THREE.ExtrudeGeometry(featherShape, {
                depth: 0.007,
                bevelEnabled: true,
                bevelSegments: 2,
                steps: 1,
                bevelSize: 0.0025,
                bevelThickness: 0.0025
            });

            ['left', 'right'].forEach(side => {
                const dir = side === 'left' ? -1 : 1;

                const innerWing = new THREE.Group();
                innerWing.position.set(dir * 0.065, 0, 0);
                wingsGroup.add(innerWing);

                const outerWing = new THREE.Group();
                outerWing.position.set(dir * 0.46, 0.22, -0.02);
                innerWing.add(outerWing);

                for (let s = 0; s < 5; s++) {
                    const seg = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.022 - s * 0.002, 0.026 - s * 0.002, 0.13, 12),
                        s % 2 === 0 ? goldMat : darkGoldMat
                    );
                    seg.position.set(dir * (0.055 + s * 0.09), 0.03 + s * 0.045, 0);
                    seg.rotation.z = -dir * (1.08 + s * 0.04);
                    innerWing.add(seg);
                }

                const jointGem = new THREE.Mesh(new THREE.OctahedronGeometry(0.030, 1), glowMat);
                jointGem.position.set(0, 0.02, 0.012);
                outerWing.add(jointGem);

                for (let i = 0; i < 10; i++) {
                    const t = i / 9;
                    const fx = dir * (0.04 + i * 0.044);
                    const fy = 0.02 + t * 0.20;
                    const fanAngle = dir * (0.12 + t * 0.36);

                    const cov = new THREE.Mesh(featherGeom, goldMat);
                    cov.scale.set(dir * 0.82, 0.25, 1.1);
                    cov.position.set(fx, fy, 0.012);
                    cov.rotation.z = fanAngle;
                    innerWing.add(cov);

                    const mid = new THREE.Mesh(featherGeom, accentMat);
                    mid.scale.set(dir * 0.90, 0.42 + Math.sin(t * Math.PI) * 0.08, 1.0);
                    mid.position.set(fx, fy, 0.004);
                    mid.rotation.z = fanAngle * 1.05;
                    innerWing.add(mid);

                    const sec = new THREE.Mesh(featherGeom, i % 2 === 0 ? goldMat : darkGoldMat);
                    sec.scale.set(dir * 0.96, 0.62 + Math.sin(t * Math.PI) * 0.14, 1.0);
                    sec.position.set(fx, fy, -0.005);
                    sec.rotation.z = fanAngle * 1.10;
                    sec.castShadow = true;
                    innerWing.add(sec);
                }

                for (let j = 0; j < 13; j++) {
                    const t = j / 12;
                    const bx = dir * (j * 0.040);
                    const by = (1.0 - t) * 0.02;
                    const sweepZ = dir * (0.34 + t * 1.12);

                    const priLen = 0.84 + Math.sin(t * Math.PI * 0.7) * 0.30 - t * 0.18;
                    const pri = new THREE.Mesh(featherGeom, j % 3 === 1 ? accentMat : goldMat);
                    pri.scale.set(dir * 1.0, priLen, 1.0);
                    pri.position.set(bx, by, -0.004);
                    pri.rotation.z = sweepZ;
                    pri.castShadow = true;
                    outerWing.add(pri);
                }

                if (side === 'left') {
                    wingsGroup.leftInner = innerWing;
                    wingsGroup.leftOuter = outerWing;
                } else {
                    wingsGroup.rightInner = innerWing;
                    wingsGroup.rightOuter = outerWing;
                }
            });

            return wingsGroup;
        }

        // ==========================================
        // 8. SİLAHLAR VE TANRIÇA ASALARI
        // ==========================================
        function createAccessoryOrWeapon(role, goldMat, darkGoldMat, obsidianMat, accentMat, gemMat) {

            } else if (role === 'isis' || role === 'nephthys') {
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.010, 0.012, 0.24, 12), goldMat);

                const crossbar = new THREE.Mesh(new THREE.BoxGeometry(0.125, 0.018, 0.018), goldMat);

                const ankhLoop = new THREE.Mesh(new THREE.TorusGeometry(0.046, 0.010, 10, 24), goldMat);

            } else if (['astarte', 'anat', 'horus_human', 'horus_god'].includes(role)) {

                const wingsGuard = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.024, 0.032), accentMat);
