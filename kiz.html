                spearTip.position.y = 1.25;
                spearHolder.add(spearTip);
            } else if (role === 'set_god') {
                const staffHolder = new THREE.Group();
                staffHolder.rotation.x = 0.14;
                staffHolder.rotation.z = -0.04;
                wGroup.add(staffHolder);

                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.016, 1.82, 14), obsidianMat);
                shaft.position.y = 0.28;
                staffHolder.add(shaft);

                const headFork = new THREE.Mesh(new THREE.ConeGeometry(0.054, 0.32, 4), goldMat);
                headFork.rotation.y = Math.PI / 4;
                headFork.scale.set(0.45, 1.0, 1.1);
                headFork.position.y = 1.32;
                staffHolder.add(headFork);

                const chaosOrb = new THREE.Mesh(new THREE.OctahedronGeometry(0.032, 1), gemMat);
                chaosOrb.position.y = 1.16;
                staffHolder.add(chaosOrb);
            } else if (role === 'bek') {
                const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.013, 0.15, 10), darkGoldMat);
                hilt.rotation.x = Math.PI / 2;
                wGroup.add(hilt);

                const khopeshShape = new THREE.Shape();
                khopeshShape.moveTo(0, 0);
                khopeshShape.lineTo(0, 0.14);
                khopeshShape.quadraticCurveTo(0.09, 0.24, 0.02, 0.38);
                khopeshShape.lineTo(-0.01, 0.42);
                khopeshShape.quadraticCurveTo(0.05, 0.24, -0.018, 0.13);
                khopeshShape.lineTo(-0.018, 0);
                khopeshShape.closePath();

                const bladeGeom = new THREE.ExtrudeGeometry(khopeshShape, { depth: 0.006, bevelEnabled: true, bevelSize: 0.002, bevelThickness: 0.002 });
                const blade = new THREE.Mesh(bladeGeom, goldMat);
                blade.rotation.x = Math.PI / 2;
                blade.rotation.y = Math.PI / 2;
                blade.position.set(0.003, 0, 0.08);
                wGroup.add(blade);
            } else if (role === 'female_villager') {
                const clayMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.55 });
                const jarBody = new THREE.Mesh(new THREE.SphereGeometry(0.058, 18, 16), clayMat);
                jarBody.scale.set(1.0, 1.30, 1.0);
                jarBody.position.set(0, -0.080, 0.04);
                wGroup.add(jarBody);

                const jarNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.020, 0.055, 14), goldMat);
                jarNeck.position.set(0, -0.008, 0.04);
                wGroup.add(jarNeck);
            }

            return wGroup;
        }

        // ==========================================
        // 9. ANA KARAKTER OLUŞTURUCU (TANRIÇALAR, KADIN KÖYLÜLER VE TANRILAR)
        // ==========================================
        function createCharacter(config) {
            const {
                name,
                desc = '',
                role = 'zaya',
                isFemale = true,
                scale = 1.0,
                skinTone = 'pearl',
                curveScale = 1.06
            } = config;

            const root = new THREE.Group();
            root.scale.set(scale, scale, scale);

            const isHorusGod = role === 'horus_god';
            const isSetGod = role === 'set_god';
            const isArmoredGod = isHorusGod || isSetGod;
            const hasWings = ['nephthys', 'isis', 'horus_god', 'set_god'].includes(role);

            // PBR Materyaller
            const goldMat = new THREE.MeshStandardMaterial({
                map: window.textures.goldTex,
                envMap: window.textures.envMap,
                envMapIntensity: 1.85,
                color: 0xffcf40,
                emissive: 0x241200,
                emissiveIntensity: 0.10,
                metalness: 0.88,
                roughness: 0.22
            });

            const darkGoldMat = new THREE.MeshStandardMaterial({
                map: window.textures.goldTex,
                envMap: window.textures.envMap,
                envMapIntensity: 1.65,
                color: 0xc27815,
                metalness: 0.88,
                roughness: 0.28
            });

            const obsidianMat = new THREE.MeshStandardMaterial({
                envMap: window.textures.envMap,
                envMapIntensity: 1.75,
                color: 0x26232b,
                metalness: 0.84,
                roughness: 0.24
            });

            let accentColorHex = 0x0284c7;
            let gemColorHex = 0x38bdf8;
            let fabricTex = window.textures.fabricZaya;

            if (role === 'hathor') { accentColorHex = 0xd97706; gemColorHex = 0xfde047; fabricTex = window.textures.fabricHathor; }
            else if (role === 'nephthys') { accentColorHex = 0x0d9488; gemColorHex = 0x2dd4bf; fabricTex = window.textures.fabricNephthys; }
            else if (role === 'isis' || role === 'horus_human' || role === 'horus_god') { accentColorHex = 0x1d4ed8; gemColorHex = 0x7dd3fc; fabricTex = window.textures.fabricIsis; }
            else if (role === 'astarte' || role === 'set_god') { accentColorHex = 0x991b1b; gemColorHex = 0xf97316; fabricTex = window.textures.fabricAstarte; }
            else if (role === 'anat') { accentColorHex = 0x6b21a8; gemColorHex = 0xc084fc; fabricTex = window.textures.fabricAnat; }
            else if (role === 'bastet') { accentColorHex = 0x18181b; gemColorHex = 0xfacc15; fabricTex = window.textures.fabricBastet; }
            else if (role === 'female_villager') { accentColorHex = 0xb45309; gemColorHex = 0xfbbf24; fabricTex = window.textures.fabricVillager; }
            else if (role === 'dancer') { accentColorHex = 0xbe123c; gemColorHex = 0xfb7185; fabricTex = window.textures.fabricDancer; }

            const accentMat = new THREE.MeshStandardMaterial({
                envMap: window.textures.envMap,
                envMapIntensity: 1.45,
                color: accentColorHex,
                metalness: 0.55,
                roughness: 0.25
            });

            const gemMat = new THREE.MeshBasicMaterial({ color: gemColorHex });

            // Cilt Materyalleri
            let bodyTex = window.textures.femBodyPearl;
            let faceTex = window.textures.femFacePearl;
            let skinColorHex = 0xda9e7a;

            if (!isFemale) {
                bodyTex = role === 'horus_human' ? window.textures.maleTorsoHorus : window.textures.maleTorsoBek;
                faceTex = role === 'horus_human' ? window.textures.maleFaceHorus : window.textures.maleFaceBek;
                skinColorHex = role === 'horus_human' ? 0xd08e64 : 0xc48058;
            } else if (skinTone === 'golden') {
                bodyTex = window.textures.femBodyGolden;
                faceTex = window.textures.femFaceGolden;
                skinColorHex = 0xca885e;
            } else if (skinTone === 'bronze') {
                bodyTex = window.textures.femBodyBronze;
                faceTex = window.textures.femFaceBronze;
                skinColorHex = 0xb8744c;
            }

            const bodyMat = isHorusGod ? darkGoldMat : (isSetGod ? obsidianMat : new THREE.MeshStandardMaterial({
                map: bodyTex,
                color: 0xffffff,
                roughness: 0.42,
                metalness: 0.03,
                envMap: window.textures.envMap,
                envMapIntensity: 0.28
            }));

            const faceMat = isHorusGod ? goldMat : (isSetGod ? obsidianMat : new THREE.MeshStandardMaterial({
                map: faceTex,
                color: 0xffffff,
                roughness: 0.40,
                metalness: 0.02,
                envMap: window.textures.envMap,
                envMapIntensity: 0.25
            }));

            const limbSkinMat = isHorusGod ? goldMat : (isSetGod ? obsidianMat : new THREE.MeshStandardMaterial({
                color: skinColorHex,
                roughness: 0.42,
                metalness: 0.03,
                envMap: window.textures.envMap,
                envMapIntensity: 0.28
            }));

            const fabricMat = new THREE.MeshStandardMaterial({
                map: isFemale ? fabricTex : window.textures.linenMale,
                bumpMap: isFemale ? fabricTex : window.textures.linenMale,
                bumpScale: 0.0025,
                color: 0xffffff,
                roughness: 0.48,
                metalness: 0.12,
                envMap: window.textures.envMap,
                envMapIntensity: 0.45
            });

            // PELVIS & SPINE HİYERARŞİSİ
            const pelvis = new THREE.Group();
            pelvis.position.y = 0.94;
            root.add(pelvis);

            const spine = new THREE.Group();
            spine.position.y = 0.03;
            pelvis.add(spine);

            let bustGroup = null;
            let updateSkirtClothPhysics = null;

            if (isFemale) {
                // TEK PARÇA KESİNTİSİZ KADIN VÜCUDU + ÇARPIŞMASIZ 3B BÜSTİYER + GERÇEK ZAMANLI HAREKETLİ KUMAŞ ETEK
                const femAttire = createSeamlessFemaleBodyAndAttire(
                    role,
                    bodyMat,
                    limbSkinMat,
                    fabricMat,
                    goldMat,
                    accentMat,
                    gemMat,
                    curveScale
                );
                spine.add(femAttire.bodyGroup);
                bustGroup = femAttire.braGroup;
                updateSkirtClothPhysics = femAttire.updateSkirtClothPhysics;
            } else {
                // ERKEK TANRI & KAHRAMAN GÖVDESİ VE SHENDYT ETEĞİ
                const muscleScale = isArmoredGod ? 1.14 : (role === 'horus_human' ? 1.07 : 1.0);
                const kiltGeom = new THREE.CylinderGeometry(0.136 * muscleScale, 0.188 * muscleScale, 0.34, 48, 8, false);
                const kPos = kiltGeom.attributes.position;
                for (let i = 0; i < kPos.count; i++) {
                    let kx = kPos.getX(i), ky = kPos.getY(i), kz = kPos.getZ(i);
                    const angle = Math.atan2(kx, kz);
                    const pleat = 1.0 + Math.sin(angle * 28) * 0.015;
                    kPos.setXYZ(i, kx * 1.04 * pleat, ky, kz * 0.78 * pleat);
                }
                kiltGeom.computeVertexNormals();
                const kilt = new THREE.Mesh(kiltGeom, isHorusGod ? darkGoldMat : (isSetGod ? obsidianMat : fabricMat));
                kilt.position.y = -0.11;
                kilt.castShadow = true;
                pelvis.add(kilt);

                const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.139 * muscleScale, 0.143 * muscleScale, 0.056, 40), goldMat);
                belt.scale.set(1.04, 1.0, 0.79);
                belt.position.y = 0.036;
                pelvis.add(belt);

                const maleTorso = createMaleTorso(muscleScale, bodyMat);
                spine.add(maleTorso);

                if (role !== 'bek') {
                    for (let c = 0; c < 3; c++) {
                        const rScale = 1.0 + c * 0.16;
                        const collarRing = new THREE.Mesh(
                            new THREE.TorusGeometry(0.082 * rScale * muscleScale, 0.012, 12, 36),
                            c % 2 === 0 ? goldMat : (isSetGod ? obsidianMat : accentMat)
                        );
                        collarRing.rotation.x = Math.PI / 2 + 0.24;
                        collarRing.scale.set(1.12, 0.78, 1.0);
                        collarRing.position.set(0, 0.605 - c * 0.022, 0.010 + c * 0.005);
                        spine.add(collarRing);
                    }
                }
            }

            // KAFA, YÜZ, SAÇLAR VE TAÇ / MİĞFER
            const head = createHeadAndCrown(
                role,
                isFemale,
                faceMat,
                limbSkinMat,
                goldMat,
                darkGoldMat,
                accentMat,
                obsidianMat,
                gemMat
            );
            head.position.y = isFemale ? 0.64 : 0.77;
            spine.add(head);

            // OMUZLAR, KOLLAR VE ELLER (Kadınlarda doğal omuz genişliğiyle göğüs/kalça dışından zarifçe iner)
            const arms = {};
            const mScale = isFemale ? 1.0 : (isArmoredGod ? 1.14 : 1.05);
            const armProfile = isFemale ? [
                [0.00, 0.045, 0.044, 0.00],
                [0.18, 0.041, 0.040, 0.00],
                [0.38, 0.036, 0.038, 0.003],
                [0.52, 0.032, 0.031, 0.00],
                [0.68, 0.033, 0.032, 0.002],
                [0.92, 0.025, 0.023, 0.00],
                [1.00, 0.023, 0.021, 0.00]
            ] : [
                [0.00, 0.064 * mScale, 0.060 * mScale, 0.00],
                [0.18, 0.058 * mScale, 0.056 * mScale, 0.00],
                [0.36, 0.048 * mScale, 0.054 * mScale, 0.005],
                [0.52, 0.042 * mScale, 0.040 * mScale, 0.00],
                [0.66, 0.045 * mScale, 0.043 * mScale, 0.004],
                [0.92, 0.034, 0.030, 0.00],
                [1.00, 0.032, 0.028, 0.00]
            ];

            ['left', 'right'].forEach(side => {
                const dir = side === 'left' ? -1 : 1;
                const shoulder = new THREE.Group();
                shoulder.position.set(dir * (isFemale ? 0.142 : 0.152 * mScale), isFemale ? 0.445 : 0.555, 0);
                spine.add(shoulder);

                const deltoidCap = new THREE.Mesh(new THREE.SphereGeometry(isFemale ? 0.046 : 0.062 * mScale, 18, 14), limbSkinMat);
                deltoidCap.scale.set(1.04, 0.90, 0.94);
                deltoidCap.position.set(-dir * 0.010, -0.010, 0);
                shoulder.add(deltoidCap);

                const continuousArm = createContinuousSkinnedLimb(isFemale ? 0.49 : 0.54, 0.52, armProfile, limbSkinMat, true);
                shoulder.add(continuousArm.mesh);

                // Üst Kol Pazubendi & Bileklik
                const armlet = new THREE.Mesh(new THREE.TorusGeometry(isFemale ? 0.039 : 0.050, 0.0042, 10, 24), goldMat);
                armlet.rotation.x = Math.PI / 2 + 0.12;
                armlet.position.y = -0.04;
                continuousArm.upperGroup.add(armlet);

                const bracer = new THREE.Mesh(new THREE.CylinderGeometry(isFemale ? 0.032 : 0.042, isFemale ? 0.026 : 0.034, 0.09, 20), goldMat);
                bracer.position.y = -0.14;
                continuousArm.lowerGroup.add(bracer);

                // Hathor'un 42 Yıldız Bilekliği
                if (role === 'hathor') {
                    for (let st = 0; st < 6; st++) {
                        const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.006, 0), gemMat);
                        const sa = (st / 6) * Math.PI * 2;
                        star.position.set(Math.cos(sa) * 0.032, -0.14, Math.sin(sa) * 0.032);
                        continuousArm.lowerGroup.add(star);
                    }
                }

                const hand = continuousArm.endGroup;
                const palm = new THREE.Mesh(new THREE.BoxGeometry(0.024, 0.042, 0.034), limbSkinMat);
                palm.position.set(0, -0.021, 0.002);
                hand.add(palm);

                if (side === 'right') {
                    const weapon = createAccessoryOrWeapon(role, goldMat, darkGoldMat, obsidianMat, accentMat, gemMat);
                    weapon.position.set(0, -0.035, 0.010);
                    hand.add(weapon);
                }

                arms[side] = { shoulder, continuousArm };
            });

            // KESİNTİSİZ BACAKLAR VE ALTIN SANDALETLER (Kalça tabanına sıfır kaynar!)
            const legs = {};
            const legProfile = isFemale ? [
                [0.00, 0.076 * curveScale, 0.080 * curveScale, 0.00],
                [0.24, 0.068 * curveScale, 0.072 * curveScale, 0.006],
                [0.48, 0.046, 0.047, 0.003],
                [0.64, 0.050, 0.054, -0.007],
                [0.92, 0.030, 0.032, 0.00],
                [1.00, 0.028, 0.030, 0.00]
            ] : [
                [0.00, 0.084 * mScale, 0.086 * mScale, 0.00],
                [0.26, 0.076 * mScale, 0.080 * mScale, 0.008],
                [0.48, 0.054 * mScale, 0.054 * mScale, 0.004],
                [0.64, 0.060 * mScale, 0.064 * mScale, -0.008],
                [0.92, 0.036, 0.038, 0.00],
                [1.00, 0.033, 0.034, 0.00]
            ];

            ['left', 'right'].forEach(side => {
                const dir = side === 'left' ? -1 : 1;
                const hip = new THREE.Group();
                hip.position.set(dir * (isFemale ? 0.072 * curveScale : 0.086 * mScale), isFemale ? -0.07 : -0.04, 0);
                pelvis.add(hip);

                const continuousLeg = createContinuousSkinnedLimb(isFemale ? 0.81 : 0.84, 0.50, legProfile, limbSkinMat, false);
                hip.add(continuousLeg.mesh);

                if (isFemale) {
                    for (let s = 0; s < 4; s++) {
                        const strapRing = new THREE.Mesh(
                            new THREE.TorusGeometry(0.034 + (3 - s) * 0.003, 0.003, 8, 24),
                            goldMat
                        );
                        strapRing.rotation.x = Math.PI / 2 + (s % 2 === 0 ? 0.16 : -0.16);
                        strapRing.position.y = -0.21 - s * 0.040;
                        continuousLeg.lowerGroup.add(strapRing);
                    }
                } else {
                    const greave = new THREE.Mesh(new THREE.CylinderGeometry(0.060 * mScale, 0.038, 0.26, 18), goldMat);
                    greave.position.set(0, -0.20, 0.004);
                    continuousLeg.lowerGroup.add(greave);
                }

                const ankle = continuousLeg.endGroup;
                const foot = new THREE.Mesh(new THREE.SphereGeometry(0.040, 14, 12), isArmoredGod ? goldMat : limbSkinMat);
                foot.scale.set(0.72, 0.44, 1.72);
                foot.position.set(0, -0.022, 0.036);
                foot.castShadow = true;
                ankle.add(foot);

                const sole = new THREE.Mesh(new THREE.BoxGeometry(0.060, 0.012, 0.165), goldMat);
                sole.position.set(0, -0.044, 0.036);
                ankle.add(sole);

                legs[side] = { hip, continuousLeg, ankle };
            });

            let wings = null;
            if (hasWings) {
                wings = createBiomechanicalWings(goldMat, darkGoldMat, isSetGod ? obsidianMat : accentMat, gemMat);
                spine.add(wings);
            }

            return {
                name,
                desc,
                role,
                isFemale,
                scale,
                root,
                pelvis,
                spine,
                bustGroup,
                updateSkirtClothPhysics,
                head,
                arms,
                legs,
                wings,
                elbowL: -0.16,
                elbowR: -0.20,
                kneeL: 0.04,
                kneeR: 0.04,
                phase: Math.random() * Math.PI * 2,
                aiTarget: new THREE.Vector3(),
                aiTimer: Math.random() * 3
            };
        }

        // ==========================================
        // 10. ANİMASYON MOTORU (KADINLARDA CONTRAPPOSTO, KALÇA SALINIMI VE GERÇEK ZAMANLI ETEK KUMAŞ FİZİĞİ)
        // ==========================================
        function animateCharacter(char, isWalking, speedRatio, delta, elapsed, isSelected) {
            const { pelvis, spine, head, arms, legs, wings, isFemale } = char;
            const poseBoost = isSelected && actionPoseActive;

            if (isWalking) {
                char.phase += delta * 6.8 * Math.max(0.55, speedRatio);
                const p = char.phase;

                const hipSway = isFemale ? 0.072 : 0.035;
                const hipYaw = isFemale ? 0.11 : 0.07;

                pelvis.position.y = 0.94 - Math.abs(Math.cos(p)) * 0.024;
                pelvis.position.x = isFemale ? Math.sin(p) * 0.016 * speedRatio : 0;
                pelvis.rotation.z = Math.sin(p) * hipSway * speedRatio;
                pelvis.rotation.y = -Math.sin(p) * hipYaw * speedRatio;

                // Üst gövde (spine) dönüşünü pelvis ile dengeli tutuyoruz ki etek bacakların merkezinden sapmasın
                spine.rotation.y = Math.sin(p) * 0.06 * speedRatio;
                spine.rotation.x = 0.02 * speedRatio;
                spine.rotation.z = -Math.sin(p) * (hipSway * 0.55) * speedRatio;

                head.rotation.y = -spine.rotation.y * 0.75;
                head.rotation.x = -0.015 + Math.cos(p * 2) * 0.012;

                const lHip = Math.sin(p) * 0.44 * speedRatio;
                const rHip = Math.sin(p + Math.PI) * 0.44 * speedRatio;
                legs.left.hip.rotation.x = lHip;
                legs.right.hip.rotation.x = rHip;

                char.kneeL = Math.max(0.03, -Math.cos(p - 0.3) * 0.68 * speedRatio + 0.05);
                char.kneeR = Math.max(0.03, -Math.cos(p + Math.PI - 0.3) * 0.68 * speedRatio + 0.05);
                legs.left.continuousLeg.updateBend(char.kneeL);
                legs.right.continuousLeg.updateBend(char.kneeR);

                const lArm = Math.sin(p + Math.PI) * 0.36 * speedRatio;
                const rArm = Math.sin(p) * 0.36 * speedRatio;

                arms.left.shoulder.rotation.x = lArm;
                arms.left.shoulder.rotation.z = isFemale ? -0.14 : -0.09;
                char.elbowL = -0.18 - Math.max(0, -lArm) * 0.36;
                arms.left.continuousArm.updateBend(char.elbowL);

                arms.right.shoulder.rotation.x = rArm;
                arms.right.shoulder.rotation.z = isFemale ? 0.14 : 0.09;
                char.elbowR = -0.22 - Math.max(0, -rArm) * 0.36;
                arms.right.continuousArm.updateBend(char.elbowR);
            } else {
                const breath = Math.sin(elapsed * 2.1 + char.phase);
                const sway = Math.sin(elapsed * 0.70 + char.phase);

                const targetHipZ = isFemale ? (poseBoost ? 0.075 : 0.038 + sway * 0.018) : sway * 0.015;
                const targetHipY = isFemale ? (poseBoost ? -0.12 : sway * 0.035) : sway * 0.03;

                pelvis.position.y = THREE.MathUtils.lerp(pelvis.position.y, 0.94 + breath * 0.004, 0.12);
                pelvis.position.x = THREE.MathUtils.lerp(pelvis.position.x, isFemale ? targetHipZ * 0.20 : 0, 0.08);
                pelvis.rotation.z = THREE.MathUtils.lerp(pelvis.rotation.z, targetHipZ, 0.08);
                pelvis.rotation.y = THREE.MathUtils.lerp(pelvis.rotation.y, targetHipY, 0.08);

                spine.rotation.x = THREE.MathUtils.lerp(spine.rotation.x, (poseBoost ? -0.055 : -0.015) + breath * 0.014, 0.1);
                spine.rotation.y = THREE.MathUtils.lerp(spine.rotation.y, -sway * 0.03, 0.08);
                spine.rotation.z = THREE.MathUtils.lerp(spine.rotation.z, -targetHipZ * 0.55, 0.1);

                head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, sway * 0.08, 0.08);
                head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, -breath * 0.012, 0.08);

                legs.left.hip.rotation.x = THREE.MathUtils.lerp(legs.left.hip.rotation.x, poseBoost && isFemale ? -0.12 : -0.03, 0.12);
                legs.right.hip.rotation.x = THREE.MathUtils.lerp(legs.right.hip.rotation.x, 0.03, 0.12);

                char.kneeL = THREE.MathUtils.lerp(char.kneeL, poseBoost && isFemale ? 0.16 : 0.04, 0.12);
                char.kneeR = THREE.MathUtils.lerp(char.kneeR, 0.04, 0.12);
                legs.left.continuousLeg.updateBend(char.kneeL);
                legs.right.continuousLeg.updateBend(char.kneeR);

                const baseOutZ = isFemale ? 0.14 : 0.09;
                const targetRightArmX = poseBoost ? -0.58 : -0.05;
                const targetRightArmZ = poseBoost ? 0.32 : baseOutZ + breath * 0.014;
                const targetRightElbow = poseBoost ? -0.56 : -0.22;

                const targetLeftArmX = poseBoost ? 0.10 : 0.02;
                const targetLeftArmZ = poseBoost ? -0.26 : -baseOutZ - breath * 0.014;
                const targetLeftElbow = poseBoost ? -0.46 : -0.18;

                arms.left.shoulder.rotation.x = THREE.MathUtils.lerp(arms.left.shoulder.rotation.x, targetLeftArmX, 0.12);
                arms.left.shoulder.rotation.z = THREE.MathUtils.lerp(arms.left.shoulder.rotation.z, targetLeftArmZ, 0.12);
                char.elbowL = THREE.MathUtils.lerp(char.elbowL, targetLeftElbow, 0.12);
                arms.left.continuousArm.updateBend(char.elbowL);

                arms.right.shoulder.rotation.x = THREE.MathUtils.lerp(arms.right.shoulder.rotation.x, targetRightArmX, 0.12);
                arms.right.shoulder.rotation.z = THREE.MathUtils.lerp(arms.right.shoulder.rotation.z, targetRightArmZ, 0.12);
                char.elbowR = THREE.MathUtils.lerp(char.elbowR, targetRightElbow, 0.12);
                arms.right.continuousArm.updateBend(char.elbowR);
            }

            // HER KAREDE ETEK KUMAŞ FİZİĞİNİ VE BACAK ÇARPIŞMA ÖNLEYİCİSİNİ ÇALIŞTIR
            if (char.updateSkirtClothPhysics) {
                char.updateSkirtClothPhysics(
                    legs.left.hip.rotation.x,
                    legs.right.hip.rotation.x,
                    isWalking ? speedRatio : (poseBoost ? 0.45 : 0.08),
                    elapsed,
                    char.phase
                );
            }

            if (wings) {
                const flapSpeed = isWalking ? 3.6 : (poseBoost ? 2.6 : 1.4);
                const flap = Math.sin(elapsed * flapSpeed) * (poseBoost ? 0.22 : 0.08);
                const spreadZ = poseBoost ? 0.34 : 0.06;
                const outerSpreadZ = poseBoost ? 0.28 : -0.08;

                wings.leftInner.rotation.y = THREE.MathUtils.lerp(wings.leftInner.rotation.y, -0.16 - flap, 0.1);
                wings.rightInner.rotation.y = THREE.MathUtils.lerp(wings.rightInner.rotation.y, 0.16 + flap, 0.1);
                wings.leftInner.rotation.z = THREE.MathUtils.lerp(wings.leftInner.rotation.z, -spreadZ, 0.1);
                wings.rightInner.rotation.z = THREE.MathUtils.lerp(wings.rightInner.rotation.z, spreadZ, 0.1);
                wings.leftOuter.rotation.z = THREE.MathUtils.lerp(wings.leftOuter.rotation.z, -outerSpreadZ, 0.1);
                wings.rightOuter.rotation.z = THREE.MathUtils.lerp(wings.rightOuter.rotation.z, outerSpreadZ, 0.1);
            }
        }

                const rad = 16.0;

                    name: `Tapınak Sakini #${i + 1}`,

                });

        // ==========================================
        // 12. KONTROLLER VE KAMERA ODAKLARI
        // ==========================================
        function bindInputEvents() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const maxR = 40;

            function moveJoy(cx, cy) {
                const rect = zone.getBoundingClientRect();
                let dx = cx - (rect.left + rect.width / 2);
                let dy = cy - (rect.top + rect.height / 2);
                const d = Math.hypot(dx, dy);
                if (d > maxR) {
                    dx = (dx / d) * maxR;
                    dy = (dy / d) * maxR;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyVec.x = dx / maxR;
                joyVec.y = dy / maxR;
            }

            zone.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                joyActive = true;
                joyPointerId = e.pointerId;
                moveJoy(e.clientX, e.clientY);
            });

            const canvas = renderer.domElement;
            canvas.style.touchAction = 'none';
            canvas.addEventListener('pointerdown', (e) => {
                canvas.setPointerCapture(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (joyActive && e.pointerId === joyPointerId) {
                    moveJoy(e.clientX, e.clientY);
                    return;
                }
                if (!activePointers.has(e.pointerId)) return;

                const prev = activePointers.get(e.pointerId);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 1) {
                    const dx = e.clientX - prev.x;
                    const dy = e.clientY - prev.y;
                    camYaw -= dx * 0.0085;
                    camPitch = Math.max(-0.20, Math.min(1.05, camPitch + dy * 0.0065));
                } else if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinchDist > 0) {
                        const diff = lastPinchDist - dist;
                        desiredDist = Math.max(0.85, Math.min(13.0, desiredDist + diff * 0.016));
                    }
                    lastPinchDist = dist;
                }
            });

            function clearPointer(e) {
                if (joyActive && e.pointerId === joyPointerId) {
                    joyActive = false;
                    joyPointerId = null;
                    joyVec.x = 0;
                    joyVec.y = 0;
                    knob.style.transform = 'translate(0px, 0px)';
                }
                activePointers.delete(e.pointerId);
                if (activePointers.size < 2) lastPinchDist = 0;
            }

            window.addEventListener('pointerup', clearPointer);
            window.addEventListener('pointercancel', clearPointer);

            window.addEventListener('wheel', (e) => {
                desiredDist = Math.max(0.85, Math.min(13.0, desiredDist + e.deltaY * 0.0035));
            });

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (k === 's' || e.key === 'ArrowDown') keys.s = true;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (k === 's' || e.key === 'ArrowDown') keys.s = false;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
            });
        }

        function enterWorldWithCharacter() {
            if (window.GameState && typeof window.GameState.teleportTo === 'function') {
                window.GameState.teleportTo('mısır.html');
            } else {
                window.location.href = 'mısır.html';
            }
        }

        function selectCharacter(idx) {
            activeIndex = idx;
            for (let i = 0; i < 13; i++) {
                const el = document.getElementById(`pill-${i}`);
                if (el) el.classList.toggle('active', i === idx);
            }

            const c = characters[idx];
            if (c) {
                const badgeTitle = document.getElementById('char-badge-title');
                const badgeDesc = document.getElementById('char-badge-desc');
                if (badgeTitle) badgeTitle.textContent = c.name;
                if (badgeDesc) badgeDesc.textContent = c.desc;

                if (window.GameState && typeof window.GameState.setCharacterRole === 'function') {
                    window.GameState.setCharacterRole(c.role);
                }
            }
            resetCameraView();
        }

        function toggleActionPose() {
            actionPoseActive = !actionPoseActive;
            const btn = document.getElementById('btn-wings');
            if (btn) {
                btn.classList.toggle('bg-amber-500/30', actionPoseActive);
                btn.classList.toggle('border-yellow-300', actionPoseActive);
            }
        }

        function resetCameraView() {
            const c = characters[activeIndex];
            if (!c) return;
            desiredTargetY = 0.98 * c.scale;
            desiredDist = 3.05 * c.scale;
            camPitch = 0.03;
        }

        function focusBodySculpt() {
            const c = characters[activeIndex];
            if (!c) return;
            desiredTargetY = 1.12 * c.scale;
            desiredDist = 1.48 * c.scale;
            camYaw = c.root.rotation.y + 0.36;
            camPitch = 0.04;
        }

        function focusFace() {
            const c = characters[activeIndex];
            if (!c) return;
            desiredTargetY = (c.isFemale ? 1.54 : 1.64) * c.scale;
            desiredDist = 1.10 * c.scale;
            camYaw = c.root.rotation.y + 0.08;
            camPitch = 0.01;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            const player = characters[activeIndex];
            if (!player) return;

            let ix = joyVec.x;
            let iy = joyVec.y;
            if (keys.w) iy = -1;
            if (keys.s) iy = 1;
            if (keys.a) ix = -1;
            if (keys.d) ix = 1;

            const mag = Math.min(1, Math.hypot(ix, iy));
            const moving = mag > 0.05;

            if (moving) {
                const fwdX = -Math.sin(camYaw);
                const fwdZ = -Math.cos(camYaw);
                const rightX = Math.cos(camYaw);
                const rightZ = -Math.sin(camYaw);

                const dirX = rightX * ix + fwdX * (-iy);
                const dirZ = rightZ * ix + fwdZ * (-iy);

                const speed = (2.3 + player.scale * 0.6) * mag;
                player.root.position.x += dirX * speed * delta;
                player.root.position.z += dirZ * speed * delta;

                const targetRot = Math.atan2(dirX, dirZ);
                let diff = targetRot - player.root.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                player.root.rotation.y += diff * 0.18;
            }

            animateCharacter(player, moving, mag, delta, elapsed, true);

            characters.forEach((c, idx) => {
                if (idx === activeIndex) return;

                if (idx >= 13) {
                    if (c.aiTimer > 0) {
                        c.aiTimer -= delta;
                        animateCharacter(c, false, 0, delta, elapsed, false);
                    } else {
                        const dx = c.aiTarget.x - c.root.position.x;
                        const dz = c.aiTarget.z - c.root.position.z;
                        const dist = Math.hypot(dx, dz);

                        if (dist < 0.35) {
                            c.aiTimer = 2.5 + Math.random() * 3.5;
                            const a = Math.random() * Math.PI * 2;
                            const r = 13.5 + Math.random() * 5.0;
                            c.aiTarget.set(Math.cos(a) * r, 0, Math.sin(a) * r);
                            animateCharacter(c, false, 0, delta, elapsed, false);
                        } else {
                            const spd = 1.55;
                            c.root.position.x += (dx / dist) * spd * delta;
                            c.root.position.z += (dz / dist) * spd * delta;

                            const tRot = Math.atan2(dx, dz);
                            let dRot = tRot - c.root.rotation.y;
                            while (dRot > Math.PI) dRot -= Math.PI * 2;
                            while (dRot < -Math.PI) dRot += Math.PI * 2;
                            c.root.rotation.y += dRot * 0.12;

                            animateCharacter(c, true, 0.72, delta, elapsed, false);
                        }
                    }
                } else {
                    animateCharacter(c, false, 0, delta, elapsed, false);
                }
            });

            if (divineParticles) {
                divineParticles.rotation.y = elapsed * 0.05;
                divineParticles.position.y = Math.sin(elapsed * 0.8) * 0.25;
            }

            camTargetY = THREE.MathUtils.lerp(camTargetY, desiredTargetY, 0.12);
            camDist = THREE.MathUtils.lerp(camDist, desiredDist, 0.12);

            const cx = player.root.position.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist;
            const cz = player.root.position.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist;
            const cy = Math.max(0.32, player.root.position.y + camTargetY + Math.sin(camPitch) * camDist * 0.75);

            camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.24);
            camera.lookAt(player.root.position.x, player.root.position.y + camTargetY, player.root.position.z);

            if (frontKeyLight) {
                frontKeyLight.position.set(camera.position.x, camera.position.y + 0.6, camera.position.z);
            }
            if (warmFillLight) {
                warmFillLight.position.set(player.root.position.x + 1.5, player.root.position.y + 1.2, player.root.position.z + 1.5);
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
